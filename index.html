<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Inteligência Operacional · Realtec Engenharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DESIGN — escala 4px, uma gramática para tudo
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* superfícies */
  --sup-0:#F6F8FB;   /* fundo da página */
  --sup-1:#FFFFFF;   /* cartão */
  --sup-2:#F1F5F9;   /* realce sutil */
  --sup-lei:#FCFBF8; /* papel — só texto oficial */

  /* linhas */
  --l-1:#E6EBF2;     /* divisória */
  --l-2:#D2DBE6;     /* borda de controle */

  /* texto */
  --t-1:#0D1826;     /* principal */
  --t-2:#526277;     /* secundário */
  --t-3:#8494A8;     /* terciário */

  /* marca */
  --m-900:#08203A;
  --m-700:#123A5E;
  --az:#1B6BD6;
  --az-f:#1454AE;
  --az-bg:#EDF4FD;

  /* estados — usados só em pontos pequenos */
  --vm:#C0332B; --vm-bg:#FDF0EF;
  --am:#B0620E; --am-bg:#FDF4EA;
  --vd:#137A50; --vd-bg:#E9F7F0;

  --sombra:0 1px 2px rgba(13,24,38,.05);
  --sombra-m:0 4px 16px -6px rgba(13,24,38,.14),0 1px 3px rgba(13,24,38,.06);
  --sombra-g:0 24px 60px -16px rgba(8,32,58,.24),0 4px 12px rgba(8,32,58,.08);

  --r-g:14px; --r-m:10px; --r-p:7px;
  --lat:236px;
  --tr:150ms cubic-bezier(.2,0,0,1);
  --sb:env(safe-area-inset-bottom,0px);
}
html[data-tema="escuro"]{
  --sup-0:#0A0E15; --sup-1:#131A24; --sup-2:#1A2330; --sup-lei:#161D28;
  --l-1:#242E3C; --l-2:#34404F;
  --t-1:#E9EEF5; --t-2:#98A8BC; --t-3:#6F7F94;
  --m-900:#D8E4F2; --m-700:#A9C1DC;
  --az:#4E93EE; --az-f:#6BA6F5; --az-bg:#152538;
  --vm:#EE8078; --vm-bg:#2A1514;
  --am:#E39D5F; --am-bg:#291B10;
  --vd:#5CC698; --vd-bg:#0E2219;
  --sombra:none;
  --sombra-m:0 4px 16px -6px rgba(0,0,0,.5);
  --sombra-g:0 24px 60px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--sup-0);color:var(--t-1);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background var(--tr),color var(--tr)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--az);outline-offset:2px;border-radius:5px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic-p{width:15px;height:15px}.ic-g{width:22px;height:22px}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ─────────── ESTRUTURA ─────────── */
.app{display:flex;min-height:100vh}

.lat{width:var(--lat);flex:none;background:var(--sup-1);border-right:1px solid var(--l-1);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.lat-topo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;flex:none;border-radius:8px;background:var(--m-900);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:11.5px;letter-spacing:-.02em}
html[data-tema="escuro"] .logo{background:var(--az);color:#0A0E15}
.lat-topo b{display:block;font-size:12.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.lat-topo s{display:block;font-size:10.5px;color:var(--t-3);text-decoration:none}
.lat-nav{flex:1;overflow-y:auto;padding:4px 10px 12px;scrollbar-width:thin}
.lat-nav::-webkit-scrollbar{width:5px}
.lat-nav::-webkit-scrollbar-thumb{background:var(--l-2);border-radius:3px}
.lat-g{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t-3);
  padding:16px 8px 6px}
.lat-i{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r-p);
  color:var(--t-2);font-size:13px;font-weight:500;text-align:left;transition:background var(--tr),color var(--tr)}
.lat-i:hover{background:var(--sup-2);color:var(--t-1)}
.lat-i.on{background:var(--az-bg);color:var(--az-f);font-weight:600}
.lat-i .q{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;
  background:var(--vm-bg);color:var(--vm)}
.lat-i .q.calmo{background:var(--sup-2);color:var(--t-3)}
.lat-pe{border-top:1px solid var(--l-1);padding:10px}
.perfil{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--r-p);text-align:left}
.perfil:hover{background:var(--sup-2)}
.av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--az-bg);color:var(--az-f);
  display:grid;place-items:center;font-size:11px;font-weight:700}
.perfil b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.perfil s{display:block;font-size:10.5px;color:var(--t-3);text-decoration:none}

.corpo{flex:1;min-width:0;display:flex;flex-direction:column}

/* ─────────── BARRA SUPERIOR ─────────── */
.topo{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--sup-0) 86%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--l-1)}
.topo-in{max-width:1120px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:12px}
.bt-i{width:34px;height:34px;flex:none;border-radius:var(--r-p);display:grid;place-items:center;
  color:var(--t-2);transition:background var(--tr),color var(--tr)}
.bt-i:hover{background:var(--sup-2);color:var(--t-1)}
.menu-m{display:none}
.busca{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;
  flex-shrink:1;min-width:0;
  background:var(--sup-1);border:1px solid var(--l-1);border-radius:var(--r-m);
  color:var(--t-3);font-size:13px;text-align:left;transition:border-color var(--tr)}
.busca:hover{border-color:var(--l-2)}
.busca span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tecla{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 6px;border-radius:5px;
  border:1px solid var(--l-1);background:var(--sup-2);color:var(--t-3)}
.topo-d{margin-left:auto;display:flex;align-items:center;gap:4px}

/* ─────────── FAIXA DE RISCO ─────────── */
.risco{border-bottom:1px solid var(--l-1);background:var(--sup-1)}
.risco-in{max-width:1120px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:11px}
.farol{width:9px;height:9px;flex:none;border-radius:50%;position:relative}
.farol::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  animation:pf 2.8s cubic-bezier(.2,0,0,1) infinite}
.r-vm .farol{background:var(--vm)} .r-vm .farol::after{box-shadow:0 0 0 0 var(--vm)}
.r-am .farol{background:var(--am)} .r-am .farol::after{box-shadow:0 0 0 0 var(--am)}
.r-vd .farol{background:var(--vd)} .r-vd .farol::after{box-shadow:0 0 0 0 var(--vd)}
@keyframes pf{0%{opacity:.45}70%{box-shadow:0 0 0 9px transparent;opacity:0}100%{opacity:0}}
.risco-t{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.r-vm .risco-t{color:var(--vm)} .r-am .risco-t{color:var(--am)} .r-vd .risco-t{color:var(--vd)}
.risco-d{font-size:12.5px;color:var(--t-2)}
.risco-a{margin-left:auto;font-size:12px;font-weight:600;color:var(--az-f);display:flex;align-items:center;gap:4px;flex:none}

/* ─────────── CONTEÚDO ─────────── */
.pag{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:28px 24px 96px}

.cab{margin-bottom:22px}
.cab h1{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.22}
.cab p{margin-top:5px;font-size:14px;color:var(--t-2)}

/* atalhos — "ir direto ao que busca" */
.atalhos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.at{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:99px;
  background:var(--sup-1);border:1px solid var(--l-1);font-size:13px;font-weight:500;color:var(--t-2);
  transition:border-color var(--tr),color var(--tr),background var(--tr)}
.at:hover{border-color:var(--l-2);color:var(--t-1)}
.at.on{background:var(--az-bg);border-color:var(--az);color:var(--az-f);font-weight:600}
.at b{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:0 5px;border-radius:5px;
  background:var(--sup-2);color:var(--t-2)}
.at.on b{background:var(--sup-1);color:var(--az-f)}
.at .pt{width:6px;height:6px;border-radius:50%;flex:none}
.at .pt.vm{background:var(--vm)} .at .pt.am{background:var(--am)} .at .pt.vd{background:var(--vd)}

/* seção */
.sec{margin-bottom:30px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;
  padding-bottom:9px;border-bottom:1px solid var(--l-1)}
.sec-h h2{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t-2)}
.sec-h .c{font-size:11.5px;color:var(--t-3);font-family:'IBM Plex Mono',monospace}
.sec-h .l{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--az-f);
  display:flex;align-items:center;gap:4px}

/* ═══ CARTÃO: uma anatomia para todo o sistema ═══
   meta → título → resumo → rodapé                        */
.ct{display:block;width:100%;text-align:left;background:var(--sup-1);border:1px solid var(--l-1);
  border-radius:var(--r-g);padding:0;margin-bottom:9px;box-shadow:var(--sombra);
  transition:border-color var(--tr),box-shadow var(--tr),transform var(--tr)}
button.ct:hover{border-color:var(--l-2);box-shadow:var(--sombra-m);transform:translateY(-1px)}
button.ct:active{transform:none}
.ct-in{padding:15px 17px}
.ct-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px;
  font-size:11.5px;color:var(--t-3);line-height:1.4;min-height:20px}
.ct-meta .sep{width:2.5px;height:2.5px;border-radius:50%;background:var(--l-2)}
.ct h3{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.4;margin-bottom:6px}
.ct .rz{font-size:13.5px;color:var(--t-2);line-height:1.58}
.ct-pe{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;
  padding:11px 17px;border-top:1px solid var(--l-1);background:var(--sup-2);
  border-radius:0 0 var(--r-g) var(--r-g);min-height:44px}
.ct-pe .ac{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--az-f);
  display:flex;align-items:center;gap:5px;flex:none}

/* etiquetas */
.et{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  letter-spacing:.015em;padding:2px 8px;border-radius:99px;border:1px solid transparent}
.et .pt{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.et.vm{background:var(--vm-bg);color:var(--vm)}
.et.am{background:var(--am-bg);color:var(--am)}
.et.vd{background:var(--vd-bg);color:var(--vd)}
.et.nt{background:var(--sup-2);color:var(--t-2);border-color:var(--l-1)}
.et.va{background:transparent;border-color:var(--l-1);color:var(--t-3);font-weight:500}
.area{font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:5px;
  background:var(--az-bg);color:var(--az-f)}
.areas{display:flex;gap:4px;flex-wrap:wrap}

/* prazo */
.pz{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--t-2)}
.pz.urg{color:var(--vm);font-weight:600}

/* ═══ PAINEL DE NÚMEROS ═══ */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:26px}
.nm{background:var(--sup-1);border:1px solid var(--l-1);border-radius:var(--r-g);padding:14px 15px;
  text-align:left;transition:border-color var(--tr)}
button.nm:hover{border-color:var(--l-2)}
.nm .v{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;font-family:'IBM Plex Mono',monospace}
.nm .r{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:11.5px;color:var(--t-2);font-weight:500}
.nm .r .pt{width:6px;height:6px;border-radius:50%;flex:none}
.nm.vm .v{color:var(--vm)} .nm.vm .pt{background:var(--vm)}
.nm.am .v{color:var(--am)} .nm.am .pt{background:var(--am)}
.nm.vd .v{color:var(--vd)} .nm.vd .pt{background:var(--vd)}
.nm.nt .pt{background:var(--t-3)}

/* ═══ TEXTO OFICIAL — a assinatura ═══ */
.lei{background:var(--sup-lei);border-left:2.5px solid var(--m-700);
  border-radius:0 var(--r-m) var(--r-m) 0;padding:14px 16px;margin:12px 0}
html[data-tema="escuro"] .lei{border-left-color:var(--az)}
.lei p{font-family:'Source Serif 4',Georgia,serif;font-size:14.5px;line-height:1.66;color:var(--t-1)}
.lei .fn{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:var(--t-3);
  font-family:'Inter',sans-serif}

/* ═══ DETALHE / PASSOS ═══ */
.voltar{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
  color:var(--t-2);margin-bottom:16px;padding:5px 0}
.voltar:hover{color:var(--t-1)}
.bl{background:var(--sup-1);border:1px solid var(--l-1);border-radius:var(--r-g);
  padding:18px;margin-bottom:10px;box-shadow:var(--sombra)}
.bl-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bl-n{width:24px;height:24px;flex:none;border-radius:7px;background:var(--az-bg);color:var(--az-f);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.bl-h strong{font-size:14px;font-weight:600;letter-spacing:-.01em}
.bl p{font-size:14px;line-height:1.68;color:var(--t-1)}
.bl p+p{margin-top:10px}

.av-risco{display:flex;gap:12px;padding:14px 15px;border-radius:var(--r-m);border:1px solid}
.av-risco.vm{background:var(--vm-bg);border-color:color-mix(in srgb,var(--vm) 22%,transparent)}
.av-risco.am{background:var(--am-bg);border-color:color-mix(in srgb,var(--am) 22%,transparent)}
.av-risco .i{flex:none;margin-top:1px}
.av-risco.vm .i{color:var(--vm)} .av-risco.am .i{color:var(--am)}
.av-risco b{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.av-risco.vm b{color:var(--vm)} .av-risco.am b{color:var(--am)}
.av-risco p{font-size:13.2px;line-height:1.6;color:var(--t-2)}

.lin{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--l-1)}
.lin:last-child{border-bottom:none;padding-bottom:0}
.lin:first-child{padding-top:0}
.lin .mk{flex:none;margin-top:1px}
.lin.sim .mk{color:var(--vd)} .lin.nao .mk{color:var(--t-3)}
.lin b{font-size:13.5px;font-weight:600;flex:none;width:104px}
.lin span{font-size:13px;color:var(--t-2);line-height:1.55;flex:1}
.lin.nao b,.lin.nao span{color:var(--t-3)}

.tarefa{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--l-1)}
.tarefa:last-child{border-bottom:none}
.cx{width:20px;height:20px;flex:none;border:1.7px solid var(--l-2);border-radius:6px;margin-top:1px;
  display:grid;place-items:center;color:transparent;transition:all var(--tr)}
.cx:hover{border-color:var(--az)}
.cx.ok{background:var(--vd);border-color:var(--vd);color:#fff}
.tf{flex:1;min-width:0}
.tf p{font-size:13.8px;line-height:1.5}
.tf.ok p{color:var(--t-3);text-decoration:line-through}
.tf s{display:block;font-size:11.5px;color:var(--t-3);text-decoration:none;margin-top:3px}

/* como impacta a empresa */
.impacto-emp{background:var(--az-bg);border:1px solid color-mix(in srgb,var(--az) 26%,transparent);
  border-radius:var(--r-g);padding:18px;margin-bottom:10px}
.impacto-emp .h{display:flex;align-items:center;gap:9px;margin-bottom:11px;color:var(--az-f)}
.impacto-emp .h strong{font-size:14px;font-weight:700;letter-spacing:-.01em}
.impacto-emp p{font-size:14px;line-height:1.68}

/* clientes */
.cli{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--l-1)}
.cli:last-child{border-bottom:none}
.cli-a{width:34px;height:34px;flex:none;border-radius:9px;background:var(--sup-2);color:var(--t-2);
  display:grid;place-items:center;font-size:11.5px;font-weight:700}
.cli-t{flex:1;min-width:0}
.cli-t b{display:block;font-size:13.5px;font-weight:600}
.cli-t s{display:block;font-size:11.5px;color:var(--t-3);text-decoration:none;margin-top:1px}
.cli-b{flex:none;font-size:11.5px;font-weight:600;color:var(--az-f);padding:6px 10px;
  border-radius:var(--r-p);background:var(--az-bg)}
.motivo{padding:12px 14px;margin-bottom:4px;background:var(--sup-2);border-radius:var(--r-m);
  font-size:12.8px;line-height:1.6;color:var(--t-2)}
.motivo b{color:var(--t-1);font-weight:600}
.cadeia{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px}
.elo{font-size:11px;padding:2.5px 8px;border-radius:99px;background:var(--sup-1);
  border:1px solid var(--l-1);color:var(--t-2)}

/* tabela / lista */
.lista{background:var(--sup-1);border:1px solid var(--l-1);border-radius:var(--r-g);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;
  border-bottom:1px solid var(--l-1);transition:background var(--tr)}
.li:first-child{border-radius:var(--r-g) var(--r-g) 0 0}
.li:last-child{border-radius:0 0 var(--r-g) var(--r-g)}
.li:last-child{border-bottom:none}
.li:hover{background:var(--sup-2)}
.li-t{flex:1;min-width:0}
.li-t b{display:block;font-size:13.5px;font-weight:500;line-height:1.4}
.li-t s{display:block;font-size:11.5px;color:var(--t-3);text-decoration:none;margin-top:2px}
.li .ch{flex:none;color:var(--t-3)}

.vazio{padding:40px 20px;text-align:center}
.vazio .i{color:var(--t-3);margin-bottom:10px}
.vazio b{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px}
.vazio p{font-size:13px;color:var(--t-2)}

.tag{display:inline-block;font-size:11px;font-weight:500;padding:2.5px 9px;border-radius:99px;
  background:var(--sup-2);color:var(--t-2);border:1px solid var(--l-1)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 17px;
  border-radius:var(--r-m);font-size:13.5px;font-weight:600;transition:background var(--tr)}
.bt.pr{background:var(--m-900);color:#fff}
.bt.pr:hover{background:var(--m-700)}
html[data-tema="escuro"] .bt.pr{background:var(--az);color:#0A0E15}
.bt.sc{background:var(--sup-1);border:1px solid var(--l-1);color:var(--t-2)}
.bt.sc:hover{border-color:var(--l-2);color:var(--t-1)}
.bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ═══════════════════════════════════════════════
   IA AO CANTO
   ═══════════════════════════════════════════════ */
.ia-doca{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;
  align-items:flex-end;gap:10px;pointer-events:none}
.ia-doca>*{pointer-events:auto}

.ia-fala{max-width:290px;background:var(--sup-1);border:1px solid var(--l-1);
  border-radius:var(--r-g) var(--r-g) 4px var(--r-g);padding:13px 15px;box-shadow:var(--sombra-g);
  opacity:0;transform:translateY(6px) scale(.97);transition:all 260ms cubic-bezier(.2,0,0,1);
  pointer-events:none}
.ia-fala.on{opacity:1;transform:none;pointer-events:auto}
.ia-fala p{font-size:13.2px;line-height:1.55;color:var(--t-1)}
.ia-fala .aq{display:flex;gap:8px;margin-top:11px}
.ia-fala .aq button{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:var(--r-p)}
.ia-fala .aq .s{background:var(--az-bg);color:var(--az-f)}
.ia-fala .aq .n{color:var(--t-3)}
.ia-fala .aq .n:hover{color:var(--t-2)}

.ia-bt{width:52px;height:52px;border-radius:50%;background:var(--m-900);color:#fff;
  display:grid;place-items:center;box-shadow:var(--sombra-g);position:relative;
  transition:transform var(--tr),background var(--tr)}
.ia-bt:hover{transform:scale(1.05)}
.ia-bt:active{transform:scale(.97)}
html[data-tema="escuro"] .ia-bt{background:var(--az);color:#0A0E15}
.ia-bt .pn{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;
  background:var(--vm);border:2.5px solid var(--sup-0)}

/* painel da IA */
.ia-pn{position:fixed;right:22px;bottom:22px;z-index:70;width:min(400px,calc(100vw - 44px));
  height:min(620px,calc(100vh - 44px));background:var(--sup-1);border:1px solid var(--l-1);
  border-radius:16px;box-shadow:var(--sombra-g);display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateY(12px) scale(.98);pointer-events:none;
  transition:all 240ms cubic-bezier(.2,0,0,1)}
.ia-pn.on{opacity:1;transform:none;pointer-events:auto}
.ia-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--l-1)}
.ia-av{width:30px;height:30px;flex:none;border-radius:8px;background:var(--m-900);color:#fff;
  display:grid;place-items:center}
html[data-tema="escuro"] .ia-av{background:var(--az);color:#0A0E15}
.ia-h b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.ia-h s{display:block;font-size:10.5px;color:var(--t-3);text-decoration:none}
.ia-corpo{flex:1;overflow-y:auto;padding:16px;scrollbar-width:thin}
.ia-corpo::-webkit-scrollbar{width:5px}
.ia-corpo::-webkit-scrollbar-thumb{background:var(--l-2);border-radius:3px}
.ia-pe{padding:12px 14px;border-top:1px solid var(--l-1);background:var(--sup-2)}
.ia-campo{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--sup-1);
  border:1px solid var(--l-1);border-radius:var(--r-m)}
.ia-campo input{flex:1;border:none;background:none;outline:none;font:inherit;font-size:13.5px;color:var(--t-1)}
.ia-campo input::placeholder{color:var(--t-3)}
.ia-env{width:28px;height:28px;flex:none;border-radius:7px;background:var(--m-900);color:#fff;display:grid;place-items:center}
html[data-tema="escuro"] .ia-env{background:var(--az);color:#0A0E15}

.msg-u{max-width:85%;margin-left:auto;background:var(--az-bg);padding:10px 13px;
  border-radius:12px 12px 3px 12px;font-size:13.5px;line-height:1.5;margin-bottom:16px}
.msg-a{margin-bottom:20px}
.msg-a .qm{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:11px;
  font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t-3)}
.msg-a .tx{font-size:13.5px;line-height:1.62}
.msg-a .tx+.tx{margin-top:9px}
.mini{background:var(--sup-2);border-radius:var(--r-m);padding:12px 14px;margin-top:11px}
.mini b{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--t-3);margin-bottom:6px}
.mini p{font-size:13px;line-height:1.58;color:var(--t-2)}
.pensa{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t-3)}
.pensa i{width:4.5px;height:4.5px;border-radius:50%;background:var(--t-3);display:inline-block;
  animation:pisca 1.3s ease-in-out infinite}
.pensa i:nth-child(2){animation-delay:.18s} .pensa i:nth-child(3){animation-delay:.36s}
@keyframes pisca{0%,60%,100%{opacity:.28}30%{opacity:1}}
.atalho-ia{display:block;width:100%;text-align:left;padding:10px 13px;margin-bottom:7px;
  border:1px solid var(--l-1);border-radius:var(--r-m);font-size:13px;color:var(--t-2);
  transition:border-color var(--tr),background var(--tr),color var(--tr)}
.atalho-ia:hover{border-color:var(--az);background:var(--az-bg);color:var(--az-f)}
.conf-x{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:var(--r-m);
  border:1px solid var(--l-1);margin-top:12px}
.conf-x .fx{flex:none;text-align:center;padding-right:11px;border-right:1px solid var(--l-1)}
.conf-x .fx b{display:block;font-size:12px;font-weight:700}
.conf-x .fx s{display:block;font-size:10px;color:var(--t-3);text-decoration:none;margin-top:2px;
  font-family:'IBM Plex Mono',monospace}
.conf-x p{font-size:12px;line-height:1.55;color:var(--t-2)}
.f-muito_alto{color:var(--vd)}.f-alto{color:var(--az-f)}.f-moderado{color:var(--am)}.f-baixo{color:var(--vm)}
.dvg{border:1px solid color-mix(in srgb,var(--am) 26%,transparent);background:var(--am-bg);
  border-radius:var(--r-m);padding:13px 15px;margin-top:12px}
.dvg .h{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--am)}
.dvg .h b{font-size:12.5px;font-weight:700}
.dvg .p{padding:9px 0;border-top:1px solid color-mix(in srgb,var(--am) 20%,transparent)}
.dvg .p:first-of-type{border-top:none;padding-top:0}
.dvg .p b{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.dvg .p p{font-size:12.8px;line-height:1.55}
.dvg .o{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--am) 20%,transparent);
  font-size:12.5px;line-height:1.55;color:var(--am);font-weight:500}
.veu{position:fixed;inset:0;z-index:65;background:rgba(8,32,58,.2);opacity:0;pointer-events:none;
  transition:opacity 240ms ease}
.veu.on{opacity:1;pointer-events:auto}

/* ═══ PALETA ⌘K ═══ */
.pl-veu{position:fixed;inset:0;z-index:80;background:rgba(8,32,58,.32);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.pl-veu.on{display:flex;animation:fade 120ms ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pl{width:100%;max-width:580px;background:var(--sup-1);border:1px solid var(--l-1);border-radius:14px;
  box-shadow:var(--sombra-g);overflow:hidden;animation:sobe 180ms cubic-bezier(.2,0,0,1)}
@keyframes sobe{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.pl-h{display:flex;align-items:center;gap:11px;padding:14px 17px;border-bottom:1px solid var(--l-1)}
.pl-h input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--t-1);font-family:inherit}
.pl-h input::placeholder{color:var(--t-3)}
.pl-b{max-height:min(50vh,400px);overflow-y:auto;padding:7px}
.pl-g{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t-3);padding:10px 10px 4px}
.pl-i{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-p)}
.pl-i.mk{background:var(--az-bg)}
.pl-ic{width:28px;height:28px;flex:none;border-radius:7px;background:var(--sup-2);color:var(--t-2);display:grid;place-items:center}
.pl-i.mk .pl-ic{background:var(--sup-1);color:var(--az-f)}
.pl-t{flex:1;min-width:0}
.pl-t b{display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-t s{display:block;font-size:11.5px;color:var(--t-3);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-f{display:flex;gap:15px;padding:9px 16px;border-top:1px solid var(--l-1);background:var(--sup-2);
  font-size:11px;color:var(--t-3)}

/* ═══════════════════════════════════════════════════════════════
   ADAPTAÇÃO — UM SISTEMA, QUATRO LARGURAS
   Mesmo HTML, mesmo JavaScript, mesmas funções. Só o arranjo muda.

     CELULAR    < 768px   navegação inferior · coluna única
     TABLET     768–1023  navegação inferior · grade de 4
     NOTEBOOK   1024–1439 lateral fixa · conteúdo 1120px
     MONITOR    ≥ 1440    lateral fixa · conteúdo 1280px
   ═══════════════════════════════════════════════════════════════ */
.nav-m{display:none}

/* ─────── CELULAR E TABLET (< 1024) ─────── */
@media (max-width:1023px){
  .lat{position:fixed;left:0;top:0;z-index:90;transform:translateX(-100%);
    transition:transform 240ms cubic-bezier(.2,0,0,1);box-shadow:var(--sombra-g)}
  .lat.on{transform:none}
  .menu-m{display:grid}
  .topo-in{padding:0 16px;gap:9px}
  .risco-in{padding:10px 16px;gap:9px}
  .pag{padding:20px 16px calc(76px + var(--sb))}
  .cab h1{font-size:21px}
  .busca span{display:none}
  .busca{max-width:none;flex:none;width:36px;padding:0;justify-content:center}
  .busca .tecla{display:none}

  .nav-m{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sup-1);
    border-top:1px solid var(--l-1);padding-bottom:var(--sb);box-shadow:0 -2px 16px rgba(13,24,38,.06)}
  .nav-m button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;color:var(--t-3);font-size:10px;font-weight:500;position:relative}
  .nav-m button.on{color:var(--az-f);font-weight:600}
  .nav-m button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:24px;height:2.5px;border-radius:0 0 3px 3px;background:var(--az)}
  .nav-m .q{position:absolute;top:7px;right:calc(50% - 18px);min-width:15px;height:15px;padding:0 4px;
    border-radius:99px;background:var(--vm);color:#fff;font-size:9px;font-weight:700;
    display:grid;place-items:center;line-height:1}

  .ia-doca{right:16px;bottom:calc(70px + var(--sb))}
  .ia-pn{right:0;left:0;bottom:0;width:100%;height:86vh;border-radius:16px 16px 0 0;transform:translateY(24px)}
}

/* ─────── CELULAR (< 768) ─────── */
@media (max-width:767px){
  .risco-d{display:none}
  .nums{grid-template-columns:1fr 1fr;gap:8px}
  .ct-in{padding:14px 15px}
  .ct-pe{padding:10px 15px}
  .lin{flex-wrap:wrap;gap:8px}
  .lin b{width:auto}
  .lin span{width:100%;padding-left:26px}
  .cab h1{font-size:20px}
  .atalhos{gap:6px}
  .at{padding:7px 11px;font-size:12.5px}
  /* alvos de toque nunca abaixo de 44px */
  .cx{width:24px;height:24px}
  .cli-b{padding:9px 12px}
  .bt{height:44px}
}

/* ─────── TABLET (768–1023) ─────── */
@media (min-width:768px) and (max-width:1023px){
  .pag{padding:24px 28px calc(78px + var(--sb));max-width:820px}
  .nums{grid-template-columns:repeat(4,1fr)}
  .risco-in{padding:11px 28px}
  .topo-in{padding:0 28px}
  .busca{width:auto;flex:1;max-width:340px;padding:0 12px;justify-content:flex-start}
  .busca span{display:block}
  .cab h1{font-size:23px}
}

/* ─────── NOTEBOOK (≥ 1024) ─────── */
@media (min-width:1024px){
  .lat{display:flex}
  .ia-doca{right:22px;bottom:22px}
}

/* ─────── MONITOR GRANDE (≥ 1440) ─────── */
@media (min-width:1440px){
  :root{--lat:256px}
  .topo-in,.risco-in,.pag{max-width:1340px}
  .nums{gap:12px}
  .pag{padding:32px 32px 96px}
}

/* ─────── NOTEBOOK DE TELA BAIXA (1366×768 e afins) ─────── */
@media (min-width:1024px) and (max-height:800px){
  .topo-in{height:50px}
  .risco-in{padding:8px 24px}
  .pag{padding-top:22px}
  .cab{margin-bottom:18px}
  .nums{margin-bottom:20px}
  .sec{margin-bottom:24px}
  .ia-pn{height:min(560px,calc(100vh - 36px))}
}

/* ─────── CELULAR DEITADO ─────── */
@media (max-height:520px) and (orientation:landscape){
  .risco{display:none}
  .ia-pn{height:96vh}
  .nav-m button{min-height:48px;font-size:9.5px}
}

/* ─────── TELAS SENSÍVEIS AO TOQUE ─────── */
@media (hover:none){
  button.ct:hover{transform:none;box-shadow:var(--sombra);border-color:var(--l-1)}
  .ia-bt:hover{transform:none}
  button.ct:active{background:var(--sup-2)}
  .li:active{background:var(--sup-2)}
}

/* ─────── IMPRESSÃO (anexar análise a processo) ─────── */
@media print{
  .lat,.nav-m,.topo,.risco,.ia-doca,.ia-pn,.veu,.bts,.voltar{display:none!important}
  body{background:#fff}
  .pag{max-width:none;padding:0}
  .ct,.bl{break-inside:avoid;box-shadow:none;border-color:#ccc}
  .lei{background:#fafafa}
}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="app">

  <aside class="lat" id="lat">
    <div class="lat-topo">
      <div class="logo">RE</div>

      body: JSON.stringify(args)});

async function carregarSessao(){
  if(!SB.tk()) return;
  try{

    if(!c || c.erro) throw new Error(c && c.erro || 'sem contexto');
    CTX = c;
    USUARIO.nome = c.usuario.nome;

async function fazerLogin(){
  const e=document.getElementById('loginEmail').value.trim();
  const p=document.getElementById('loginSenha').value;
  const erro=document.getElementById('loginErro');

  if(!e||!p){ erro.textContent='Preencha e-mail e senha.'; erro.style.display='block'; return; }
  bt.textContent='Entrando…'; erro.style.display='none';
  try{

    bt.textContent='Entrar';
  }

    ${m.oficial?`<div class="lei"><p>${m.oficial}</p>
      <div class="fn"><svg class="ic ic-p"><use href="#k-link"/></svg>Texto oficial · ${m.ref}</div></div>`:''}`)}
  ${B(2,'Qual o impacto?',`<p>${s.impacto}</p>`)}
  ${B(3,'Qual o risco?',`<div class="av-risco ${s.risco.n}">
    <svg class="ic ic-g i"><use href="#k-alerta"/></svg>
    <div><b>${s.risco.t}</b><p>${s.risco.d}</p></div></div>`)}
  ${B(4,'Quem é afetado?',s.afetados.map(a=>`<div class="lin ${a.sim?'sim':'nao'}">
    <svg class="ic ic-p mk"><use href="#${a.sim?'k-ok':'k-menos'}"/></svg>
    <b>${a.a}</b><span>${a.s}</span></div>`).join(''))}
  ${B(5,'O que precisa ser feito?',s.fazer.map(f=>`<div class="tarefa">
    <div class="cx" onclick="tick(this)"><svg class="ic ic-p"><use href="#k-tick"/></svg></div>
    <div class="tf"><p>${f.t}</p><s>${f.r} · até ${f.p}</s></div></div>`).join('')
    +`<div class="bts"><button class="bt sc" onclick="ir('acoes')">
      Abrir plano completo <svg class="ic ic-p"><use href="#k-dir"/></svg></button></div>`)}

  <div class="impacto-emp">
    <div class="h"><svg class="ic"><use href="#k-empresa"/></svg><strong>Como isso impacta a Realtec?</strong></div>
    <p>${s.empresa}</p>

  <div class="bts">
    <button class="bt pr" onclick="abrirIa();iaPergunta('${m.id}')">

    <button class="bt sc" onclick="ir('comparador')">Comparar versões</button>
  </div>`;

/* ═══════════════ IA AO CANTO ═══════════════ */
function abrirIa(){
  iaAberta=true;
  document.getElementById('iaPn').classList.add('on');
  document.getElementById('veuIa').classList.add('on');
  document.getElementById('iaPonto').style.display='none';
  document.getElementById('iaFala').classList.remove('on');
  iaRender();
  setTimeout(()=>{const i=document.getElementById('iaInput'); if(window.innerWidth>1023&&i)i.focus();},260);
}
function fecharIa(){
  iaAberta=false;
  document.getElementById('iaPn').classList.remove('on');
  document.getElementById('veuIa').classList.remove('on');
}

function iaRender(){
  const c=document.getElementById('iaCorpo');
  if(!conversa.length){
    c.innerHTML=`<div class="msg-a">
      <div class="tx">${primeiroNome() ? `${saudacaoHora()}, ${primeiroNome()}.` : `${saudacaoHora()}.`} Acompanho legislação trabalhista, normas de segurança, folha, tributos e jurisprudência.</div>

    </div>
    <div style="font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
      color:var(--t-3);margin:18px 0 9px">Perguntas frequentes</div>
    ${[['Posso demitir uma gestante em contrato de experiência?','gestante'],
       ['O que mudou na NR-1?','nr1'],['O que preciso fazer sobre a NR-35?','nr35'],
       ['Qual o prazo de validade de um crachá funcional?','abst']]
      .map(([q,k])=>`<button class="atalho-ia" onclick="iaPergunta('${k}')">${q}</button>`).join('')}`;
    return;
  }
  c.innerHTML=conversa.map(iaTurno).join('');
  c.scrollTop=c.scrollHeight;
}

function iaTurno(t){
  if(t.u) return `<div class="msg-u">${t.u}</div>`;
  if(t.p) return `<div class="msg-a"><div class="pensa"><i></i><i></i><i></i> Consultando o acervo…</div></div>`;
  if(t.api) return iaTurnoAPI(t.api);

  if(t.k==='abst') return `<div class="msg-a">
    <div class="av-risco am"><svg class="ic ic-g i"><use href="#k-alerta"/></svg>
      <div><b>Sem fundamento suficiente</b><p style="color:var(--t-1);margin-top:4px">${ABST.t}</p></div></div>
    <div class="tx" style="margin-top:11px">${ABST.d}</div>
    <div class="tx" style="color:var(--t-2);font-size:12.8px">${ABST.s}</div></div>`;

  if(t.k==='gestante'){
    const r=GESTANTE;
    return `<div class="msg-a">
      <div class="qm"><svg class="ic ic-p"><use href="#k-ia"/></svg>Resposta objetiva</div>
      <div class="tx">${r.objetiva}</div>

        <div class="fn"><svg class="ic ic-p"><use href="#k-link"/></svg>${r.ref}</div></div>
      <div class="dvg"><div class="h"><svg class="ic ic-p"><use href="#k-balanca"/></svg>
        <b>Divergência entre tribunais</b></div>
        ${r.divergencia.map(p=>`<div class="p"><b>${p.t}</b><p>${p.s}</p></div>`).join('')}
        <div class="o">${r.orientacao}</div></div>
      <div class="mini"><b>Como isso impacta a Realtec</b><p>${r.empresa}</p></div>
      <div class="conf-x"><div class="fx"><b class="f-alto">Alto</b><s>${r.conf.v}</s></div>
        <p>${r.conf.m}</p></div></div>`;
  }

  const m=MUDANCAS.find(x=>x.id===t.k);
  if(!m||!m.seis) return '';
  return `<div class="msg-a">
    <div class="qm"><svg class="ic ic-p"><use href="#k-ia"/></svg>O que mudou</div>
    <div class="tx">${m.seis.mudou}</div>
    <div class="av-risco ${m.seis.risco.n}" style="margin-top:12px">

    <button class="atalho-ia" style="margin-top:12px" onclick="fecharIa();ir('det:${m.id}')">
      Abrir análise completa →</button></div>`;
}

/* Renderiza a resposta real vinda da Edge Function, no mesmo formato
   visual das respostas de demonstração.                              */
function iaTurnoAPI(r){
  if(r.abstencao||r.origem==='bloqueada') return `<div class="msg-a">
    <div class="av-risco am"><svg class="ic ic-g i"><use href="#k-alerta"/></svg>
      <div><b>${r.origem==='bloqueada'?'Citação sem lastro':'Sem fundamento suficiente'}</b>
      <p style="color:var(--t-1);margin-top:4px">${r.texto||''}</p></div></div>
    ${r.detalhe?`<div class="tx" style="margin-top:11px">${r.detalhe}</div>`:''}</div>`;

  const c=r.grau_confianca||{};
  const sel={banco_local:'resposta validada',cache:'do cache',claude:'analisado agora'}[r.origem]||'';
  const imp=r.impactos||{};
  const areaU=(USUARIO.area||'').toUpperCase().slice(0,3) || '\u0000';

    ${r.explicacao?.texto?`<div class="tx" style="color:var(--t-2);margin-top:9px">${r.explicacao.texto}</div>`:''}
    ${(r.explicacao?.termos||[]).map(x=>`<div class="mini"><b>${x.termo}</b><p>${x.significado}</p></div>`).join('')}
    ${r.fundamentacao?.texto_oficial?`<div class="lei"><p>${r.fundamentacao.texto_oficial}</p>
      <div class="fn"><svg class="ic ic-p"><use href="#k-link"/></svg>${r.fundamentacao.referencia||'fonte oficial'}</div></div>`:''}
    ${r.divergencia?`<div class="dvg"><div class="h"><svg class="ic ic-p"><use href="#k-balanca"/></svg>

      ${(r.divergencia.posicoes||[]).map(p=>`<div class="p"><b>${p.tribunal||p.t||''}</b><p>${p.entendimento||p.s||''}</p></div>`).join('')}
      ${r.divergencia.orientacao?`<div class="o">${r.divergencia.orientacao}</div>`:''}</div>`:''}
    ${Object.keys(imp).length?`<div class="mini"><b>Impacto por área</b>
      ${Object.entries(imp).map(([a,v])=>v&&v.disponivel!==false
        ? `<p style="margin-top:6px"><b style="color:${a.startsWith(areaU)?'var(--az-f)':'var(--t-1)'};
           text-transform:none;letter-spacing:0;font-size:12.5px;display:inline">${a}:</b> ${v.texto||''}</p>`
        : `<p style="margin-top:6px;color:var(--t-3)"><b style="text-transform:none;letter-spacing:0;
           font-size:12.5px;display:inline;color:var(--t-3)">${a}:</b> ${v?.motivo||'sem impacto identificado'}</p>`).join('')}
    </div>`:''}
    ${(r.checklist||[]).length?`<div style="margin-top:12px">
      ${r.checklist.map(x=>`<div class="tarefa"><div class="cx" onclick="tick(this)">
        <svg class="ic ic-p"><use href="#k-tick"/></svg></div>
        <div class="tf"><p>${x.acao}</p><s>${x.responsavel||''}${x.prazo?' · '+x.prazo:''}</s></div></div>`).join('')}
    </div>`:''}
    ${r.como_impacta_realtec?`<div class="mini"><b>Como isso impacta a Realtec</b>
      <p>${r.como_impacta_realtec}</p></div>`:''}
    ${(r.fontes||[]).length?`<div class="tags">${r.fontes.map(f=>`<span class="tag">${f.titulo||f}</span>`).join('')}</div>`:''}
    ${c.faixa?`<div class="conf-x"><div class="fx">
      <b class="f-${String(c.faixa).toLowerCase()}">${({MUITO_ALTO:'Muito Alto',ALTO:'Alto',MODERADO:'Moderado',BAIXO:'Baixo'})[c.faixa]||c.faixa}</b>
      <s>${String(c.valor??'').replace('.',',')}</s></div>
      <p>Calculado a partir das citações validadas, da qualidade da recuperação e da existência de divergência — não é nota declarada pelo modelo.</p></div>`:''}
  </div>`;
}

    nr1:'O que mudou na NR-1?', nr35:'O que preciso fazer sobre a NR-35?',

async function perguntarAoClaude(pergunta){
  const tk = API.token();
  if(!tk) return null;                       // sem sessão → demonstração
  const r = await fetch(API.url, {
    method:'POST',
    headers:{'Authorization':'Bearer '+tk,'apikey':API.anon,'Content-Type':'application/json'},

  });
  if(!r.ok) throw new Error('função claude: '+r.status);

function iaEnviar(){
  const el=document.getElementById('iaInput');
  const t=el.value.trim(); if(!t) return;
  el.value=''; window._pl=t;
  conversa.push({u:t}); conversa.push({p:1}); iaRender();

  perguntarAoClaude(t)
    .then(res=>{
      conversa.pop();
      if(res) conversa.push({api:res});
      else    conversa.push({k:classificar(t)});
      iaRender();
    })
    .catch(()=>{ conversa.pop(); conversa.push({k:classificar(t)}); iaRender(); });

function classificar(t){
  const n=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(/gestante|gravida|experiencia|estabilidade/.test(n))return 'gestante';
  if(/nr.?0?1\b|psicossocial|pgr|gro/.test(n))return 'nr1';
  if(/nr.?35|altura/.test(n))return 'nr35';
  if(/esocial|leiaute|evento/.test(n))return 'esocial';
  if(/tribut|cbs|ibs|reforma/.test(n))return 'cbs';
  return 'abst';
}

/* IA age naturalmente: fala uma vez, sem bloquear, e se cala se ignorada */
function iaProativa(){
  const p=pend()[0]; if(!p||iaAberta) return;
  const f=document.getElementById('iaFala');
  f.innerHTML=`<p>Encontrei <b>${pend().length} ${pend().length===1?'alteração':'alterações'}</b>
    aguardando sua análise. A mais urgente é ${p.norma}.</p>
    <div class="aq"><button class="s" onclick="fecharFala();ir('det:${p.id}')">Ver agora</button>
    <button class="n" onclick="fecharFala()">Depois</button></div>`;
  f.classList.add('on');
  setTimeout(()=>{ if(f.classList.contains('on')) f.classList.remove('on'); }, 14000);
}
function fecharFala(){ document.getElementById('iaFala').classList.remove('on'); }

/* ═══════════════ PALETA ═══════════════ */
let mk=0, vis=[];
const nm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-\s]+/g,' ').trim();
function pont(it,q){
  if(!q)return 1;
  const a=nm(it.t+' '+it.s+' '+it.k), c=a.replace(/\s/g,'');
  const n=nm(q), nc=n.replace(/\s/g,''); if(!nc)return 1;
  let p=0;
  if(nm(it.t).startsWith(n))p+=100;
  if(a.includes(n))p+=60;
  if(c.includes(nc))p+=40;
  n.split(' ').filter(Boolean).forEach(w=>{if(a.includes(w))p+=12;});
  return p;
}
function plListar(q){
  const r=INDICE.map(x=>({...x,p:pont(x,q)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p).slice(0,20);
  vis=r; mk=0;
  const el=document.getElementById('plB');
  if(!r.length){el.innerHTML='<div class="vazio"><b>Nada encontrado</b><p>Nenhum item corresponde a este termo.</p></div>';return;}
  const g={}; r.forEach((x,i)=>{(g[x.g]=g[x.g]||[]).push({...x,ix:i})});
  el.innerHTML=Object.entries(g).map(([k,its])=>`<div class="pl-g">${k}</div>
    ${its.map(x=>`<button class="pl-i" data-i="${x.ix}" onmousemove="plMk(${x.ix})" onclick="plAbrir()">
      <span class="pl-ic"><svg class="ic ic-p"><use href="#${x.i}"/></svg></span>
      <span class="pl-t"><b>${x.t}</b><s>${x.s}</s></span></button>`).join('')}`).join('');
  plPintar();
}
function plPintar(){document.querySelectorAll('.pl-i').forEach(e=>{
  const on=Number(e.dataset.i)===mk; e.classList.toggle('mk',on);
  if(on)e.scrollIntoView({block:'nearest'});});}
function plMk(i){if(i!==mk){mk=i;plPintar();}}
function plAbrir(){const it=vis[mk]; fecharPl(); if(it&&it.d)ir(it.d);}
function abrirPl(){
  document.getElementById('plVeu').classList.add('on');
  const i=document.getElementById('plIn'); i.value=''; plListar('');
  setTimeout(()=>i.focus(),40);
  document.getElementById('lat').classList.remove('on');
}
function fecharPl(){document.getElementById('plVeu').classList.remove('on');}

/* ═══════════════ UTIL ═══════════════ */
function tema(){
  const r=document.documentElement, n=r.dataset.tema==='claro'?'escuro':'claro';
  r.dataset.tema=n;
  document.getElementById('icT').setAttribute('href',n==='claro'?'#k-lua':'#k-sol');
  document.querySelector('meta[name=theme-color]').setAttribute('content',n==='claro'?'#FFFFFF':'#0A0E15');
}
function menu(){document.getElementById('lat').classList.toggle('on');}

document.getElementById('plIn').addEventListener('input',e=>plListar(e.target.value));
document.addEventListener('keydown',e=>{
  const ab=document.getElementById('plVeu').classList.contains('on');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ab?fecharPl():abrirPl();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='j'){e.preventDefault();iaAberta?fecharIa():abrirIa();return;}
  if(e.key==='Escape'){fecharPl();fecharIa();return;}
  if(!ab)return;
  if(e.key==='ArrowDown'){e.preventDefault();mk=Math.min(mk+1,vis.length-1);plPintar();}
  if(e.key==='ArrowUp'){e.preventDefault();mk=Math.max(mk-1,0);plPintar();}
  if(e.key==='Enter'){e.preventDefault();plAbrir();}
});

render();
carregarSessao().then(verificarColeta);
setTimeout(iaProativa, 2600);
