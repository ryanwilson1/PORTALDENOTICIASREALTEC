<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Inteligência Operacional · Realtec Engenharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DESIGN — escala 4px, uma gramática para tudo
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* superfícies */
  --sup-0:#F6F8FB;   /* fundo da página */
  --sup-1:#FFFFFF;   /* cartão */
  --sup-2:#F1F5F9;   /* realce sutil */
  --sup-lei:#FCFBF8; /* papel — só texto oficial */

  /* linhas */
  --l-1:#E6EBF2;     /* divisória */
  --l-2:#D2DBE6;     /* borda de controle */

  /* texto */
  --t-1:#0D1826;     /* principal */
  --t-2:#526277;     /* secundário */
  --t-3:#8494A8;     /* terciário */

  /* marca */
  --m-900:#08203A;
  --m-700:#123A5E;
  --az:#1B6BD6;
  --az-f:#1454AE;
  --az-bg:#EDF4FD;

  /* estados — usados só em pontos pequenos */
  --vm:#C0332B; --vm-bg:#FDF0EF;
  --am:#B0620E; --am-bg:#FDF4EA;
  --vd:#137A50; --vd-bg:#E9F7F0;

  --sombra:0 1px 2px rgba(13,24,38,.05);
  --sombra-m:0 4px 16px -6px rgba(13,24,38,.14),0 1px 3px rgba(13,24,38,.06);
  --sombra-g:0 24px 60px -16px rgba(8,32,58,.24),0 4px 12px rgba(8,32,58,.08);

  --r-g:14px; --r-m:10px; --r-p:7px;
  --lat:236px;
  --tr:150ms cubic-bezier(.2,0,0,1);
  --sb:env(safe-area-inset-bottom,0px);
}
html[data-tema="escuro"]{
  --sup-0:#0A0E15; --sup-1:#131A24; --sup-2:#1A2330; --sup-lei:#161D28;
  --l-1:#242E3C; --l-2:#34404F;
  --t-1:#E9EEF5; --t-2:#98A8BC; --t-3:#6F7F94;
  --m-900:#D8E4F2; --m-700:#A9C1DC;
  --az:#4E93EE; --az-f:#6BA6F5; --az-bg:#152538;
  --vm:#EE8078; --vm-bg:#2A1514;
  --am:#E39D5F; --am-bg:#291B10;
  --vd:#5CC698; --vd-bg:#0E2219;
  --sombra:none;
  --sombra-m:0 4px 16px -6px rgba(0,0,0,.5);
  --sombra-g:0 24px 60px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--sup-0);color:var(--t-1);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background var(--tr),color var(--tr)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--az);outline-offset:2px;border-radius:5px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic-p{width:15px;height:15px}.ic-g{width:22px;height:22px}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ─────────── ESTRUTURA ─────────── */
.app{display:flex;min-height:100vh}

.lat{width:var(--lat);flex:none;background:var(--sup-1);border-right:1px solid var(--l-1);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.lat-topo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;flex:none;border-radius:8px;background:var(--m-900);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:11.5px;letter-spacing:-.02em}
html[data-tema="escuro"] .logo{background:var(--az);color:#0A0E15}
.lat-topo b{display:block;font-size:12.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.lat-topo s{display:block;font-size:10.5px;color:var(--t-3);text-decoration:none}
.lat-nav{flex:1;overflow-y:auto;padding:4px 10px 12px;scrollbar-width:thin}
.lat-nav::-webkit-scrollbar{width:5px}
.lat-nav::-webkit-scrollbar-thumb{background:var(--l-2);border-radius:3px}
.lat-g{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t-3);
  padding:16px 8px 6px}
.lat-i{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r-p);
  color:var(--t-2);font-size:13px;font-weight:500;text-align:left;transition:background var(--tr),color var(--tr)}
.lat-i:hover{background:var(--sup-2);color:var(--t-1)}
.lat-i.on{background:var(--az-bg);color:var(--az-f);font-weight:600}
.lat-i .q{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;
  background:var(--vm-bg);color:var(--vm)}
.lat-i .q.calmo{background:var(--sup-2);color:var(--t-3)}
.lat-pe{border-top:1px solid var(--l-1);padding:10px}
.perfil{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--r-p);text-align:left}
.perfil:hover{background:var(--sup-2)}
.av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--az-bg);color:var(--az-f);
  display:grid;place-items:center;font-size:11px;font-weight:700}
.perfil b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.perfil s{display:block;font-size:10.5px;color:var(--t-3);text-decoration:none}

.corpo{flex:1;min-width:0;display:flex;flex-direction:column}

/* ─────────── BARRA SUPERIOR ─────────── */
.topo{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--sup-0) 86%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--l-1)}
.topo-in{max-width:1120px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:12px}
.bt-i{width:34px;height:34px;flex:none;border-radius:var(--r-p);display:grid;place-items:center;
  color:var(--t-2);transition:background var(--tr),color var(--tr)}
.bt-i:hover{background:var(--sup-2);color:var(--t-1)}
.menu-m{display:none}
.busca{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;
  flex-shrink:1;min-width:0;
  background:var(--sup-1);border:1px solid var(--l-1);border-radius:var(--r-m);
  color:var(--t-3);font-size:13px;text-align:left;transition:border-color var(--tr)}
.busca:hover{border-color:var(--l-2)}
.busca span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tecla{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 6px;border-radius:5px;
  border:1px solid var(--l-1);background:var(--sup-2);color:var(--t-3)}
.topo-d{margin-left:auto;display:flex;align-items:center;gap:4px}

/* ─────────── FAIXA DE RISCO ─────────── */
.risco{border-bottom:1px solid var(--l-1);background:var(--sup-1)}
.risco-in{max-width:1120px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:11px}
.farol{width:9px;height:9px;flex:none;border-radius:50%;position:relative}
.farol::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  animation:pf 2.8s cubic-bezier(.2,0,0,1) infinite}
.r-vm .farol{background:var(--vm)} .r-vm .farol::after{box-shadow:0 0 0 0 var(--vm)}
.r-am .farol{background:var(--am)} .r-am .farol::after{box-shadow:0 0 0 0 var(--am)}
.r-vd .farol{background:var(--vd)} .r-vd .farol::after{box-shadow:0 0 0 0 var(--vd)}
@keyframes pf{0%{opacity:.45}70%{box-shadow:0 0 0 9px transparent;opacity:0}100%{opacity:0}}
.risco-t{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.r-vm .risco-t{color:var(--vm)} .r-am .risco-t{color:var(--am)} .r-vd .risco-t{color:var(--vd)}
.risco-d{font-size:12.5px;color:var(--t-2)}
.risco-a{margin-left:auto;font-size:12px;font-weight:600;color:var(--az-f);display:flex;align-items:center;gap:4px;flex:none}

/* ─────────── CONTEÚDO ─────────── */
.pag{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:28px 24px 96px}

.cab{margin-bottom:22px}
.cab h1{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.22}
.cab p{margin-top:5px;font-size:14px;color:var(--t-2)}

/* atalhos — "ir direto ao que busca" */
.atalhos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.at{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:99px;
  background:var(--sup-1);border:1px solid var(--l-1);font-size:13px;font-weight:500;color:var(--t-2);
  transition:border-color var(--tr),color var(--tr),background var(--tr)}
.at:hover{border-color:var(--l-2);color:var(--t-1)}
.at.on{background:var(--az-bg);border-color:var(--az);color:var(--az-f);font-weight:600}
.at b{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:0 5px;border-radius:5px;
  background:var(--sup-2);color:var(--t-2)}
.at.on b{background:var(--sup-1);color:var(--az-f)}
.at .pt{width:6px;height:6px;border-radius:50%;flex:none}
.at .pt.vm{background:var(--vm)} .at .pt.am{background:var(--am)} .at .pt.vd{background:var(--vd)}

/* seção */
.sec{margin-bottom:30px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;
  padding-bottom:9px;border-bottom:1px solid var(--l-1)}
.sec-h h2{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t-2)}
.sec-h .c{font-size:11.5px;color:var(--t-3);font-family:'IBM Plex Mono',monospace}
.sec-h .l{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--az-f);
  display:flex;align-items:center;gap:4px}

/* ═══ CARTÃO: uma anatomia para todo o sistema ═══
   meta → título → resumo → rodapé                        */
.ct{display:block;width:100%;text-align:left;background:var(--sup-1);border:1px solid var(--l-1);
  border-radius:var(--r-g);padding:0;margin-bottom:9px;box-shadow:var(--sombra);
  transition:border-color var(--tr),box-shadow var(--tr),transform var(--tr)}
button.ct:hover{border-color:var(--l-2);box-shadow:var(--sombra-m);transform:translateY(-1px)}
button.ct:active{transform:none}
.ct-in{padding:15px 17px}
.ct-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px;
  font-size:11.5px;color:var(--t-3);line-height:1.4;min-height:20px}
.ct-meta .sep{width:2.5px;height:2.5px;border-radius:50%;background:var(--l-2)}
.ct h3{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.4;margin-bottom:6px}
.ct .rz{font-size:13.5px;color:var(--t-2);line-height:1.58}
.ct-pe{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;
  padding:11px 17px;border-top:1px solid var(--l-1);background:var(--sup-2);
  border-radius:0 0 var(--r-g) var(--r-g);min-height:44px}
.ct-pe .ac{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--az-f);
  display:flex;align-items:center;gap:5px;flex:none}

/* etiquetas */
.et{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  letter-spacing:.015em;padding:2px 8px;border-radius:99px;border:1px solid transparent}
.et .pt{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.et.vm{background:var(--vm-bg);color:var(--vm)}
.et.am{background:var(--am-bg);color:var(--am)}
.et.vd{background:var(--vd-bg);color:var(--vd)}
.et.nt{background:var(--sup-2);color:var(--t-2);border-color:var(--l-1)}
.et.va{background:transparent;border-color:var(--l-1);color:var(--t-3);font-weight:500}
.area{font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:5px;
  background:var(--az-bg);color:var(--az-f)}
.areas{display:flex;gap:4px;flex-wrap:wrap}

/* prazo */
.pz{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--t-2)}
.pz.urg{color:var(--vm);font-weight:600}

/* ═══ PAINEL DE NÚMEROS ═══ */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:26px}
.nm{background:var(--sup-1);border:1px solid var(--l-1);border-radius:var(--r-g);padding:14px 15px;
  text-align:left;transition:border-color var(--tr)}
button.nm:hover{border-color:var(--l-2)}
.nm .v{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;font-family:'IBM Plex Mono',monospace}
.nm .r{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:11.5px;color:var(--t-2);font-weight:500}
.nm .r .pt{width:6px;height:6px;border-radius:50%;flex:none}
.nm.vm .v{color:var(--vm)} .nm.vm .pt{background:var(--vm)}
.nm.am .v{color:var(--am)} .nm.am .pt{background:var(--am)}
.nm.vd .v{color:var(--vd)} .nm.vd .pt{background:var(--vd)}
.nm.nt .pt{background:var(--t-3)}

/* ═══ TEXTO OFICIAL — a assinatura ═══ */
.lei{background:var(--sup-lei);border-left:2.5px solid var(--m-700);
  border-radius:0 var(--r-m) var(--r-m) 0;padding:14px 16px;margin:12px 0}
html[data-tema="escuro"] .lei{border-left-color:var(--az)}
.lei p{font-family:'Source Serif 4',Georgia,serif;font-size:14.5px;line-height:1.66;color:var(--t-1)}
.lei .fn{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:var(--t-3);
  font-family:'Inter',sans-serif}

/* ═══ DETALHE / PASSOS ═══ */
.voltar{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
  color:var(--t-2);margin-bottom:16px;padding:5px 0}
.voltar:hover{color:var(--t-1)}
.bl{background:var(--sup-1);border:1px solid var(--l-1);border-radius:var(--r-g);
  padding:18px;margin-bottom:10px;box-shadow:var(--sombra)}
.bl-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bl-n{width:24px;height:24px;flex:none;border-radius:7px;background:var(--az-bg);color:var(--az-f);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.bl-h strong{font-size:14px;font-weight:600;letter-spacing:-.01em}
.bl p{font-size:14px;line-height:1.68;color:var(--t-1)}
.bl p+p{margin-top:10px}

.av-risco{display:flex;gap:12px;padding:14px 15px;border-radius:var(--r-m);border:1px solid}
.av-risco.vm{background:var(--vm-bg);border-color:color-mix(in srgb,var(--vm) 22%,transparent)}
.av-risco.am{background:var(--am-bg);border-color:color-mix(in srgb,var(--am) 22%,transparent)}
.av-risco .i{flex:none;margin-top:1px}
.av-risco.vm .i{color:var(--vm)} .av-risco.am .i{color:var(--am)}
.av-risco b{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.av-risco.vm b{color:var(--vm)} .av-risco.am b{color:var(--am)}
.av-risco p{font-size:13.2px;line-height:1.6;color:var(--t-2)}

.lin{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--l-1)}
.lin:last-child{border-bottom:none;padding-bottom:0}
.lin:first-child{padding-top:0}
.lin .mk{flex:none;margin-top:1px}
.lin.sim .mk{color:var(--vd)} .lin.nao .mk{color:var(--t-3)}
.lin b{font-size:13.5px;font-weight:600;flex:none;width:104px}
.lin span{font-size:13px;color:var(--t-2);line-height:1.55;flex:1}
.lin.nao b,.lin.nao span{color:var(--t-3)}

.tarefa{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--l-1)}
.tarefa:last-child{border-bottom:none}
.cx{width:20px;height:20px;flex:none;border:1.7px solid var(--l-2);border-radius:6px;margin-top:1px;
  display:grid;place-items:center;color:transparent;transition:all var(--tr)}
.cx:hover{border-color:var(--az)}
.cx.ok{background:var(--vd);border-color:var(--vd);color:#fff}
.tf{flex:1;min-width:0}
.tf p{font-size:13.8px;line-height:1.5}
.tf.ok p{color:var(--t-3);text-decoration:line-through}
.tf s{display:block;font-size:11.5px;color:var(--t-3);text-decoration:none;margin-top:3px}

/* como impacta a empresa */
.impacto-emp{background:var(--az-bg);border:1px solid color-mix(in srgb,var(--az) 26%,transparent);
  border-radius:var(--r-g);padding:18px;margin-bottom:10px}
.impacto-emp .h{display:flex;align-items:center;gap:9px;margin-bottom:11px;color:var(--az-f)}
.impacto-emp .h strong{font-size:14px;font-weight:700;letter-spacing:-.01em}
.impacto-emp p{font-size:14px;line-height:1.68}

/* clientes */
.cli{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--l-1)}
.cli:last-child{border-bottom:none}
.cli-a{width:34px;height:34px;flex:none;border-radius:9px;background:var(--sup-2);color:var(--t-2);
  display:grid;place-items:center;font-size:11.5px;font-weight:700}
.cli-t{flex:1;min-width:0}
.cli-t b{display:block;font-size:13.5px;font-weight:600}
.cli-t s{display:block;font-size:11.5px;color:var(--t-3);text-decoration:none;margin-top:1px}
.cli-b{flex:none;font-size:11.5px;font-weight:600;color:var(--az-f);padding:6px 10px;
  border-radius:var(--r-p);background:var(--az-bg)}
.motivo{padding:12px 14px;margin-bottom:4px;background:var(--sup-2);border-radius:var(--r-m);
  font-size:12.8px;line-height:1.6;color:var(--t-2)}
.motivo b{color:var(--t-1);font-weight:600}
.cadeia{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px}
.elo{font-size:11px;padding:2.5px 8px;border-radius:99px;background:var(--sup-1);
  border:1px solid var(--l-1);color:var(--t-2)}

/* tabela / lista */
.lista{background:var(--sup-1);border:1px solid var(--l-1);border-radius:var(--r-g);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;
  border-bottom:1px solid var(--l-1);transition:background var(--tr)}
.li:first-child{border-radius:var(--r-g) var(--r-g) 0 0}
.li:last-child{border-radius:0 0 var(--r-g) var(--r-g)}
.li:last-child{border-bottom:none}
.li:hover{background:var(--sup-2)}
.li-t{flex:1;min-width:0}
.li-t b{display:block;font-size:13.5px;font-weight:500;line-height:1.4}
.li-t s{display:block;font-size:11.5px;color:var(--t-3);text-decoration:none;margin-top:2px}
.li .ch{flex:none;color:var(--t-3)}

.vazio{padding:40px 20px;text-align:center}
.vazio .i{color:var(--t-3);margin-bottom:10px}
.vazio b{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px}
.vazio p{font-size:13px;color:var(--t-2)}

.tag{display:inline-block;font-size:11px;font-weight:500;padding:2.5px 9px;border-radius:99px;
  background:var(--sup-2);color:var(--t-2);border:1px solid var(--l-1)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 17px;
  border-radius:var(--r-m);font-size:13.5px;font-weight:600;transition:background var(--tr)}
.bt.pr{background:var(--m-900);color:#fff}
.bt.pr:hover{background:var(--m-700)}
html[data-tema="escuro"] .bt.pr{background:var(--az);color:#0A0E15}
.bt.sc{background:var(--sup-1);border:1px solid var(--l-1);color:var(--t-2)}
.bt.sc:hover{border-color:var(--l-2);color:var(--t-1)}
.bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ═══════════════════════════════════════════════
   IA AO CANTO
   ═══════════════════════════════════════════════ */
.ia-doca{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;
  align-items:flex-end;gap:10px;pointer-events:none}
.ia-doca>*{pointer-events:auto}

.ia-fala{max-width:290px;background:var(--sup-1);border:1px solid var(--l-1);
  border-radius:var(--r-g) var(--r-g) 4px var(--r-g);padding:13px 15px;box-shadow:var(--sombra-g);
  opacity:0;transform:translateY(6px) scale(.97);transition:all 260ms cubic-bezier(.2,0,0,1);
  pointer-events:none}
.ia-fala.on{opacity:1;transform:none;pointer-events:auto}
.ia-fala p{font-size:13.2px;line-height:1.55;color:var(--t-1)}
.ia-fala .aq{display:flex;gap:8px;margin-top:11px}
.ia-fala .aq button{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:var(--r-p)}
.ia-fala .aq .s{background:var(--az-bg);color:var(--az-f)}
.ia-fala .aq .n{color:var(--t-3)}
.ia-fala .aq .n:hover{color:var(--t-2)}

.ia-bt{width:52px;height:52px;border-radius:50%;background:var(--m-900);color:#fff;
  display:grid;place-items:center;box-shadow:var(--sombra-g);position:relative;
  transition:transform var(--tr),background var(--tr)}
.ia-bt:hover{transform:scale(1.05)}
.ia-bt:active{transform:scale(.97)}
html[data-tema="escuro"] .ia-bt{background:var(--az);color:#0A0E15}
.ia-bt .pn{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;
  background:var(--vm);border:2.5px solid var(--sup-0)}

/* painel da IA */
.ia-pn{position:fixed;right:22px;bottom:22px;z-index:70;width:min(400px,calc(100vw - 44px));
  height:min(620px,calc(100vh - 44px));background:var(--sup-1);border:1px solid var(--l-1);
  border-radius:16px;box-shadow:var(--sombra-g);display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateY(12px) scale(.98);pointer-events:none;
  transition:all 240ms cubic-bezier(.2,0,0,1)}
.ia-pn.on{opacity:1;transform:none;pointer-events:auto}
.ia-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--l-1)}
.ia-av{width:30px;height:30px;flex:none;border-radius:8px;background:var(--m-900);color:#fff;
  display:grid;place-items:center}
html[data-tema="escuro"] .ia-av{background:var(--az);color:#0A0E15}
.ia-h b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.ia-h s{display:block;font-size:10.5px;color:var(--t-3);text-decoration:none}
.ia-corpo{flex:1;overflow-y:auto;padding:16px;scrollbar-width:thin}
.ia-corpo::-webkit-scrollbar{width:5px}
.ia-corpo::-webkit-scrollbar-thumb{background:var(--l-2);border-radius:3px}
.ia-pe{padding:12px 14px;border-top:1px solid var(--l-1);background:var(--sup-2)}
.ia-campo{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--sup-1);
  border:1px solid var(--l-1);border-radius:var(--r-m)}
.ia-campo input{flex:1;border:none;background:none;outline:none;font:inherit;font-size:13.5px;color:var(--t-1)}
.ia-campo input::placeholder{color:var(--t-3)}
.ia-env{width:28px;height:28px;flex:none;border-radius:7px;background:var(--m-900);color:#fff;display:grid;place-items:center}
html[data-tema="escuro"] .ia-env{background:var(--az);color:#0A0E15}

.msg-u{max-width:85%;margin-left:auto;background:var(--az-bg);padding:10px 13px;
  border-radius:12px 12px 3px 12px;font-size:13.5px;line-height:1.5;margin-bottom:16px}
.msg-a{margin-bottom:20px}
.msg-a .qm{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:11px;
  font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t-3)}
.msg-a .tx{font-size:13.5px;line-height:1.62}
.msg-a .tx+.tx{margin-top:9px}
.mini{background:var(--sup-2);border-radius:var(--r-m);padding:12px 14px;margin-top:11px}
.mini b{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--t-3);margin-bottom:6px}
.mini p{font-size:13px;line-height:1.58;color:var(--t-2)}
.pensa{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t-3)}
.pensa i{width:4.5px;height:4.5px;border-radius:50%;background:var(--t-3);display:inline-block;
  animation:pisca 1.3s ease-in-out infinite}
.pensa i:nth-child(2){animation-delay:.18s} .pensa i:nth-child(3){animation-delay:.36s}
@keyframes pisca{0%,60%,100%{opacity:.28}30%{opacity:1}}
.atalho-ia{display:block;width:100%;text-align:left;padding:10px 13px;margin-bottom:7px;
  border:1px solid var(--l-1);border-radius:var(--r-m);font-size:13px;color:var(--t-2);
  transition:border-color var(--tr),background var(--tr),color var(--tr)}
.atalho-ia:hover{border-color:var(--az);background:var(--az-bg);color:var(--az-f)}
.conf-x{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:var(--r-m);
  border:1px solid var(--l-1);margin-top:12px}
.conf-x .fx{flex:none;text-align:center;padding-right:11px;border-right:1px solid var(--l-1)}
.conf-x .fx b{display:block;font-size:12px;font-weight:700}
.conf-x .fx s{display:block;font-size:10px;color:var(--t-3);text-decoration:none;margin-top:2px;
  font-family:'IBM Plex Mono',monospace}
.conf-x p{font-size:12px;line-height:1.55;color:var(--t-2)}
.f-muito_alto{color:var(--vd)}.f-alto{color:var(--az-f)}.f-moderado{color:var(--am)}.f-baixo{color:var(--vm)}
.dvg{border:1px solid color-mix(in srgb,var(--am) 26%,transparent);background:var(--am-bg);
  border-radius:var(--r-m);padding:13px 15px;margin-top:12px}
.dvg .h{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--am)}
.dvg .h b{font-size:12.5px;font-weight:700}
.dvg .p{padding:9px 0;border-top:1px solid color-mix(in srgb,var(--am) 20%,transparent)}
.dvg .p:first-of-type{border-top:none;padding-top:0}
.dvg .p b{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.dvg .p p{font-size:12.8px;line-height:1.55}
.dvg .o{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--am) 20%,transparent);
  font-size:12.5px;line-height:1.55;color:var(--am);font-weight:500}
.veu{position:fixed;inset:0;z-index:65;background:rgba(8,32,58,.2);opacity:0;pointer-events:none;
  transition:opacity 240ms ease}
.veu.on{opacity:1;pointer-events:auto}

/* ═══ PALETA ⌘K ═══ */
.pl-veu{position:fixed;inset:0;z-index:80;background:rgba(8,32,58,.32);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.pl-veu.on{display:flex;animation:fade 120ms ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pl{width:100%;max-width:580px;background:var(--sup-1);border:1px solid var(--l-1);border-radius:14px;
  box-shadow:var(--sombra-g);overflow:hidden;animation:sobe 180ms cubic-bezier(.2,0,0,1)}
@keyframes sobe{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.pl-h{display:flex;align-items:center;gap:11px;padding:14px 17px;border-bottom:1px solid var(--l-1)}
.pl-h input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--t-1);font-family:inherit}
.pl-h input::placeholder{color:var(--t-3)}
.pl-b{max-height:min(50vh,400px);overflow-y:auto;padding:7px}
.pl-g{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t-3);padding:10px 10px 4px}
.pl-i{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-p)}
.pl-i.mk{background:var(--az-bg)}
.pl-ic{width:28px;height:28px;flex:none;border-radius:7px;background:var(--sup-2);color:var(--t-2);display:grid;place-items:center}
.pl-i.mk .pl-ic{background:var(--sup-1);color:var(--az-f)}
.pl-t{flex:1;min-width:0}
.pl-t b{display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-t s{display:block;font-size:11.5px;color:var(--t-3);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-f{display:flex;gap:15px;padding:9px 16px;border-top:1px solid var(--l-1);background:var(--sup-2);
  font-size:11px;color:var(--t-3)}

/* ═══════════════════════════════════════════════════════════════
   ADAPTAÇÃO — UM SISTEMA, QUATRO LARGURAS
   Mesmo HTML, mesmo JavaScript, mesmas funções. Só o arranjo muda.

     CELULAR    < 768px   navegação inferior · coluna única
     TABLET     768–1023  navegação inferior · grade de 4
     NOTEBOOK   1024–1439 lateral fixa · conteúdo 1120px
     MONITOR    ≥ 1440    lateral fixa · conteúdo 1280px
   ═══════════════════════════════════════════════════════════════ */
.nav-m{display:none}

/* ─────── CELULAR E TABLET (< 1024) ─────── */
@media (max-width:1023px){
  .lat{position:fixed;left:0;top:0;z-index:90;transform:translateX(-100%);
    transition:transform 240ms cubic-bezier(.2,0,0,1);box-shadow:var(--sombra-g)}
  .lat.on{transform:none}
  .menu-m{display:grid}
  .topo-in{padding:0 16px;gap:9px}
  .risco-in{padding:10px 16px;gap:9px}
  .pag{padding:20px 16px calc(76px + var(--sb))}
  .cab h1{font-size:21px}
  .busca span{display:none}
  .busca{max-width:none;flex:none;width:36px;padding:0;justify-content:center}
  .busca .tecla{display:none}

  .nav-m{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sup-1);
    border-top:1px solid var(--l-1);padding-bottom:var(--sb);box-shadow:0 -2px 16px rgba(13,24,38,.06)}
  .nav-m button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;color:var(--t-3);font-size:10px;font-weight:500;position:relative}
  .nav-m button.on{color:var(--az-f);font-weight:600}
  .nav-m button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:24px;height:2.5px;border-radius:0 0 3px 3px;background:var(--az)}
  .nav-m .q{position:absolute;top:7px;right:calc(50% - 18px);min-width:15px;height:15px;padding:0 4px;
    border-radius:99px;background:var(--vm);color:#fff;font-size:9px;font-weight:700;
    display:grid;place-items:center;line-height:1}

  .ia-doca{right:16px;bottom:calc(70px + var(--sb))}
  .ia-pn{right:0;left:0;bottom:0;width:100%;height:86vh;border-radius:16px 16px 0 0;transform:translateY(24px)}
}

/* ─────── CELULAR (< 768) ─────── */
@media (max-width:767px){
  .risco-d{display:none}
  .nums{grid-template-columns:1fr 1fr;gap:8px}
  .ct-in{padding:14px 15px}
  .ct-pe{padding:10px 15px}
  .lin{flex-wrap:wrap;gap:8px}
  .lin b{width:auto}
  .lin span{width:100%;padding-left:26px}
  .cab h1{font-size:20px}
  .atalhos{gap:6px}
  .at{padding:7px 11px;font-size:12.5px}
  /* alvos de toque nunca abaixo de 44px */
  .cx{width:24px;height:24px}
  .cli-b{padding:9px 12px}
  .bt{height:44px}
}

/* ─────── TABLET (768–1023) ─────── */
@media (min-width:768px) and (max-width:1023px){
  .pag{padding:24px 28px calc(78px + var(--sb));max-width:820px}
  .nums{grid-template-columns:repeat(4,1fr)}
  .risco-in{padding:11px 28px}
  .topo-in{padding:0 28px}
  .busca{width:auto;flex:1;max-width:340px;padding:0 12px;justify-content:flex-start}
  .busca span{display:block}
  .cab h1{font-size:23px}
}

/* ─────── NOTEBOOK (≥ 1024) ─────── */
@media (min-width:1024px){
  .lat{display:flex}
  .ia-doca{right:22px;bottom:22px}
}

/* ─────── MONITOR GRANDE (≥ 1440) ─────── */
@media (min-width:1440px){
  :root{--lat:256px}
  .topo-in,.risco-in,.pag{max-width:1340px}
  .nums{gap:12px}
  .pag{padding:32px 32px 96px}
}

/* ─────── NOTEBOOK DE TELA BAIXA (1366×768 e afins) ─────── */
@media (min-width:1024px) and (max-height:800px){
  .topo-in{height:50px}
  .risco-in{padding:8px 24px}
  .pag{padding-top:22px}
  .cab{margin-bottom:18px}
  .nums{margin-bottom:20px}
  .sec{margin-bottom:24px}
  .ia-pn{height:min(560px,calc(100vh - 36px))}
}

/* ─────── CELULAR DEITADO ─────── */
@media (max-height:520px) and (orientation:landscape){
  .risco{display:none}
  .ia-pn{height:96vh}
  .nav-m button{min-height:48px;font-size:9.5px}
}

/* ─────── TELAS SENSÍVEIS AO TOQUE ─────── */
@media (hover:none){
  button.ct:hover{transform:none;box-shadow:var(--sombra);border-color:var(--l-1)}
  .ia-bt:hover{transform:none}
  button.ct:active{background:var(--sup-2)}
  .li:active{background:var(--sup-2)}
}

/* ─────── IMPRESSÃO (anexar análise a processo) ─────── */
@media print{
  .lat,.nav-m,.topo,.risco,.ia-doca,.ia-pn,.veu,.bts,.voltar{display:none!important}
  body{background:#fff}
  .pag{max-width:none;padding:0}
  .ct,.bl{break-inside:avoid;box-shadow:none;border-color:#ccc}
  .lei{background:#fafafa}
}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="app">

  <aside class="lat" id="lat">
    <div class="lat-topo">
      <div class="logo">RE</div>

/* Identidade vem da sessão. Sem login, o sistema é impessoal — é um portal
   da empresa, não de uma pessoa. Com login, cada responsável vê o próprio
   nome e o impacto da própria área em destaque.                         */
const USUARIO = {nome:null, cargo:null, area:null, perfil:null, autenticado:false};

/* ═══════════════════════════════════════════════════════════════
   C1 · RENDERIZAÇÃO SEGURA
   Todo o sistema monta tela com template string + innerHTML. É rápido e
   legível, mas transforma qualquer texto vindo de fora — pergunta digitada
   na IA, CNAE cadastrado na tela, resposta da Edge Function alimentada por
   documento coletado — em HTML executável no navegador de quem decide.
   Num sistema que ingere conteúdo público de terceiros, esse caminho é
   entrada de código, não detalhe de estilo. esc() é obrigatório em toda
   interpolação de dado que não seja literal escrito neste arquivo.
   ═══════════════════════════════════════════════════════════════ */
const _ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'};
function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[&<>"'`]/g, c => _ESC[c]);
}
/* Para valores que entram em atributo (data-*, class): além de escapar,
   remove o que não seja seguro num identificador. */
function escId(v){ return String(v ?? '').replace(/[^\w.\/-]/g, ''); }

/* ═══════════════════════════════════════════════════════════════
   C2 · ARMAZENAMENTO LOCAL
   Definido aqui, antes do primeiro uso. Antes ficava no meio do arquivo,
   o que impedia hidratar estado (itens arquivados) na partida.
   Padrão defensivo: se o navegador bloquear storage, cai para memória.
   ═══════════════════════════════════════════════════════════════ */
const MEM = {};
const STORE = {
  ler(k, pd){ try{ const v=localStorage.getItem('cil_'+k); return v?JSON.parse(v):(MEM[k]??pd); }
              catch(e){ return MEM[k]??pd; } },
  gravar(k, v){ MEM[k]=v; try{ localStorage.setItem('cil_'+k, JSON.stringify(v)); }catch(e){} return v; }
};

function primeiroNome(){ return USUARIO.nome ? USUARIO.nome.trim().split(/\s+/)[0] : null; }
function iniciais(){
  if(!USUARIO.nome) return null;
  const p=USUARIO.nome.trim().split(/\s+/);
  return ((p[0]||'')[0] + (p.length>1 ? (p[p.length-1]||'')[0] : '')).toUpperCase();
}
function saudacaoHora(){
  const h=new Date().getHours();
  return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
}

   SESSÃO — identidade vem do Supabase, não do código
   Sem login, o sistema é da empresa. Com login, cada responsável

   ═══════════════════════════════════════════════════════════════ */
const SB = {
  url:'https://gezmxjurpsiqhhixvvwq.supabase.co',
  anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdlem14anVycHNpcWhoaXh2dndxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwODk1MDAsImV4cCI6MjEwMTY2NTUwMH0.zXywymKlU97SIy2HGb_XxZLnREmfeVu7XWL9z9PInw4',
  /* ─── C3 · SESSÃO COM RENOVAÇÃO ───────────────────────────────
     O token do Supabase vale cerca de uma hora. A versão anterior
     guardava só o access_token e descartava o refresh_token: passada
     a hora, o sistema derrubava o usuário no meio do expediente sem
     dizer por quê, e a coleta deixava de ser verificada. Agora a
     sessão inteira é guardada e renovada antes de expirar.       */
  _s(){ try{ return JSON.parse(sessionStorage.getItem('cil_sessao') || 'null'); }
        catch(e){ return null; } },
  tk(){ const x = this._s(); return x ? x.acesso : null; },
  rtk(){ const x = this._s(); return x ? x.renova : null; },
  guardar(d){
    const x = {acesso: d.access_token, renova: d.refresh_token || null,
               expira: Date.now() + ((Number(d.expires_in) || 3600) * 1000)};
    try{ sessionStorage.setItem('cil_sessao', JSON.stringify(x)); }catch(e){}
    return x;
  },
  sair(){ try{ sessionStorage.removeItem('cil_sessao');
               sessionStorage.removeItem('cil_tk'); }catch(e){} },

  async entrar(email, senha){
    let r;
    try{
      r = await fetch(`${this.url}/auth/v1/token?grant_type=password`, {
        method:'POST', headers:{'apikey':this.anon,'Content-Type':'application/json'},
        body: JSON.stringify({email, password:senha})});
    }catch(e){ throw Object.assign(new Error('Sem conexão com o servidor. Verifique a rede e tente de novo.'), {rede:true}); }
    if(r.status === 400 || r.status === 401) throw new Error('E-mail ou senha incorretos.');
    if(r.status === 429) throw new Error('Muitas tentativas seguidas. Aguarde um minuto e tente de novo.');
    if(!r.ok) throw Object.assign(new Error('O servidor de acesso não respondeu. Tente de novo em instantes.'), {rede:true});
    const d = await r.json();
    this.guardar(d);
    return d;
  },

  /* Renova quando falta menos de um minuto para expirar. Retorna
     'ok' | 'expirada' | 'rede' — quem chama precisa distinguir credencial
     inválida de servidor fora do ar. Tratar os dois como logout foi um
     dos defeitos corrigidos. */
  async renovar(forcar){
    const x = this._s();
    if(!x) return 'expirada';
    if(!forcar && Date.now() < x.expira - 60000) return 'ok';
    if(!x.renova) return 'expirada';
    let r;
    try{
      r = await fetch(`${this.url}/auth/v1/token?grant_type=refresh_token`, {
        method:'POST', headers:{'apikey':this.anon,'Content-Type':'application/json'},
        body: JSON.stringify({refresh_token: x.renova})});
    }catch(e){ return 'rede'; }
    if(r.status === 400 || r.status === 401){ this.sair(); return 'expirada'; }
    if(!r.ok) return 'rede';
    const d = await r.json();
    if(!d || !d.access_token){ this.sair(); return 'expirada'; }
    this.guardar(d);
    return 'ok';
  },

  /* Wrapper único de chamada autenticada. Renova antes, tenta uma vez,
     e em 401 renova à força e repete — uma vez só, sem laço. */
  async chamar(caminho, opcoes = {}, _repetiu){
    const est = await this.renovar();
    if(est === 'expirada') throw Object.assign(new Error('sessão expirada'), {autenticacao:true});
    if(est === 'rede' && !this.tk()) throw Object.assign(new Error('sem conexão'), {rede:true});
    const t = this.tk();
    if(!t) throw Object.assign(new Error('sem sessão'), {autenticacao:true});
    let r;
    try{
      r = await fetch(`${this.url}${caminho}`, Object.assign({}, opcoes, {
        headers: Object.assign({'apikey': this.anon, 'Authorization': 'Bearer ' + t}, opcoes.headers || {})
      }));
    }catch(e){
      /* 🟠 Timeout NÃO é servidor inacessível. O catch anterior engolia
         o AbortError e reetiquetava tudo como falha de rede — ou seja,
         afirmava "servidor fora do ar" sem ter evidência disso, que é
         exatamente o tipo de causa inventada que este sistema não pode
         produzir. O AbortError agora sobe preservado. */
      if(e && e.name === 'AbortError') throw e;
      throw Object.assign(new Error('sem conexão'), {rede:true});
    }
    if(r.status === 401 && !_repetiu){
      const nv = await this.renovar(true);
      if(nv === 'ok') return this.chamar(caminho, opcoes, true);
      throw Object.assign(new Error('sessão expirada'), {autenticacao:true});
    }
    if(r.status === 401 || r.status === 403)
      throw Object.assign(new Error('sem permissão'), {autenticacao: r.status === 401, permissao: r.status === 403});
    if(!r.ok) throw Object.assign(new Error('servidor: ' + r.status), {servidor:true, status:r.status});
    return r;
  },

  async rpc(fn, args={}){
    const r = await this.chamar(`/rest/v1/rpc/${encodeURIComponent(fn)}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(args)});
    return r.json();
  }
};

let CTX = null;

/* C4 · Falha de rede não é sessão inválida.
   A versão anterior fazia SB.sair() em qualquer erro: uma oscilação de
   conexão deslogava o usuário e o sistema voltava ao modo empresa sem
   avisar. Agora só credencial recusada encerra a sessão; problema de
   rede mantém o login e registra o estado degradado. */
let SESSAO_DEGRADADA = false;

/* C23 · Motivo real da recusa de contexto.
   contexto_ia() distingue "sem cadastro interno" de "sessão inválida",
   mas a tela de login descartava isso e mostrava sempre a mesma frase
   sobre vínculo com empresa. Quem cai nesse caso precisa saber o que
   pedir ao administrador. */
let MOTIVO_CONTEXTO = null;

async function carregarSessao(){
  if(!SB.tk()) return;
  MOTIVO_CONTEXTO = null;
  try{
    const r = await SB.rpc('contexto_ia');
    const c = Array.isArray(r) ? r[0] : r;
    if(!c || c.erro) throw Object.assign(new Error(c && c.erro || 'sem contexto'), {autenticacao:true});
    if(!c.usuario) throw Object.assign(new Error('contexto sem usuário'), {autenticacao:true});
    CTX = c;
    USUARIO.nome = c.usuario.nome || null;
    USUARIO.cargo = c.usuario.cargo || c.usuario.perfil || null;
    USUARIO.area = c.usuario.departamento || null;
    USUARIO.perfil = c.usuario.perfil || 'leitor';
    USUARIO.autenticado = true;
    SESSAO_DEGRADADA = false;
    render();
  }catch(e){
    if(e && (e.rede || e.servidor)){
      SESSAO_DEGRADADA = true;
      console.warn('[CIL] servidor indisponível — sessão preservada, dados do servidor indisponíveis.');
    }else{
      MOTIVO_CONTEXTO = (e && e.message) || null;
      SB.sair();
      CTX = null; USUARIO.autenticado = false;
      USUARIO.nome = USUARIO.cargo = USUARIO.area = null;
      console.info('[CIL] contexto recusado — modo empresa:', MOTIVO_CONTEXTO);
    }
    render();
  }
}

async function fazerLogin(){
  const e=document.getElementById('loginEmail').value.trim();
  const p=document.getElementById('loginSenha').value;
  const erro=document.getElementById('loginErro');
  const bt=document.getElementById('loginBt');
  if(!e||!p){ erro.textContent='Preencha e-mail e senha.'; erro.style.display='block'; return; }
  bt.textContent='Entrando…'; erro.style.display='none';
  try{
    await SB.entrar(e,p);
    await carregarSessao();
    if(USUARIO.autenticado) ir('inicio');
    else throw new Error(MOTIVO_CONTEXTO || 'Seu login existe, mas ainda não está vinculado a uma empresa. Fale com o administrador.');
  }catch(x){
    erro.textContent=x.message; erro.style.display='block';
    bt.textContent='Entrar';
  }
}

function sair(){ SB.sair(); USUARIO.nome=USUARIO.cargo=USUARIO.area=null;
  USUARIO.autenticado=false; CTX=null; ir('inicio'); }

   pior do que não ter sistema.
   ═══════════════════════════════════════════════════════════════ */
/* C5 · Três estados, não dois.
   'inativa' e 'indeterminada' pareciam a mesma coisa na tela: a versão
   anterior engolia qualquer erro e concluía "não há coleta". Num sistema
   de conformidade, "não consegui verificar" e "verifiquei, não há" são
   informações diferentes — e a segunda é uma afirmação que o sistema não
   tinha como sustentar. Agora ele diz qual das três está valendo. */
/* ─── ESTADOS DA COLETA ──────────────────────────────────────────────
   Item 17 do escopo: "sem alterações" e "a coleta não rodou" são
   afirmações diferentes, e a segunda o sistema não pode apresentar como
   a primeira. Cinco estados, não dois:

     concluida     · varreu todas as fontes previstas
     parcial       · varreu, mas alguma fonte falhou
     falhou        · não conseguiu varrer
     aguardando    · coleta iniciada, processamento em curso
     indeterminada · não foi possível sequer perguntar

   Só 'concluida' e 'parcial' autorizam o bloco "SEM ALTERAÇÃO".
   Nos demais o Radar diz que não varreu — nunca que nada mudou.       */
let ESTADO_COLETA = 'indeterminada';
let COLETA_ERRO = null;

/* Números da última execução. null = não sabido; 0 = sabidamente zero.
   A distinção existe porque exibir 0 quando o valor é desconhecido é
   inventar dado, e este sistema não inventa dado. */
let COLETA = {
  estado:'indeterminada', iniciada:null, terminada:null,
  fontes_previstas:null, fontes_ok:null, fontes_falha:[],
  documentos:null, descartados:null, relevantes:null,
  temas_atualizados:null, temas_novos:null, alertas:null
};

const COLETA_ROTULO = {
  concluida:     {i:'🟢', c:'vd', t:'Coleta concluída'},
  parcial:       {i:'🟡', c:'am', t:'Coleta parcial'},
  falhou:        {i:'🔴', c:'vm', t:'Coleta com erro'},
  nao_executada: {i:'⚫', c:'nt', t:'Coleta não executada'},
  agendada:      {i:'🔵', c:'nt', t:'Agendada'},
  em_execucao:   {i:'🔄', c:'nt', t:'Em execução — consultando fontes'},
  aguardando:    {i:'🕐', c:'nt', t:'Aguardando processamento'},
  indeterminada: {i:'⚪', c:'nt', t:'Status indeterminado'}
};
/* 'em_execucao' e 'agendada' (migração 04) contam como "processamento em
   curso" em toda checagem que hoje só testa 'aguardando' — mantido por
   compatibilidade com o que já lia esse valor. */
const EM_PROCESSAMENTO = new Set(['aguardando','agendada','em_execucao']);

/* Motivos de falha que o coletor sabe nomear. Qualquer outra coisa vira
   "Motivo não identificado" — nunca uma causa provável escrita por nós. */
const MOTIVO_CONHECIDO = {
  timeout:'Timeout', http_403:'HTTP 403', http_500:'HTTP 500', http_404:'HTTP 404',
  dns:'Falha de DNS', ssl:'Erro de certificado SSL',
  indisponivel:'Fonte indisponível', credencial:'Credencial inválida'
};
const nomeMotivo = m => !m ? 'Motivo não identificado' : (MOTIVO_CONHECIDO[m] || m);

Object.defineProperty(window, 'COLETA_ATIVA',
  {get: () => ESTADO_COLETA === 'concluida' || ESTADO_COLETA === 'parcial'});

/* A guarda mais importante do sistema. */
function podeAfirmarSemAlteracao(){
  return ESTADO_COLETA === 'concluida' || ESTADO_COLETA === 'parcial';
}

/* C21 · Lista vazia não é resposta.
   A versão anterior lia /rest/v1/coleta direto e concluía
   `d.length > 0 ? 'ativa' : 'inativa'`. O problema: RLS negando leitura
   não devolve erro — o PostgREST responde 200 com []. Então "a coleta
   nunca rodou" e "eu não tenho permissão para saber" chegavam aqui
   iguais, e a tela escolhia a primeira, que é uma afirmação que este
   código não tem como sustentar. Medido no banco: 1 linha real em
   `coleta`, 0 visíveis para authenticated, sem erro nenhum.

   estado_coleta() é SECURITY DEFINER: ou responde de verdade, ou nega
   com 403 — que é erro classificável, e vira 'indeterminada'. */
async function verificarColeta(){
  if(!SB.tk()){
    ESTADO_COLETA = 'indeterminada';
    COLETA_ERRO = 'sem sessão — entre para consultar o estado da coleta';
    COLETA.estado = ESTADO_COLETA;
    return;
  }
  try{
    const r = await SB.rpc('estado_coleta');
    const d = Array.isArray(r) ? r[0] : r;
    if(!d) throw new Error('resposta vazia de estado_coleta()');

    /* Aceita o contrato novo (d.estado) e o antigo (d.ativa booleano),
       para que a troca de versão do banco não derrube a tela. */
    let e = d.estado;
    if(!e && typeof d.ativa === 'boolean') e = d.ativa ? 'concluida' : 'nao_executada';
    if(!COLETA_ROTULO[e]) throw new Error('estado não reconhecido: ' + String(e));

    ESTADO_COLETA = e;
    COLETA_ERRO = d.erro || null;
    COLETA = {
      estado: e,
      iniciada: d.iniciada_em || null,
      terminada: d.terminada_em || null,
      fontes_previstas: num(d.fontes_previstas),
      fontes_ok: num(d.fontes_ok),
      fontes_falha: Array.isArray(d.fontes_falha) ? d.fontes_falha : [],
      documentos: num(d.documentos),
      descartados: num(d.descartados),
      relevantes: num(d.relevantes),
      temas_atualizados: num(d.temas_atualizados),
      temas_novos: num(d.temas_novos),
      alertas: num(d.alertas)
    };
  }catch(e){
    ESTADO_COLETA = 'indeterminada';
    COLETA.estado = 'indeterminada';
    COLETA_ERRO = e && e.status === 404 ? 'a função estado_coleta() ainda não existe no banco'
                : e && e.permissao ? 'sem permissão para consultar o estado da coleta'
                : e && e.autenticacao ? 'sessão não autorizada'
                : e && e.rede ? 'servidor inacessível'
                : (e && e.message) || 'erro desconhecido';
    console.warn('[RADAR] estado da coleta indeterminado:', COLETA_ERRO);
  }
  render();
}

/* null preservado: desconhecido não vira zero. */
function num(v){ return (v === null || v === undefined || v === '') ? null : Number(v); }

function avisoOrigem(){
  const e = ESTADO_COLETA;
  /* Item 23: se o acervo é semente, a tela diz isso mesmo quando a coleta
     está saudável. Dado de demonstração que passa por real é o defeito
     mais caro que um sistema de conformidade pode ter. */
  if(e === 'concluida' && TEMAS_ORIGEM === 'semente') return `<div class="aviso-origem">
    <svg class="ic i"><use href="#k-alerta"/></svg>
    <span class="t"><b>DADOS DE DEMONSTRAÇÃO.</b> A varredura rodou, mas os temas desta tela
      são a semente local, não o que veio do banco. Nada aqui foi coletado de fonte oficial.</span>
    <button class="l" onclick="ir('rotina')">Ver varredura</button></div>`;
  if(e === 'concluida') return '';

  if(e === 'parcial') return `<div class="aviso-origem">
    <svg class="ic i"><use href="#k-alerta"/></svg>
    <span class="t"><b>Coleta parcial.</b> ${COLETA.fontes_falha.length
        ? esc(COLETA.fontes_falha.join(', ')) + ' não respondeu na última varredura'
        : 'ao menos uma fonte não respondeu'} —
      o que está fora desta tela pode ter sido publicado e não lido.</span>
    <button class="l" onclick="ir('rotina')">Ver varredura</button></div>`;

  if(EM_PROCESSAMENTO.has(e)) return `<div class="aviso-origem">
    <svg class="ic i"><use href="#k-relogio"/></svg>
    <span class="t"><b>Processamento em curso.</b> A coleta iniciou e ainda não terminou.
      Os números desta tela são da varredura anterior.</span>
    <button class="l" onclick="ir('rotina')">Ver varredura</button></div>`;

  if(e === 'falhou') return `<div class="aviso-origem">
    <svg class="ic i"><use href="#k-alerta"/></svg>
    <span class="t"><b>A varredura falhou.</b> ${esc(nomeMotivo(COLETA_ERRO))} —
      isto <b>não</b> significa que nada mudou. Significa que o Sentinel não olhou.</span>
    <button class="l" onclick="ir('rotina')">Ver varredura</button></div>`;

  if(e === 'nao_executada') return `<div class="aviso-origem">
    <svg class="ic i"><use href="#k-alerta"/></svg>
    <span class="t"><b>A varredura não foi executada.</b> Nenhum ciclo rodou nesta janela —
      diferente de ter rodado e falhado. Nada nesta tela foi verificado hoje.</span>
    <button class="l" onclick="ir('rotina')">Ver varredura</button></div>`;

  return `<div class="aviso-origem">
    <svg class="ic i"><use href="#k-alerta"/></svg>
    <span class="t"><b>Não foi possível confirmar a coleta.</b> ${esc(COLETA_ERRO || 'motivo desconhecido')} —
      trate o conteúdo desta tela como semente até a varredura confirmar o contrário.</span>
    <button class="l" onclick="ir('rotina')">Ver varredura</button></div>`;
}

const rel=()=>MUDANCAS.filter(m=>m.temImpacto&&!arquivados.has(m.id));
const pend=()=>rel().filter(m=>!m.analisado);

function risco(){

  if(pend().length) return {c:'am',t:'Análise pendente',

  return {c:'vd',t:'Nenhuma pendência crítica',d:'Ambiente regulatório sob controle'};
}

/* ═══════════════ TRILHA LOCAL ═══════════════
   Toda decisão tomada na tela vira entrada. Encadeada por hash: alterar
   uma entrada antiga quebra o encadeamento das seguintes, e isso aparece
   na tela de Logs. Enquanto a tabela do servidor não existir, a trilha é
   local — e a tela diz que é local, para não passar por auditável o que
   ainda é do navegador.                                              */
let TRILHA = STORE.ler('trilha', []) || [];

function hashSimples(txt){
  let h = 0x811c9dc5;
  for(let i=0;i<txt.length;i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h>>>0).toString(16).padStart(8,'0');
}
function registrar(evento, dados){
  const ant = TRILHA.length ? TRILHA[0].hash : '00000000';
  const linha = {
    em: new Date().toISOString(),
    quem: USUARIO.autenticado ? (USUARIO.nome + (USUARIO.area?' · '+USUARIO.area:'')) : 'sessão anônima',
    evento, dados: dados || {}, anterior: ant
  };
  linha.hash = hashSimples(ant + linha.em + evento + JSON.stringify(linha.dados));
  TRILHA = [linha, ...TRILHA].slice(0, 200);
  STORE.gravar('trilha', TRILHA);
  /* O log do servidor tem cadeia própria (trigger log_encadear). Aqui só
     se envia o evento; o hash local serve para detectar adulteração
     offline, não substitui a cadeia do banco. */
  if(typeof persistir === 'function')
    persistir('log', {evento, payload: linha.dados, usuario_nome: linha.quem});
  return linha;
}
function trilhaIntegra(){
  for(let i=0;i<TRILHA.length;i++){
    const l = TRILHA[i];
    const esperado = hashSimples(l.anterior + l.em + l.evento + JSON.stringify(l.dados));
    if(esperado !== l.hash) return {ok:false, em:i};
    const ant = TRILHA[i+1] ? TRILHA[i+1].hash : '00000000';
    if(ant !== l.anterior) return {ok:false, em:i};
  }
  return {ok:true, em:-1};
}

function ir(d,a){
  if(d.startsWith('det:')){rota='det';alvo=d.slice(4);}
  else if(d.startsWith('tema:')){rota='tema';alvo=d.slice(5);}
  else if(d.startsWith('area:')){areaVista=d.slice(5);rota='area';}
  else if(d.startsWith('ia:')){abrirIa();iaPergunta(d.slice(3));return;}
  else {rota=d;alvo=a||null;}
  fecharPl(); document.getElementById('lat').classList.remove('on');
  render(); window.scrollTo({top:0});
}

function render(){
  navL(); navM(); faixaRisco();
  const eN=document.getElementById('avNome'), eC=document.getElementById('avCargo'), eI=document.getElementById('avIni');
  if(USUARIO.autenticado){
    eN.textContent=USUARIO.nome;
    eC.textContent=[USUARIO.cargo,USUARIO.area].filter(Boolean).join(' · ');
    eI.textContent=iniciais();
  }else{
    eN.textContent='Realtec Engenharia';
    eC.textContent='Entrar para personalizar';
    eI.innerHTML='<svg class="ic ic-p"><use href="#k-empresa"/></svg>';
  }
  const V={inicio:vRadar, radar:vRadar, temas:vTemas, tema:vTema, hoje:vHoje,
    alertas:vAlertas, central:vCentralAlertas, det:vDet, acoes:vAcoes,
    area:vArea, diretoria:vDiretoria, fontes:vFontes,
    ignorar:vIgnorar,documentos:vDocs,comparador:vComp,timeline:vTime,logs:vLogs,
    config:vConfig,entrar:vEntrar,
    painel:vPainel, cnae:vCnae, rotina:vRotina, relatorio:vRelatorio};
  /* C12 · Uma tela inteira montada em uma única atribuição de innerHTML
     significa que um campo defeituoso apaga a página toda e o usuário fica
     com o quadro branco, sem saber se o sistema caiu ou se não há nada.
     Agora a falha é contida e nomeada. */
  try{
    document.getElementById('pag').innerHTML=(V[rota]||vRadar)();
  }catch(e){
    console.error('[CIL] falha ao montar a tela', rota, e);
    document.getElementById('pag').innerHTML = `<div class="cab"><h1>Esta tela não pôde ser montada</h1>
      <p>O erro ficou nesta seção e não afeta o restante do sistema. Detalhe técnico:
         <span class="num">${esc((e && e.message) || 'erro desconhecido')}</span></p></div>
      <div class="bts"><button class="bt pr" onclick="ir('inicio')">Voltar ao início</button></div>`;
  }

  /* O cabeçalho da IA trazia um horário de sincronização fixo no HTML.
     Horário fixo é horário inventado: agora reflete o estado real.
     A guarda anterior testava `typeof confianca==='function'` — declaração
     de função, sempre verdadeira por içamento — enquanto o valor lido era
     ROTINA, uma const que só existe bem mais abaixo. A guarda não protegia
     nada; try/catch protege. */
  const st=document.getElementById('iaStatus');
  if(st){
    try{
      const u=ROTINA.estado.ultima ? new Date(ROTINA.estado.ultima) : null;
      st.textContent = ESTADO_COLETA === 'indeterminada' ? 'Estado da coleta desconhecido'
        : ESTADO_COLETA !== 'ativa' ? 'Sem coleta ativa · acervo de exemplo'
        : u ? `Acervo sincronizado às ${u.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`
            : 'Aguardando a primeira rotina';
    }catch(e){ st.textContent = 'Estado da coleta desconhecido'; }
  }
}

/* ─── NOVIDADES REGULATÓRIAS (item 6) ─────────────────────────────
   Filtros por estado, por nível e por área. Nenhum filtro esconde o que
   é crítico: "Todas" está sempre a um clique, e a contagem de cada
   recorte fica visível no próprio botão.
   ─────────────────────────────────────────────────────────────────── */
let filtroNov = 'todas', filtroArea = null;
function setFiltroNov(f){ filtroNov=f; PAGINA.novidades=12; render(); }
function setFiltroArea(a){ filtroArea = (filtroArea===a?null:a); PAGINA.novidades=12; render(); }

function estadoNovidade(m){
  const t = temaDaAlteracao(m.id);
  if(!podeAfirmarSemAlteracao()) return 'indeterminado';
  if(!m.analisado) return 'pendente';
  if(m.nivel === 'crit') return 'critico';
  if(t && ['MODERADO','BAIXO'].includes((t.confianca||{}).f)) return 'validar';
  return 'verificado';
}
function statusAdequacao(m){
  const t = temaDaAlteracao(m.id);
  if(!t) return 'pendente';
  const acs = acoesDoTema(t.id);
  if(!acs.length) return 'pendente';
  if(acs.every(a=>a.status==='concluida')) return 'concluida';
  if(acs.some(a=>a.status==='andamento'||a.status==='concluida')) return 'andamento';
  return 'pendente';
}

function vAlertas(){
  const base = MUDANCAS.filter(m=>!arquivados.has(m.id));
  const F = {
    todas:      base,
    minha:      USUARIO.area ? base.filter(m=>(m.areas||[]).some(a=>
                  a.toLowerCase().includes(USUARIO.area.slice(0,3).toLowerCase()))) : [],
    criticas:   base.filter(m=>m.nivel==='crit'),
    alto:       base.filter(m=>m.nivel==='alto'),
    prazo:      base.filter(m=>m.prazo && m.prazo!=='—'),
    pendentes:  base.filter(m=>statusAdequacao(m)==='pendente' && m.temImpacto),
    andamento:  base.filter(m=>statusAdequacao(m)==='andamento'),
    concluidas: base.filter(m=>statusAdequacao(m)==='concluida'),
    validar:    base.filter(m=>estadoNovidade(m)==='validar'),
    semimpacto: base.filter(m=>!m.temImpacto)
  };
  let lista = F[filtroNov] || base;
  if(filtroArea) lista = lista.filter(m=>(m.areas||[]).includes(filtroArea));

  const areas = [...new Set(base.flatMap(m=>m.areas||[]))].sort();
  const bt = (k,r)=>`<button class="at ${filtroNov===k?'on':''}" onclick="setFiltroNov('${k}')">
    ${r}<b>${(F[k]||[]).length}</b></button>`;

  return `${avisoOrigem()}
  <div class="cab"><h1>Novidades regulatórias</h1>
    <p>${base.length} publicaç${base.length===1?'ão':'ões'} no acervo ·
       ${F.criticas.length} crítica${F.criticas.length===1?'':'s'} ·
       ${F.validar.length} requer${F.validar.length===1?'':'em'} validação.</p></div>

  <div class="atalhos">
    ${bt('todas','Todas')}${USUARIO.area?bt('minha','Minha área'):''}
    ${bt('criticas','Críticas')}${bt('alto','Alto impacto')}${bt('prazo','Com prazo')}
    ${bt('validar','Requer validação')}${bt('pendentes','Pendentes')}
    ${bt('andamento','Em andamento')}${bt('concluidas','Concluídas')}${bt('semimpacto','Sem impacto')}
  </div>

  <div class="atalhos" style="margin-top:-6px">
    ${areas.map(a=>`<button class="at ${filtroArea===a?'on':''}" onclick="setFiltroArea('${escId(a)}')">
      ${esc(a)}<b>${base.filter(m=>(m.areas||[]).includes(a)).length}</b></button>`).join('')}
  </div>

  <section class="sec">
    <div class="sec-h"><h2>Resultado</h2><span class="c">${lista.length}</span>
      ${filtroNov!=='todas'||filtroArea?`<button class="l" onclick="setFiltroNov('todas');setFiltroArea(null)">
        Limpar filtros</button>`:''}</div>
    ${lista.length ? lista.slice(0,PAGINA.novidades).map(cartao).join('')
      : tela('vazio','Nenhuma novidade neste recorte',
          podeAfirmarSemAlteracao()
            ? 'A varredura rodou e nada no acervo atende a este filtro. Isto não é ausência de publicação: é ausência dentro deste recorte.'
            : 'A varredura não foi confirmada. Lista vazia aqui não prova que nada foi publicado.',
          ['Ver todas','setFiltroNov(\'todas\');setFiltroArea(null)'])}
    ${lista.length>PAGINA.novidades?`<div class="bts">
      <button class="bt sc" onclick="maisPagina('novidades')">
        Mostrar mais ${Math.min(12,lista.length-PAGINA.novidades)} de ${lista.length}</button></div>`:''}
  </section>`;
}

/* Confiança calculada do que existe, não escrita à mão. Cada critério
   que falta derruba o nível — e a tela mostra qual faltou, para que a
   área saiba o que conferir em vez de apenas desconfiar. */
function confiancaDe(m){
  const e = enr(m), t = temaDaAlteracao(m.id);
  const criterios = [
    ['Trecho literal da fonte', m.oficial ? 'Armazenado e conferível palavra a palavra' : SEM_FONTE, !!m.oficial],
    ['Dispositivo identificado', m.ref || SEM_FONTE, !!m.ref],
    ['Endereço da publicação', e.fonte || SEM_FONTE, !!e.fonte],
    ['Redação anterior e vigente', (e.vAnterior && e.vAnterior!=='—') ? 'Ambas vieram da fonte' : SEM_FONTE,
      !!(e.vAnterior && e.vAnterior!=='—')],
    ['Revisão humana da análise', t && validacaoDe(t.id).status==='aprovada'
      ? 'Validada por ' + validacaoDe(t.id).por
      : m.analisado ? 'Marcada como analisada, sem parecer registrado' : 'Ainda não revisada',
      !!(t && validacaoDe(t.id).status==='aprovada')],
    ['Coleta confirmada', podeAfirmarSemAlteracao() ? 'Varredura executada' : SEM_CONSULTA,
      podeAfirmarSemAlteracao()]
  ];
  const n = criterios.filter(c=>c[2]).length;
  const f = n >= 6 ? 'MUITO ALTA' : n >= 5 ? 'ALTA' : n >= 3 ? 'MODERADA' : 'BAIXA';
  const faltando = criterios.filter(c=>!c[2]).map(c=>c[0].toLowerCase());
  const porque = f === 'MUITO ALTA'
    ? 'Todos os critérios de sustentação foram atendidos: trecho literal, dispositivo, endereço da publicação, as duas redações e validação humana, sobre uma coleta confirmada.'
    : `Nível ${f.toLowerCase()} porque ${faltando.length===1?'falta':'faltam'} ${faltando.join(', ')}. ` +
      (f === 'BAIXA' ? INCONCLUSIVO
       : 'O que está afirmado se apoia no que foi lido; o que falta não foi suprido por dedução.');
  return {f, n, criterios, porque, tema: t};
}

  render();

function desarquivar(id){
  registrar('desarquivar', {id});

  render();
}

/* ─── COMPARADOR ───────────────────────────────────────────────────
   Antes trazia a NR-1 fixa no HTML. Agora percorre o acervo e só monta o
   par ANTES/DEPOIS quando as duas redações existem na fonte. Onde não
   existem, diz que não existem — item 12 do escopo: não inventar redação.
   ─────────────────────────────────────────────────────────────────── */
function vComp(){
  const temTexto = m => { const e = enr(m);
    return e.vAnterior && e.vNova && e.vAnterior !== '—' && e.vNova !== '—'; };
  const comTexto = MUDANCAS.filter(temTexto);
  const semTexto = MUDANCAS.filter(m=>m.temImpacto && !temTexto(m));

  /* alvo pode chegar como id de tema (vindo do dossiê) ou de alteração. */
  const porTema = alvo ? temaPorId(alvo) : null;
  const escolhido = comTexto.find(m => m.id === (porTema ? porTema.alteracao : alvo))
                 || comTexto[0] || null;

  if(!escolhido) return `${avisoOrigem()}
    <div class="cab"><h1>Comparador</h1>
      <p>Nenhuma alteração do acervo tem redação anterior e vigente registradas.</p></div>
    <div class="ct"><div class="vazio">
      <svg class="ic ic-g i" style="margin:0 auto"><use href="#k-diff"/></svg>
      <b>Sem par para comparar</b>
      <p>O comparador só monta ANTES/DEPOIS quando as duas redações vieram da fonte oficial.
         Redação anterior não é reconstruída de memória.</p></div></div>`;

  const e = enr(escolhido);
  const tm = temaDaAlteracao(escolhido.id);

  return `${avisoOrigem()}
  <div class="cab"><h1>Comparador</h1>
    <p>${esc(escolhido.norma)} · redação anterior comparada com a vigente${tm?` · tema ${esc(tm.titulo)}`:''}.</p></div>

  ${comTexto.length>1?`<div class="atalhos">${comTexto.map(m=>`
    <button class="at ${m.id===escolhido.id?'on':''}" onclick="ir('comparador','${escId(m.id)}')">
      ${esc(m.norma)}</button>`).join('')}</div>`:''}

  <div class="bl"><div class="bl-h"><span class="bl-n">−</span><strong>Redação anterior</strong></div>
    <div class="lei" style="border-left-color:var(--vm);margin:0">
      <p>${esc(e.vAnterior)}</p>
      <div class="fn">${esc(escolhido.ref || e.fonte || 'fonte não informada')} · antes da alteração</div></div></div>

  <div class="bl"><div class="bl-h"><span class="bl-n">+</span><strong>Redação vigente</strong></div>
    <div class="lei" style="border-left-color:var(--vd);margin:0">
      <p>${esc(e.vNova)}</p>
      <div class="fn">${esc(escolhido.ref || e.fonte || 'fonte não informada')} · redação atual</div></div></div>

  <div class="bl"><div class="bl-h"><span class="bl-n">→</span><strong>O que mudou</strong></div>
    <p>${esc(escolhido.seis && escolhido.seis.mudou ? escolhido.seis.mudou : escolhido.resumo)}</p></div>

  <div class="bl"><div class="bl-h"><span class="bl-n">!</span><strong>Impacto na Realtec</strong></div>
    <p>${esc(escolhido.seis && escolhido.seis.impacto ? escolhido.seis.impacto :
       (tm ? tm.estado_atual : 'Impacto ainda não analisado.'))}</p></div>

  <div class="bl"><div class="bl-h"><span class="bl-n"><svg class="ic ic-p"><use href="#k-lista"/></svg></span>
    <strong>Ação necessária</strong></div>
    ${escolhido.seis && escolhido.seis.fazer && escolhido.seis.fazer.length
      ? escolhido.seis.fazer.slice(0,4).map(f=>`<div class="lin sim">
          <svg class="ic ic-p mk"><use href="#k-tick"/></svg><b>${esc(f.r)}</b>
          <span>${esc(f.t)} — até ${esc(f.p)}.</span></div>`).join('')
      : `<p>${tm && tm.o_que_fazer_agora ? esc(tm.o_que_fazer_agora)
             : 'Nenhuma ação registrada para esta alteração.'}</p>`}
    <div class="bts">
      ${tm?`<button class="bt pr" onclick="ir('tema:${escId(tm.id)}')">Abrir o tema</button>`:''}
      <button class="bt sc" onclick="ir('det:${escId(escolhido.id)}')">Análise técnica</button></div></div>

  ${semTexto.length?`<section class="sec">
    <div class="sec-h"><h2>Sem par de redações na fonte</h2><span class="c">${semTexto.length}</span></div>
    <div class="lista">${semTexto.map(m=>`<div class="li">
      <svg class="ic ic-p" style="color:var(--t-3);flex:none"><use href="#k-menos"/></svg>
      <span class="li-t"><b style="font-weight:400">${esc(m.norma)} — ${esc(m.titulo)}</b>
        <s>a fonte não trouxe a redação anterior; o comparador não a reconstrói</s></span></div>`).join('')}</div>
  </section>`:''}`;
}

/* ─── LINHA DO TEMPO ───────────────────────────────────────────────
   Antes era um array fixo de cinco linhas. Agora é a união das
   movimentações de todos os temas, ordenada — a cronologia real do que o
   Radar registrou, e não uma ilustração de cronologia.
   ─────────────────────────────────────────────────────────────────── */
function vTime(){
  const linhas = TEMAS.flatMap(t=>(t.movimentacoes||[]).map(m=>({...m, tema:t})))
                      .sort((a,b)=>dt(b.data)-dt(a.data));
  const porAno = {};
  linhas.forEach(l=>{ const a = (l.data||'').split('/')[2] || '—'; (porAno[a]=porAno[a]||[]).push(l); });

  return `${avisoOrigem()}
  <div class="cab"><h1>Linha do tempo</h1>
    <p>${linhas.length} movimentaç${linhas.length===1?'ão':'ões'} registrada${linhas.length===1?'':'s'}
       em ${TEMAS.length} temas. Da mais recente para a mais antiga.</p></div>
  ${Object.keys(porAno).sort((a,b)=>b.localeCompare(a)).map(ano=>`
    <section class="sec"><div class="sec-h"><h2>${esc(ano)}</h2>
      <span class="c">${porAno[ano].length}</span></div>
      <div class="lista">${porAno[ano].map(l=>`
        <button class="li" style="text-align:left;width:100%" onclick="ir('tema:${escId(l.tema.id)}')">
          <span class="et ${nivelDe(l.tema.nivel).r}" style="padding:2px 6px;flex:none">
            <span class="pt"></span></span>

               · ${esc(l.fonte||'fonte não informada')}</s></span>
        </button>`).join('')}</div></section>`).join('')}
  ${linhas.length?'':semItens('Nenhuma movimentação registrada','Os temas ainda não receberam movimentação.')}`;
}

function rotuloEvento(l){
  const d = l.dados || {};
  switch(l.evento){
    case 'varredura':          return `Varredura ${d.modo||''} · ${d.relevantes??'—'} relevantes · ${d.temas??'—'} temas movimentados`;
    case 'alerta_critico':     return `Alerta crítico disparado · tema ${d.tema||'—'}`;
    case 'tema_aberto':        return `Tema aberto a partir de sugestão · ${d.titulo||''}`;
    case 'sugestao_descartada':return `Sugestão de tema descartada · ${d.titulo||''}`;
    case 'arquivar':           return `Alteração arquivada como sem impacto · ${d.id||''}`;
    case 'desarquivar':        return `Alteração devolvida ao radar · ${d.id||''}`;
    default:                   return l.evento;
  }
}

function abrirIa(){
  iaAberta=true;
  /* A IA passa a saber o que está aberto. Sem isso, "qual o prazo?" é
     pergunta sem sujeito e a resposta vira genérica. */
  CTX_IA = contextoAtual();
  document.getElementById('iaPn').classList.add('on');
  document.getElementById('veuIa').classList.add('on');
  document.getElementById('iaPonto').style.display='none';
  document.getElementById('iaFala').classList.remove('on');
  iaRender();
  const st=document.getElementById('iaStatus');
  if(st && CTX_IA.titulo) st.textContent = 'Lendo: ' + CTX_IA.titulo;
  setTimeout(()=>{const i=document.getElementById('iaInput'); if(window.innerWidth>1023&&i)i.focus();},260);
}
function fecharIa(){
  iaAberta=false;
  document.getElementById('iaPn').classList.remove('on');
  document.getElementById('veuIa').classList.remove('on');
}

function iaRender(){

  if(!conversa.length){
    c.innerHTML=`<div class="msg-a">

    </div>

    <div class="motivo" style="margin-bottom:14px">
      <b>Contexto desta conversa:</b> ${esc(CTX_IA.titulo)}. As respostas abaixo saem do que o
      Sentinel tem registrado sobre isto — quando não houver dado, eu digo que não tenho.</div>
    <div style="font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
      color:var(--t-3);margin:0 0 9px">Sobre o que está aberto</div>
    ${SUG_CTX.map(([q,k])=>`<button class="atalho-ia" onclick="iaPergunta('${k}')">${q}</button>`).join('')}
    `:''}
    <div style="font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
      color:var(--t-3);margin:18px 0 9px">Visão do dia</div>
    ${[['O que mudou hoje?','hoje'],['Existe alguma urgência?','urgencia'],
       ['O que precisa ser atualizado hoje?','hojefazer'],
       ['Quais temas estão abertos?','temas']]
      .map(([q,k])=>`<button class="atalho-ia" onclick="iaPergunta('${k}')">${q}</button>`).join('')}

    <div style="font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
      color:var(--t-3);margin:18px 0 9px">Consultas técnicas</div>
    ${[['Posso demitir uma gestante em contrato de experiência?','gestante'],
       ['O que mudou na NR-1?','nr1'],['O que preciso fazer sobre a NR-35?','nr35'],
       ['Qual o prazo de validade de um crachá funcional?','abst']]
      .map(([q,k])=>`<button class="atalho-ia" onclick="iaPergunta('${k}')">${q}</button>`).join('')}`;
    return;
  }
  c.innerHTML=conversa.map(iaTurno).join('');
  c.scrollTop=c.scrollHeight;

/* C16 · Resposta de exemplo precisa se declarar.
   Quando o servidor não responde, o sistema volta ao acervo escrito à mão.
   Antes isso acontecia calado e a tela ficava idêntica à de uma resposta
   apurada. Agora a resposta local vem etiquetada com o motivo. */
function seloExemplo(t){
  if(!t || !t.local) return '';

}

function iaTurno(t){
  if(t.u) return `<div class="msg-u">${esc(t.u)}</div>`;
  if(t.p) return `<div class="msg-a"><div class="pensa"><i></i><i></i><i></i> Consultando o acervo…</div></div>`;
  if(t.api) return iaTurnoAPI(t.api);

  const marca = seloExemplo(t);
  if(marca) return `<div class="msg-a">${marca}</div>` + iaTurno(Object.assign({}, t, {local:null}));

  /* expansão: perguntas corporativas respondidas a partir do estado do sistema */
  if(t.ctx) return iaTurnoCtx(t.ctx);
  if(t.k && IA_CORP[t.k]) return iaTurnoCorp(t.k);

  if(t.k==='abst') return `<div class="msg-a">
    <div class="av-risco am"><svg class="ic ic-g i"><use href="#k-alerta"/></svg>
      <div><b>Sem fundamento suficiente</b><p style="color:var(--t-1);margin-top:4px">${ABST.t}</p></div></div>

    return `<div class="msg-a">

      <div class="dvg"><div class="h"><svg class="ic ic-p"><use href="#k-balanca"/></svg>
        <b>Divergência entre tribunais</b></div>
        ${r.divergencia.map(p=>`<div class="p"><b>${p.t}</b><p>${p.s}</p></div>`).join('')}
        <div class="o">${r.orientacao}</div></div>

      <div class="conf-x"><div class="fx"><b class="f-alto">Alto</b><s>${r.conf.v}</s></div>
        <p>${r.conf.m}</p></div></div>`;
  }

  const m=MUDANCAS.find(x=>x.id===t.k);
  if(!m||!m.seis) return '';
  return `<div class="msg-a">
    <div class="qm"><svg class="ic ic-p"><use href="#k-ia"/></svg>O que mudou</div>
    <div class="tx">${m.seis.mudou}</div>

    <div class="mini"><b>Como isso impacta a Realtec</b><p>${m.seis.empresa}</p></div>
    <button class="atalho-ia" style="margin-top:12px" onclick="fecharIa();ir('det:${m.id}')">
      Abrir análise completa →</button></div>`;
}

/* Renderiza a resposta real vinda da Edge Function, no mesmo formato
   visual das respostas de demonstração.                              */
/* C8 · A resposta da Edge Function é conteúdo não confiável.
   Ela nasce de documento público coletado na internet e passa por um
   modelo de linguagem. Interpolar isso cru em innerHTML fecha o circuito
   fonte externa → tela do diretor. Todo campo abaixo passa por esc(). */
function iaTurnoAPI(r){
  if(!r || typeof r !== 'object') return `<div class="msg-a"><div class="tx">
    A resposta do servidor veio em formato inesperado e não foi exibida.</div></div>`;
  if(r.abstencao||r.origem==='bloqueada') return `<div class="msg-a">
    <div class="av-risco am"><svg class="ic ic-g i"><use href="#k-alerta"/></svg>
      <div><b>${r.origem==='bloqueada'?'Citação sem lastro':'Sem fundamento suficiente'}</b>

    ${r.detalhe?`<div class="tx" style="margin-top:11px">${esc(r.detalhe)}</div>`:''}</div>`;

  const c=r.grau_confianca||{};
  const sel={banco_local:'resposta validada',cache:'do cache',claude:'analisado agora'}[r.origem]||'';
  const imp=r.impactos||{};
  const areaU=(USUARIO.area||'').toUpperCase().slice(0,3) || '\u0000';

  return `<div class="msg-a">
    <div class="qm"><svg class="ic ic-p"><use href="#k-ia"/></svg>Resposta objetiva
      ${sel?`<span style="margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0">${esc(sel)}</span>`:''}</div>
    <div class="tx">${esc(r.resposta_objetiva?.texto)}</div>
    ${r.explicacao?.texto?`<div class="tx" style="color:var(--t-2);margin-top:9px">${esc(r.explicacao.texto)}</div>`:''}
    ${(Array.isArray(r.explicacao?.termos)?r.explicacao.termos:[]).map(x=>`<div class="mini"><b>${esc(x?.termo)}</b><p>${esc(x?.significado)}</p></div>`).join('')}
    ${r.fundamentacao?.texto_oficial?`<div class="lei"><p>${esc(r.fundamentacao.texto_oficial)}</p>
      <div class="fn"><svg class="ic ic-p"><use href="#k-link"/></svg>${esc(r.fundamentacao.referencia||'fonte oficial')}</div></div>`:''}
    ${r.divergencia?`<div class="dvg"><div class="h"><svg class="ic ic-p"><use href="#k-balanca"/></svg>
      <b>Divergência entre tribunais</b></div>
      ${(Array.isArray(r.divergencia.posicoes)?r.divergencia.posicoes:[]).map(p=>`<div class="p"><b>${esc(p?.tribunal||p?.t)}</b><p>${esc(p?.entendimento||p?.s)}</p></div>`).join('')}
      ${r.divergencia.orientacao?`<div class="o">${esc(r.divergencia.orientacao)}</div>`:''}</div>`:''}
    ${Object.keys(imp).length?`<div class="mini"><b>Impacto por área</b>
      ${Object.entries(imp).map(([a,v])=>v&&v.disponivel!==false
        ? `<p style="margin-top:6px"><b style="color:${a.startsWith(areaU)?'var(--az-f)':'var(--t-1)'};
           text-transform:none;letter-spacing:0;font-size:12.5px;display:inline">${esc(a)}:</b> ${esc(v.texto)}</p>`
        : `<p style="margin-top:6px;color:var(--t-3)"><b style="text-transform:none;letter-spacing:0;
           font-size:12.5px;display:inline;color:var(--t-3)">${esc(a)}:</b> ${esc(v?.motivo||'sem impacto identificado')}</p>`).join('')}
    </div>`:''}
    ${(Array.isArray(r.checklist)?r.checklist:[]).length?`<div style="margin-top:12px">
      ${r.checklist.map(x=>`<div class="tarefa"><div class="cx" onclick="tick(this)">
        <svg class="ic ic-p"><use href="#k-tick"/></svg></div>
        <div class="tf"><p>${esc(x?.acao)}</p><s>${esc(x?.responsavel)}${x?.prazo?' · '+esc(x.prazo):''}</s></div></div>`).join('')}
    </div>`:''}
    ${r.como_impacta_realtec?`<div class="mini"><b>Como isso impacta a Realtec</b>
      <p>${esc(r.como_impacta_realtec)}</p></div>`:''}
    ${(Array.isArray(r.fontes)?r.fontes:[]).length?`<div class="tags">${r.fontes.map(f=>`<span class="tag">${esc(f?.titulo||f)}</span>`).join('')}</div>`:''}
    ${c.faixa?`<div class="conf-x"><div class="fx">
      <b class="f-${escId(String(c.faixa).toLowerCase())}">${esc(({MUITO_ALTO:'Muito Alto',ALTO:'Alto',MODERADO:'Moderado',BAIXO:'Baixo'})[c.faixa]||c.faixa)}</b>
      <s>${String(c.valor??'').replace('.',',')}</s></div>
      <p>Calculado a partir das citações validadas, da qualidade da recuperação e da existência de divergência — não é nota declarada pelo modelo.</p></div>`:''}
  </div>`;
}
