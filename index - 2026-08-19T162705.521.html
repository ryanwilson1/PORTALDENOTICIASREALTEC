function iaPergunta(k){
  if(k.startsWith('ctx:') || k.startsWith('afeta:')){
    const rot = (SUG_CTX.find(x=>x[1]===k)||[])[0] ||
                (k.startsWith('afeta:') ? `Isso afeta o ${k.slice(6)}?` : 'Consulta');
    if(!iaAberta) abrirIa();
    conversa.push({u:rot}); conversa.push({p:1}); iaRender();
    setTimeout(()=>{conversa.pop(); conversa.push({ctx:k}); iaRender();}, 500);
    return;
  }
  const P={gestante:'Posso demitir uma gestante em contrato de experiência?',
    nr1:'O que mudou na NR-1?', nr35:'O que preciso fazer sobre a NR-35?',
    esocial:'O que mudou no eSocial?', cbs:'O que mudou na reforma tributária?',
    abst:'Qual o prazo de validade de um crachá funcional?',
    /* expansão — perguntas de rotina da diretoria */
    hoje:'O que mudou hoje?', urgencia:'Existe alguma urgência?',
    tributario:'Existe alteração tributária?',
    engenharia:'Existe alteração para Engenharia?', hojefazer:'O que precisa ser atualizado hoje?',
    temas:'Quais temas estão abertos?'};
  conversa.push({u:P[k]||window._pl||'Consulta'});
  conversa.push({p:1});
  if(!iaAberta) abrirIa(); else iaRender();
  setTimeout(()=>{conversa.pop();conversa.push({k});iaRender();},800);
}

/* ── Ligação com a Edge Function `claude` ──────────────────────────
   A chave da Anthropic NUNCA aparece aqui. O navegador chama a Edge
   Function, autenticado com o JWT do usuário; a chave vive no servidor.
   Sem sessão ativa, cai na demonstração local — por desenho.          */
/* C13 · A chave de sessão passa a ter uma única fonte: SB.
   API.token() lia sessionStorage direto, com outra chave — depois da
   correção de renovação, leria um valor que não existe mais e toda
   pergunta cairia na demonstração local sem avisar ninguém.
   C14 · Sem tempo limite, uma Edge Function pendurada deixava a IA
   "consultando o acervo" para sempre. */
const API = {
  caminho: '/functions/v1/claude',
  limiteMs: 45000
};

async function perguntarAoClaude(pergunta){
  if(!SB.tk()) return null;                  // sem sessão → demonstração
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), API.limiteMs);
  try{
    const r = await SB.chamar(API.caminho, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pergunta}), signal: ac.signal});
    return await r.json();
  }finally{ clearTimeout(t); }
}

function iaEnviar(){
  const el=document.getElementById('iaInput');
  const t=el.value.trim(); if(!t) return;
  el.value=''; window._pl=t;
  conversa.push({u:t}); conversa.push({p:1}); iaRender();

  /* C15 · Cair na demonstração local em silêncio é o pior desfecho
     possível aqui: a tela fica idêntica à de uma resposta real e a
     pessoa não tem como saber que está lendo exemplo. Agora o motivo
     aparece junto da resposta. */
  perguntarAoClaude(t)
    .then(res=>{
      conversa.pop();
      if(res) conversa.push({api:res});
      else    conversa.push({k:classificar(t), local:'sem sessão ativa'});
      iaRender();
    })
    .catch(e=>{
      conversa.pop();
      /* Cada falha tem um nome próprio: quem lê precisa saber se espera,
         se entra de novo, ou se avisa o administrador. */
      const st = e && e.status;
      /* Math.round dava "mais de 0 segundos" para limites abaixo de 500 ms.
         Abaixo de 1 s a frase muda para não afirmar um número absurdo. */
      const ms = API.limiteMs || 45000;
      const espera = ms >= 1000 ? `mais de ${Math.round(ms/1000)} segundos` : 'demais';
      const motivo = e && e.name === 'AbortError' ? `o servidor demorou ${espera} para responder`
                   : e && e.permissao ? 'seu perfil não tem permissão para consultar a IA'
                   : e && e.autenticacao ? 'a sessão expirou — entre de novo'
                   : e && e.rede ? 'o servidor está inacessível'
                   : st === 429 ? 'o limite diário de consultas deste usuário foi atingido'
                   : st === 502 ? 'a Anthropic não respondeu à consulta'
                   : st === 400 ? 'a pergunta foi recusada pelo servidor'
                   : st >= 500 ? `o servidor respondeu ${esc(st)}`
                   : e instanceof SyntaxError ? 'o servidor devolveu uma resposta que não pôde ser lida'
                   : 'a consulta ao servidor falhou';
      conversa.push({k:classificar(t), local:motivo});
      iaRender();
    });
}

function classificar(t){
  const n=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  /* expansão — perguntas de gestão vêm antes das de conteúdo: quando alguém
     pergunta "o que mudou hoje", quer o estado do sistema, não uma norma.   */
  if(/o que mudou (hoje|nas ultimas|no dia)|novidade|resumo do dia/.test(n)) return 'hoje';
  if(/urgen|urgente|critic|exigivel|corre risco|estamos irregular/.test(n)) return 'urgencia';
  if(/tema|temas|dossie|assunto|acompanhamento|esta sendo acompanhad/.test(n)) return 'temas';
  if(/o que (precisa|preciso|devo|tenho que) (ser )?(atualiz|faz|revis)|pendencia|hoje.*fazer/.test(n)) return 'hojefazer';
  if(/engenharia|obra|canteiro|art\b|crea|projeto/.test(n)) return 'engenharia';
  if(/tribut|fiscal|imposto|cbs|ibs|reforma|sped|dctf|reinf/.test(n)) return 'tributario';

  if(/gestante|gravida|experiencia|estabilidade/.test(n))return 'gestante';
  if(/nr.?0?1\b|psicossocial|pgr|gro/.test(n))return 'nr1';
  if(/nr.?35|altura/.test(n))return 'nr35';
  if(/esocial|leiaute|evento/.test(n))return 'esocial';
  return 'abst';
}

/* IA age naturalmente: fala uma vez, sem bloquear, e se cala se ignorada */
function iaProativa(){
  const p=pend()[0]; if(!p||iaAberta) return;

  f.innerHTML=`<p>Encontrei <b>${pend().length} ${pend().length===1?'alteração':'alterações'}</b>
    aguardando sua análise. A mais urgente é ${p.norma}.</p>
    <div class="aq"><button class="s" onclick="fecharFala();ir('det:${p.id}')">Ver agora</button>
    <button class="n" onclick="fecharFala()">Depois</button></div>`;
  f.classList.add('on');
  setTimeout(()=>{ if(f.classList.contains('on')) f.classList.remove('on'); }, 14000);
}
function fecharFala(){ document.getElementById('iaFala').classList.remove('on'); }

/* ═══════════════ PALETA ═══════════════ */
let mk=0, vis=[];
const nm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-\s]+/g,' ').trim();
function pont(it,q){
  if(!q)return 1;
  const a=nm(it.t+' '+it.s+' '+it.k), c=a.replace(/\s/g,'');
  const n=nm(q), nc=n.replace(/\s/g,''); if(!nc)return 1;
  let p=0;
  if(nm(it.t).startsWith(n))p+=100;
  if(a.includes(n))p+=60;
  if(c.includes(nc))p+=40;
  n.split(' ').filter(Boolean).forEach(w=>{if(a.includes(w))p+=12;});
  return p;
}
function plListar(q){
  const r=INDICE.map(x=>({...x,p:pont(x,q)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p).slice(0,20);
  vis=r; mk=0;
  const el=document.getElementById('plB');
  if(!r.length){el.innerHTML='<div class="vazio"><b>Nada encontrado</b><p>Nenhum item corresponde a este termo.</p></div>';return;}
  const g={}; r.forEach((x,i)=>{(g[x.g]=g[x.g]||[]).push({...x,ix:i})});
  el.innerHTML=Object.entries(g).map(([k,its])=>`<div class="pl-g">${k}</div>
    ${its.map(x=>`<button class="pl-i" data-i="${x.ix}" onmousemove="plMk(${x.ix})" onclick="plAbrir()">
      <span class="pl-ic"><svg class="ic ic-p"><use href="#${x.i}"/></svg></span>
      <span class="pl-t"><b>${x.t}</b><s>${x.s}</s></span></button>`).join('')}`).join('');
  plPintar();
}
function plPintar(){document.querySelectorAll('.pl-i').forEach(e=>{
  const on=Number(e.dataset.i)===mk; e.classList.toggle('mk',on);
  if(on)e.scrollIntoView({block:'nearest'});});}
function plMk(i){if(i!==mk){mk=i;plPintar();}}
function plAbrir(){const it=vis[mk]; fecharPl(); if(it&&it.d)ir(it.d);}
let _plT = null;
function plDebounce(q){
  clearTimeout(_plT);
  _plT = setTimeout(()=>plListar(q), 140);
}
function abrirPl(){
  document.getElementById('plVeu').classList.add('on');
  const i=document.getElementById('plIn'); i.value=''; plListar('');
  setTimeout(()=>i.focus(),40);
  document.getElementById('lat').classList.remove('on');
}
function fecharPl(){document.getElementById('plVeu').classList.remove('on');}

/* ═══════════════ UTIL ═══════════════ */
function tema(){
  const r=document.documentElement, n=r.dataset.tema==='claro'?'escuro':'claro';
  r.dataset.tema=n;
  document.getElementById('icT').setAttribute('href',n==='claro'?'#k-lua':'#k-sol');
  document.querySelector('meta[name=theme-color]').setAttribute('content',n==='claro'?'#FFFFFF':'#0A0E15');
}
function menu(){document.getElementById('lat').classList.toggle('on');}

document.getElementById('plIn').addEventListener('input',e=>plDebounce(e.target.value));
document.addEventListener('keydown',e=>{
  const ab=document.getElementById('plVeu').classList.contains('on');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ab?fecharPl():abrirPl();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='j'){e.preventDefault();iaAberta?fecharIa():abrirIa();return;}
  if(e.key==='Escape'){fecharPl();fecharIa();return;}
  if(!ab)return;
  if(e.key==='ArrowDown'){e.preventDefault();mk=Math.min(mk+1,vis.length-1);plPintar();}
  if(e.key==='ArrowUp'){e.preventDefault();mk=Math.max(mk-1,0);plPintar();}

function enr(m){ return Object.assign({}, m, ENRIQ[m.id] || {classes:[], atinge:[]}); }

   Nada aqui é texto decorado à mão. Cliente impactado, veredito de CNAE

const inter = (a,b)=>(a||[]).filter(x=>(b||[]).includes(x));
const univ  = m=>(m.atinge||[]).includes('*');

/* ── Veredito por CNAE: SIM / PARCIALMENTE / NÃO, com justificativa ── */
function veredito(m, cn){
  const e = enr(m);
  if(!e.atinge.length) return {v:'NÃO', c:'nt',
    just: m.eixo==='OUTROS'
      ? 'A publicação é de setor fora do perfil da empresa e não alcança nenhuma atividade exercida sob este CNAE.'
      : `A alteração é do eixo ${rotEixo(e.eixo)} e não alcança atividade econômica exercida sob este CNAE.`};

  const casa = inter(e.atinge, cn.tags);
  const nomes = casa.map(t=>ETIQUETAS[t]).filter(Boolean).join(', ');

  if(univ(e)) return {v:'SIM', c:'vd',
    just:`Obrigação de alcance geral do empregador. Independe da atividade econômica: atinge todo CNAE em que haja empregado celetista${casa.length?`, com efeito reforçado em ${nomes.toLowerCase()}`:''}.`};

  if(casa.length >= 2 || (cn.principal && casa.length >= 1)) return {v:'SIM', c:'vd',
    just:`A atividade descrita neste CNAE envolve ${nomes.toLowerCase()}, exatamente o alcance da alteração${cn.principal?' — e trata-se do CNAE principal da empresa':''}.`};

  if(casa.length === 1) return {v:'PARCIALMENTE', c:'am',
    just:`Há sobreposição em ${nomes.toLowerCase()}, mas apenas em parte das atividades exercidas sob este CNAE. O efeito depende do escopo de cada contrato.`};

  return {v:'NÃO', c:'nt',
    just:`Nenhuma sobreposição entre o alcance da alteração e as atividades deste CNAE. Registrado como analisado e descartado.`};
}

function rotEixo(e){
  return {SST:'Segurança do Trabalho', DP:'Departamento Pessoal', TRIBUTARIO:'Tributário',
    OUTROS:'fora do perfil'}[e] || e || '—';
}

/* ═══════════════ PAINEL EXECUTIVO — indicadores calculados ═══════════════ */
/* A referência é a data real do dia, não uma data fixa no código. É por isso
   que "Hoje" pode aparecer zerado: quando o acervo para de receber
   publicação, o contador cai — e essa queda é a informação. Painel que
   sempre mostra número parece vivo mesmo depois de ter morrido.          */
const HOJE = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
function dt(s){ const [d,mo,a]=String(s).split('/').map(Number); return new Date(a,mo-1,d); }
function diasDe(s){ return Math.round((HOJE() - dt(s)) / 86400000); }
function diasAte(s){ if(!/\d{2}\/\d{2}\/\d{4}/.test(s)) return null;
  return Math.round((dt(s) - HOJE()) / 86400000); }

/* Idade do acervo: há quantos dias entrou a publicação mais recente.
   É o sinal de que a coleta parou — o mais importante para quem decidiu
   não abrir portal nenhum.                                              */
function idadeAcervo(){
  const ds = MUDANCAS.map(m=>diasDe(m.data)).filter(n=>!isNaN(n));
  return ds.length ? Math.min(...ds) : null;
}

/* Três estados possíveis, e eles não podem ser confundidos:
   coletou e não havia nada · coletou e há novidade · não coletou.
   O terceiro é o perigoso, porque na tela ele se parece com o primeiro.  */
function confianca(){
  const idade = idadeAcervo();
  if(ESTADO_COLETA === 'indeterminada') return {c:'vm', t:'Estado da coleta desconhecido',
    d:`Não foi possível confirmar se o coletor rodou (${COLETA_ERRO || 'motivo não identificado'}). Enquanto isso não for confirmado, ausência de alerta nesta tela não significa ausência de novidade.`,
    confiar:false};
  if(ESTADO_COLETA !== 'ativa') return {c:'vm', t:'Coleta não ligada',
    d:'Nenhuma publicação deste acervo veio de fonte oficial. Enquanto o coletor não estiver publicado e agendado no servidor, este sistema não substitui a consulta ao Diário Oficial.',
    confiar:false};
  if(idade===null) return {c:'vm', t:'Acervo vazio',
    d:'A coleta está ligada, mas não há publicação registrada. Verifique o log da rotina.', confiar:false};
  if(idade > 3) return {c:'vm', t:`Última publicação há ${idade} dias`,
    d:'Silêncio longo demais para dia útil. Trate como coleta interrompida até confirmar o log da rotina — não como "nada mudou".',
    confiar:false};
  if(idade > 1) return {c:'am', t:`Última publicação há ${idade} dias`,
    d:'Pode ser fim de semana ou feriado. Confira a última execução da rotina antes de concluir que não houve novidade.',
    confiar:true};
  return {c:'vd', t:'Acervo atualizado',
    d:'A rotina rodou e o acervo recebeu publicação recente. Ausência de alerta aqui significa ausência de novidade, não falha de coleta.',
    confiar:true};
}

function KPI(){
  const r = rel();
  const noPeriodo = d => MUDANCAS.filter(m=>diasDe(m.data) >= 0 && diasDe(m.data) <= d);
  const acoes = r.filter(m=>m.seis).flatMap(m=>m.seis.fazer);
  const prazos = r.map(m=>diasAte(m.prazo)).filter(x=>x!==null && x>=0);

  return {
    hoje: noPeriodo(0).length,
    semana: noPeriodo(7).length,
    mes: noPeriodo(30).length,
    pendencias: pend().length,
    criticas: crit().length,
    alertas: r.length,
    acoes: acoes.length,
    acoesAbertas: CONFORM.pendencias,
    temas: TEMAS.length,
    temasAtivos: TEMAS.filter(t=>t.status!=='encerrado').length,
    temasMovidos: TEMAS.filter(t=>movsDoDia(t).length).length,
    setores: [...new Set(r.flatMap(m=>m.areas))].length,
    normas: [...new Set(r.map(m=>m.norma))].length,
    docs: CONFORM.documentos,
    prazoProx: prazos.length ? Math.min(...prazos) : null,
    /* tempo médio de adequação: da publicação ao prazo legal de cada item */
    tma: (()=>{ const v=r.map(m=>{const a=diasAte(m.prazo); return a===null?null:a+diasDe(m.data);})
      .filter(x=>x!==null); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0; })(),
    porClasse: (()=>{ const o={}; r.forEach(m=>enr(m).classes.forEach(c=>o[c]=(o[c]||0)+1)); return o; })(),
    porNivel: (()=>{ const o={crit:0,alto:0,moderado:0,baixo:0,info:0};
      TEMAS.forEach(t=>{const n=t.nivel==='medio'?'moderado':t.nivel; o[n]=(o[n]||0)+1;}); return o; })()
  };
}

/* Última movimentação de um tema, em Date. */
function ultimaMov(t){
  if(!t.movimentacoes || !t.movimentacoes.length) return null;
  const d = t.movimentacoes.map(m=>dt(m.data)).filter(x=>!isNaN(x));
  return d.length ? new Date(Math.max(...d)) : null;
}
function ultimaMovTexto(t){
  const d = ultimaMov(t);
  return d ? d.toLocaleDateString('pt-BR') : '—';
}
function diasSemMov(t){
  const d = ultimaMov(t);
  return d ? Math.round((HOJE() - d)/86400000) : null;
}
/* Movimentações de um tema ocorridas em uma data (padrão: hoje). */
function movsDoDia(t, ref){
  const alvoD = (ref || HOJE()).toLocaleDateString('pt-BR');
  return (t.movimentacoes||[]).filter(m=>m.data===alvoD);
}

/* ═══════════════════════════════════════════════════════════════════════
   ROTINA AUTOMÁTICA DAS 07:00
   O agendador é real: calcula a próxima janela, dispara sozinho quando o
   horário chega com o sistema aberto e grava o log.
   O que ele NÃO faz — e o sistema diz isso na tela em vez de fingir:
   navegador não roda com a aba fechada. Coleta diária de verdade,
   independente de alguém estar com o sistema aberto, exige o coletor
   agendado no servidor (pg_cron + Edge Function no projeto Supabase que
   este front já usa). Este agendador cobre a execução em tela e o
   histórico; a coleta noturna é do servidor.
   ═══════════════════════════════════════════════════════════════════════ */
const ROTINA = {
  hora: 7, minuto: 0,
  estado: STORE.ler('rotina', {ultima:null, itens:0, relevantes:0, criticas:0, log:[], execucoes:0}),
  timer: null,

  proxima(){
    const n = new Date(), p = new Date(n);
    p.setHours(this.hora, this.minuto, 0, 0);
    if(p <= n) p.setDate(p.getDate() + 1);
    return p;
  },
  faltam(){
    const ms = this.proxima() - new Date();
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
    return `${h}h ${String(m).padStart(2,'0')}min`;
  },
  agendar(){
    clearTimeout(this.timer);
    const ms = this.proxima() - new Date();
    this.timer = setTimeout(()=>{
      this.executar(true).catch(e=>console.error('[CIL] rotina falhou', e));
      this.agendar();
    }, Math.min(ms, 2147483000));
  },

  /* C18 · O agendador só existe enquanto a aba existe.
     Se ninguém abriu o sistema entre uma janela e outra, a rotina não
     rodou — e a tela não pode sugerir que rodou. Esta função conta
     quantas janelas das 07:00 passaram desde a última execução
     registrada, para que a rotina possa dizer o que não fez. */
  janelasPerdidas(){
    if(!this.estado.ultima) return null;
    const u = new Date(this.estado.ultima);
    if(isNaN(u)) return null;
    let n = 0;
    const marco = new Date(u);
    marco.setHours(this.hora, this.minuto, 0, 0);
    if(marco <= u) marco.setDate(marco.getDate() + 1);
    const agora = new Date();
    while(marco <= agora && n < 400){ n++; marco.setDate(marco.getDate() + 1); }
    return n;
  },
  gravar(){ STORE.gravar('rotina', this.estado); },

  /* Passos do ciclo. Com sessão ativa, cada passo consulta o banco;
     sem sessão, o passo roda sobre o acervo local e é marcado como tal. */
  /* Ordem do item 9 do escopo: a coleta e o processamento acontecem
     antes — de madrugada, no servidor. As 07:00 são a ENTREGA, não o
     início. O passo 10 é o único que roda no horário. */
  passos(){
    return [
      {t:'1 · Coleta nas fontes oficiais', d:`${FONTES.length} fontes · janela de 24 horas · executa de madrugada`},
      {t:'2 · Documento original armazenado', d:'Texto, órgão, tipo, data, URL e data de vigência preservados como vieram'},
      {t:'3 · Deduplicação por hash de conteúdo', d:'A mesma matéria republicada não vira movimentação nova'},
      {t:'4 · Triagem determinística', d:`Órgão emissor e vocabulário do perfil · ${CNAES.length} CNAEs · descarta o que não toca a Realtec`},
      {t:'5 · Classificação e relevância (Claude)', d:'Eixo, nível de criticidade e se gera obrigação, prazo ou mudança de procedimento'},
      {t:'6 · Vínculo com tema existente ou sugestão de tema novo', d:`${TEMAS.length} temas vivos comparados · tema novo é sugerido, nunca aberto sozinho`},
      {t:'7 · Comparação antes/depois', d:'Só quando as duas redações vieram da fonte — o sistema não reconstrói texto'},
      {t:'8 · Impacto na Realtec e ação necessária', d:'Área sugerida, prazo apurado na fonte e nível de urgência'},
      {t:'9 · Atualização do estado do tema e registro em log', d:'Estado atual reescrito, histórico só recebe entrada'},
      {t:'10 · Entrega do Radar às 07:00', d:'Digest com os quatro blocos · crítico não espera, dispara na hora'}
    ];
  },

  async executar(automatica){
    const ini = new Date();
    const k = KPI();
    this.estado.ultima = ini.toISOString();
    this.estado.execucoes = (this.estado.execucoes||0) + 1;

    /* O volume bruto lido no Diário só existe se houve coleta de verdade.
       Antes este campo recebia um número aleatório para "parecer" cheio —
       exatamente o tipo de mentira que um sistema de conformidade não pode
       contar. Sem coletor, o campo fica vazio e a tela diz por quê.       */
    this.estado.itens = null;
    if(COLETA_ATIVA){
      try{
        /* Corrigido nesta auditoria: a consulta buscava status='sucesso' e
           a coluna 'itens_lidos', nenhum dos dois existe no schema real
           (o status é 'concluida'/'parcial'/…, e o volume bruto é
           'documentos') — a consulta sempre devolvia vazio, então este
           número nunca tinha vindo do banco, mesmo com a coleta ligada. */
        const r = await SB.chamar('/rest/v1/coleta?status=in.(concluida,parcial)'
          + '&select=documentos&order=iniciada_em.desc&limit=1');
        const d = await r.json();
        if(Array.isArray(d) && d.length) this.estado.itens = d[0].documentos ?? null;
      }catch(e){ /* mantém vazio: melhor sem número do que com número inventado */ }
    }

    this.estado.relevantes = rel().length;
    this.estado.criticas = crit().filter(m=>!m.analisado).length;
    this.estado.temas = TEMAS.length;
    this.estado.temasMovidos = movidosHoje().length;
    this.estado.origem = COLETA_ATIVA ? 'banco'
                       : EM_PROCESSAMENTO.has(ESTADO_COLETA) ? 'acervo anterior (processamento em curso)'
                       : ESTADO_COLETA === 'falhou' ? 'acervo anterior (varredura falhou)'
                       : ESTADO_COLETA === 'indeterminada' ? 'semente local (estado da coleta desconhecido)'
                       : 'semente local';
    /* Crítico não espera o digest — item 11. */
    this.estado.alertas = varrerCriticos();

    const hh = ini.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const linha = {
      h: hh, dia: ini.toLocaleDateString('pt-BR'),
      modo: automatica ? 'automática · 07:00' : 'manual',
      r: `${this.estado.itens===null?'volume não informado':numG(this.estado.itens)+' itens lidos'} · ${this.estado.relevantes} relevantes · ${this.estado.temasMovidos} temas movimentados · ${this.estado.criticas} críticas pendentes`,
      origem: this.estado.origem, estado: ESTADO_COLETA
    };
    this.estado.log = [linha, ...(this.estado.log||[])].slice(0, 40);
    this.gravar();

    registrar('varredura', {modo: automatica?'automática':'manual', estado: ESTADO_COLETA,
                            relevantes: this.estado.relevantes, temas: this.estado.temasMovidos});
    if(this.estado.criticas > 0) this.alertar(k);
    if(typeof render === 'function') render();
    return linha;
  },

  alertar(k){
    const f = document.getElementById('iaFala');
    if(!f || iaAberta) return;
    f.innerHTML = `<p>Radar das 07:00 entregue. <b>${k.criticas} ${k.criticas===1?'tema crítico':'temas críticos'}</b>
      com pendência aberta em ${k.setores} ${k.setores===1?'setor':'setores'}.</p>
      <div class="aq"><button class="s" onclick="fecharFala();ir('inicio')">Abrir o Radar</button>
      <button class="n" onclick="fecharFala()">Depois</button></div>`;
    f.classList.add('on');
    setTimeout(()=>{ if(f.classList.contains('on')) f.classList.remove('on'); }, 16000);
  }
};

/* ═══════════════════════════════════════════════════════════════════════
   EXECUÇÃO MANUAL REAL — "Executar verificação agora"
   Nome prefixado (EXECM_) de propósito: a última auditoria travou o
   sistema inteiro por causa de uma colisão de nomes de função. Este
   módulo não reaproveita nenhum identificador de ROTINA/CIL.

   O que este botão faz, de verdade:
     1. chama a Edge Function `disparar-coleta`, que pede ao GitHub
        Actions para rodar o MESMO workflow/coletor da automática das
        03:00 (item 2 do escopo — motor único);
     2. essa chamada só confirma que o PEDIDO foi aceito — a consulta
        real acontece no worker do GitHub Actions, minutos depois;
     3. por isso o botão fica em "Executando…" e o sistema consulta
        historico_coleta() em intervalos até aparecer uma execução nova
        com status final — nunca marca "concluído" pela simples resposta
        HTTP da Edge Function (isso seria o mesmo erro do item 3: botão
        e spinner não são prova de consulta).
   ═══════════════════════════════════════════════════════════════════════ */
let EXECM_ESTADO = { fase:'normal', mensagem:null, execucaoBase:null };
let EXECM_POLL = null;

function EXECM_pararPoll(){ if(EXECM_POLL){ clearInterval(EXECM_POLL); EXECM_POLL = null; } }

async function executarVerificacaoAgora(){
  if(EXECM_ESTADO.fase === 'executando') return;   // trava contra clique duplo (item 19)
  if(!SB.tk()){
    EXECM_ESTADO = {fase:'erro', mensagem:'Entre com sua conta para disparar uma verificação.'};
    render(); return;
  }

  // Guarda a última execução conhecida ANTES de disparar, para saber
  // depois se o que apareceu em historico_coleta() é realmente NOVO —
  // sem isso, uma execução antiga já concluída poderia ser confundida
  // com o resultado do clique atual (item 16: não contar de novo).
  let base = null;
  try{ base = await SB.rpc('historico_coleta', {p_limite:1}); }catch(e){ /* segue mesmo sem base */ }
  EXECM_ESTADO = {fase:'executando', mensagem:'Disparando…',
                  execucaoBase: Array.isArray(base) && base[0] ? base[0].execucao_id : null};
  render();

  let resp;
  try{
    const r = await SB.chamar('/functions/v1/disparar-coleta', {method:'POST'});
    resp = await r.json();
  }catch(e){
    const msg = e && e.autenticacao ? 'Sessão expirada — entre novamente para disparar a verificação.'
              : e && e.status === 404 ? 'A função disparar-coleta ainda não foi publicada no servidor.'
              : e && e.rede ? 'Servidor inacessível — a verificação NÃO foi disparada.'
              : e && e.status === 409 ? 'Já existe uma verificação em andamento. Aguarde a conclusão.'
              : e && e.status === 429 ? 'Muitos disparos seguidos — aguarde alguns segundos e tente de novo.'
              : (e && e.message) || 'Não foi possível disparar a verificação.';
    EXECM_ESTADO = {fase:'erro', mensagem: msg};
    render();
    setTimeout(()=>{ if(EXECM_ESTADO.fase==='erro'){ EXECM_ESTADO={fase:'normal',mensagem:null}; render(); } }, 8000);
    return;
  }

  if(!resp || resp.aceito !== true){
    // Item 3: a integração pode simplesmente não estar configurada
    // (GITHUB_TOKEN/GITHUB_REPO ausentes) — a tela precisa dizer isso,
    // não fingir que tentou e funcionou.
    EXECM_ESTADO = {fase:'erro', mensagem: (resp && resp.mensagem) || 'A verificação não foi aceita pelo servidor.'};
    render();
    setTimeout(()=>{ if(EXECM_ESTADO.fase==='erro'){ EXECM_ESTADO={fase:'normal',mensagem:null}; render(); } }, 8000);
    return;
  }

  EXECM_ESTADO = {fase:'executando', mensagem: resp.mensagem, execucaoBase: EXECM_ESTADO.execucaoBase};
  render();

  // Espera o GitHub Actions realmente pegar o job e o coletor concluir.
  // Isto é honesto sobre o tempo real do processo: não há "concluído"
  // instantâneo quando a consulta acontece em outro serviço.
  const inicioPoll = Date.now();
  const LIMITE_MS = 20 * 60 * 1000; // 20 min — bem acima do timeout do workflow (45 min é o teto, mas a coleta do DOU normalmente termina em minutos)
  EXECM_pararPoll();
  EXECM_POLL = setInterval(async () => {
    if(Date.now() - inicioPoll > LIMITE_MS){
      EXECM_pararPoll();
      EXECM_ESTADO = {fase:'erro', mensagem:'A verificação foi disparada, mas não concluiu dentro do tempo esperado. Confira o histórico ou os logs do GitHub Actions.'};
      render();
      return;
    }
    let hist;
    try{ hist = await SB.rpc('historico_coleta', {p_limite:3}); }
    catch(e){ return; } // falha de poll não derruba a espera; tenta de novo no próximo tick
    const atual = Array.isArray(hist) ? hist[0] : null;
    if(!atual || atual.execucao_id === EXECM_ESTADO.execucaoBase) return; // ainda a execução anterior
    if(atual.status === 'agendada' || atual.status === 'em_execucao'){
      EXECM_ESTADO = {fase:'executando', mensagem:`Consultando fontes… (${atual.execucao_id})`, execucaoBase: EXECM_ESTADO.execucaoBase};
      render();
      return;
    }
    // Status final chegou — para de verdade, com o resultado real.
    EXECM_pararPoll();
    const ok = atual.status === 'concluida';
    const parcial = atual.status === 'parcial';
    EXECM_ESTADO = {
      fase: ok ? 'concluido' : parcial ? 'concluido_alertas' : 'erro',
      mensagem: ok ? `Verificação concluída · ${atual.fontes_ok}/${atual.fontes_previstas} fontes · ${atual.relevantes ?? 0} relevantes`
              : parcial ? `Concluída com alertas · ${atual.fontes_ok}/${atual.fontes_previstas} fontes responderam`
              : `Falha na verificação: ${atual.erro || 'sem detalhe registrado'}`,
      execucaoBase: atual.execucao_id
    };
    await verificarColeta();          // recarrega o estado oficial (ESTADO_COLETA/COLETA)
    render();
    setTimeout(()=>{ EXECM_ESTADO = {fase:'normal', mensagem:null, execucaoBase:null}; render(); }, 10000);
  }, 4000);
}

/* Histórico REAL — de historico_coleta(), não do log local do navegador.
   Carregado sob demanda pela tela (evita poluir toda renderização com
   uma chamada de rede). */
let EXECM_HISTORICO = null, EXECM_HISTORICO_ERRO = null, EXECM_HISTORICO_ABERTO = null, EXECM_HISTORICO_CARREGANDO = false;
async function EXECM_carregarHistorico(){
  if(EXECM_HISTORICO_CARREGANDO) return;   // evita disparos concorrentes se render() rodar várias vezes
  if(!SB.tk()){ EXECM_HISTORICO_ERRO = 'Entre com sua conta para ver o histórico real de execuções.'; render(); return; }
  EXECM_HISTORICO_CARREGANDO = true;
  try{
    EXECM_HISTORICO = await SB.rpc('historico_coleta', {p_limite:20});
    EXECM_HISTORICO_ERRO = null;
  }catch(e){
    EXECM_HISTORICO_ERRO = e && e.status === 404 ? 'historico_coleta() ainda não existe no banco — rode a migração 04.'
                          : e && e.rede ? 'Servidor inacessível.' : (e && e.message) || 'Não foi possível carregar o histórico.';
  }
  EXECM_HISTORICO_CARREGANDO = false;
  render();
}

/* ═══════════════ CADASTROS FEITOS NA TELA ═══════════════ */
/* C9/C10 · O cadastro de CNAE é entrada livre que fica gravada no
   navegador e volta para a tela em toda renderização. Sem escape, era
   XSS persistente; e o botão Remover montava o código dentro de um
   atributo onclick, então um apóstrofo no código quebrava o botão.
   Agora: escape na leitura, remoção por índice, validação na escrita. */
function addCnae(){
  const c = document.getElementById('nCnae'), d = document.getElementById('nCnaeD');
  const t = [...document.querySelectorAll('.tgC:checked')].map(x=>x.value)
              .filter(v => Object.prototype.hasOwnProperty.call(ETIQUETAS, v));
  const eEl = document.getElementById('cnaeErro');
  const falha = msg => { eEl.textContent = msg; eEl.style.display='block'; };
  const cod = (c.value||'').trim(), des = (d.value||'').trim();

  if(!cod || !des) return falha('Informe o código e a descrição do CNAE.');
  if(cod.length > 20) return falha('O código do CNAE tem no máximo 20 caracteres.');
  if(des.length > 160) return falha('A descrição tem no máximo 160 caracteres.');
  if(!/^[\d.\-\/]+$/.test(cod))
    return falha('O código aceita apenas números e os separadores . - / — exemplo: 43.21-5/00.');
  if(CNAES.some(x => x.c === cod)) return falha('Este CNAE já está cadastrado.');

  CNAES = [...CNAES, {c:cod, d:des, principal:false, tags:t}];
  STORE.gravar('cnaes', CNAES);
  eEl.style.display='none'; c.value=''; d.value='';
  render();
}
function removerCnae(i){
  const n = Number(i);
  if(!Number.isInteger(n) || n < 0 || n >= CNAES.length) return;
  if(CNAES[n].principal) return;
  CNAES = CNAES.filter((_,k) => k !== n);
  STORE.gravar('cnaes', CNAES); render();
}
function restaurarCnae(){ CNAES = CNAE_BASE.slice(); STORE.gravar('cnaes', CNAES); render(); }

  TEMAS.push({
    id, titulo: sg.titulo, eixo: sg.eixo || 'Administrativo', area: sg.area || sg.eixo || 'Administrativo',

    aberto_em: new Date().toLocaleDateString('pt-BR'),
    prazo: sg.prazo || '—', prazo_urg:false, alteracao: sg.alteracao || null,
    fonte: sg.fonte || 'não informada', confianca: sg.confianca || null,
    estado_atual: sg.estado_atual || 'Tema recém-aberto a partir de sugestão da triagem. Estado ainda não consolidado.',
    o_que_fazer_agora: sg.o_que_fazer_agora || null,
    movimentacoes: sg.movimentacoes || [{data:new Date().toLocaleDateString('pt-BR'), tipo:'abertura',
      sintese: sg.motivo || 'Tema aberto a partir de publicação identificada pela triagem.',
      fonte: sg.fonte || 'não informada', ref: sg.ref || ''}]
  });
  TEMAS_SUGERIDOS.splice(i,1);
  STORE.gravar('temas_sugeridos', TEMAS_SUGERIDOS);
  registrar('tema_aberto', {id, titulo: sg.titulo});
  ir('tema:'+id);

function descartarSugestao(i){
  const sg = TEMAS_SUGERIDOS[i];
  if(!sg) return;
  TEMAS_SUGERIDOS.splice(i,1);
  STORE.gravar('temas_sugeridos', TEMAS_SUGERIDOS);

  render();
}

/* ─── ALERTA CRÍTICO IMEDIATO — não espera as 07:00 ────────────────── */
/* Item 11: nível crítico dispara na hora. Aqui o disparo em tela é real;
   o envio por e-mail/mensagem é do servidor (ver coletor.py e a função
   `despachar_alerta`), porque navegador fechado não notifica ninguém.  */
let ALERTAS_DISPARADOS = new Set(STORE.ler('alertas_disparados', []) || []);

function alertaCritico(t, mv){
  const chave = t.id + '|' + (mv ? mv.data + mv.tipo : 'estado');
  if(ALERTAS_DISPARADOS.has(chave)) return false;
  ALERTAS_DISPARADOS.add(chave);
  STORE.gravar('alertas_disparados', [...ALERTAS_DISPARADOS]);
  registrar('alerta_critico', {tema:t.id, movimentacao: mv ? mv.data+' '+mv.tipo : null});
  criarAlerta('crit', t, mv ? mv.sintese : t.estado_atual);

  const f = document.getElementById('iaFala');
  if(!f || iaAberta) return true;
  f.innerHTML = `<p><b>Alerta crítico</b> — ${esc(t.titulo)}.<br>
    ${esc(mv ? mv.sintese : t.estado_atual)}</p>
    <div class="aq"><button class="s" onclick="fecharFala();ir('tema:${escId(t.id)}')">Abrir tema</button>
    <button class="n" onclick="fecharFala()">Depois</button></div>`;
  f.classList.add('on');
  return true;
}

/* Varre os temas críticos com movimentação nova e dispara o que ainda
   não foi disparado. Chamada ao carregar e ao fim de cada rotina. */
function varrerCriticos(){
  let n = 0;
  ativos().filter(t=>t.nivel==='crit').forEach(t=>{
    const mv = movsDoDia(t)[0];
    if(mv && alertaCritico(t, mv)) n++;
  });
  return n;
}

/* ─── CENTRAL DE MONITORAMENTO (item 22 do escopo) ─────────────────────
   Contador calculado a cada renderização — nunca um número estático
   gravado no código (item 23). A "próxima execução automática" segue o
   cron real de radar.yml: 03:00 America/Sao_Paulo, dias úteis (seg–sex,
   "1-5" no cron). Se o cron mudar, este cálculo precisa mudar junto —
   não há como ler o cron do GitHub a partir do navegador, então isto é
   uma PROJEÇÃO baseada no arquivo tal como está nesta entrega, não uma
   leitura ao vivo do agendador. A tela avisa disso explicitamente. */
function EXECM_proximaAutomatica(){
  const agora = new Date();
  // Constrói "agora" e "próximo 03:00" como horário de São Paulo (UTC-3,
  // sem horário de verão desde 2019 — ver ressalva no relatório).
  const agoraSP = new Date(agora.toLocaleString('en-US', {timeZone:'America/Sao_Paulo'}));
  let p = new Date(agoraSP);
  p.setHours(3,0,0,0);
  if(p <= agoraSP) p.setDate(p.getDate()+1);
  // pula fim de semana (cron só roda seg–sex)
  while(p.getDay()===0 || p.getDay()===6) p.setDate(p.getDate()+1);
  const diffMs = p - agoraSP;
  const h = Math.max(0, Math.floor(diffMs/3600000));
  const m = Math.max(0, Math.floor((diffMs%3600000)/60000));
  return {data: p, texto: `${h}h ${String(m).padStart(2,'0')}min`};
}

function vRotina(){
  const e = ROTINA.estado;

function vRelatorio(){
  const k = KPI(), r = rel(), c = crit(), p = pend();
  const hoje = new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const futuras = r.filter(m=>{ const d=diasAte(m.prazo); return d!==null && d>0; })
                   .sort((a,b)=>diasAte(a.prazo)-diasAte(b.prazo));
  const vigentes = r.filter(m=>m.prazo==='Em vigor');
  const acoes = r.filter(m=>m.seis).flatMap(m=>m.seis.fazer.map(f=>({...f, n:m.norma})));
  const porResp = acoes.reduce((o,a)=>{(o[a.r]=o[a.r]||[]).push(a); return o;},{});

  const B=(n,t,html)=>`<div class="bl"><div class="bl-h"><span class="bl-n">${n}</span>
    <strong>${t}</strong></div>${html}</div>`;

  return `${avisoOrigem()}
  <div class="cab"><h1>Relatório executivo</h1>
    <p>${hoje} · gerado a partir do estado atual do acervo. Feito para ser lido pela diretoria em
       dois minutos e anexado a ata.</p></div>

  ${B(1,'Resumo do dia', `<p>O acervo registra ${r.length} alterações com impacto identificado para a
    Realtec, das quais ${c.length} são críticas e ${p.length} ainda aguardam análise. O alcance chega
    a ${k.setores} setores internos, distribuídas em ${k.temasAtivos} temas em acompanhamento.
    ${k.prazoProx!==null ? `O prazo mais próximo vence em ${k.prazoProx} dias.` :
      'Nenhum prazo futuro em curso — o que está aberto já é exigível.'}</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-top:14px">
      ${[[k.criticas,'Críticas','vm'],[k.pendencias,'Pendentes','am'],[k.temasAtivos,'Temas vivos',''],
         [k.acoes,'Ações',''],[CONFORM.pct+'%','Conformidade','']]
        .map(([v,t,cc])=>`<div style="padding:11px 13px;border-radius:var(--r-m);background:var(--sup-2)">
          <div class="num" style="font-size:18px;font-weight:700;${cc?`color:var(--${cc})`:''}">${v}</div>
          <div style="font-size:11.5px;color:var(--t-2);margin-top:3px">${t}</div></div>`).join('')}
    </div>`)}

  ${B(2,'Mudanças críticas', c.length ? c.map(m=>{
    const e=enr(m);
    return `<div class="lin sim"><svg class="ic ic-p mk"><use href="#k-alerta"/></svg>
      <b>${m.norma}</b><span>${m.titulo}<br>
      <span style="color:var(--t-3);font-size:12px">${e.responsavel} · ${m.prazo} · sanção: ${e.multa}</span></span></div>`;
  }).join('') : '<p>Nenhuma alteração crítica em aberto no período.</p>')}

  ${B(3,'Mudanças importantes', r.filter(m=>m.nivel==='alto').length ?
    r.filter(m=>m.nivel==='alto').map(m=>`<div class="lin sim">
      <svg class="ic ic-p mk"><use href="#k-ok"/></svg><b>${m.norma}</b>
      <span>${m.titulo} — prazo ${m.prazo}.</span></div>`).join('')
    : '<p>Nenhuma alteração de nível importante no período.</p>')}

  ${B(4,'Vigências futuras', futuras.length ? futuras.map(m=>`<div class="lin sim">
      <svg class="ic ic-p mk"><use href="#k-relogio"/></svg><b>${m.norma}</b>
      <span>Entra em vigor em ${m.prazo} — faltam ${diasAte(m.prazo)} dias.</span></div>`).join('')
    : '<p>Nenhuma vigência futura mapeada. Todas as alterações do acervo já são exigíveis.</p>')
    + (vigentes.length?`<div class="motivo" style="margin-top:12px">
      <b>Já exigível hoje:</b> ${vigentes.map(m=>m.norma).join(', ')}. Sem período de tolerância.</div>`:'')}

  ${B(5,'Temas com movimentação no período', TEMAS.filter(t=>t.status!=='encerrado').length
    ? TEMAS.filter(t=>t.status!=='encerrado')
        .sort((a,b)=>nivelDe(a.nivel).o-nivelDe(b.nivel).o).map(t=>`<div class="lin sim">
        <svg class="ic ic-p mk"><use href="#k-tempo"/></svg><b>${esc(t.eixo)}</b>
        <span>${esc(t.titulo)} — última movimentação em ${ultimaMovTexto(t)}
        (${(t.movimentacoes||[]).length} no histórico).</span></div>`).join('')
    : '<p>Nenhum tema em acompanhamento.</p>')}

  ${B(6,'Pendências e responsáveis', Object.entries(porResp).map(([resp,its])=>`
      <div class="lin sim"><svg class="ic ic-p mk"><use href="#k-users"/></svg>
      <b>${resp}</b><span>${its.length} aç${its.length>1?'ões':'ão'} atribuída${its.length>1?'s':''} —
      prazo mais próximo em ${its.map(i=>i.p).sort()[0]}.</span></div>`).join(''))}

  ${B(7,'Checklist de adequação', acoes.map(a=>`<div class="tarefa">
      <div class="cx" onclick="tick(this)"><svg class="ic ic-p"><use href="#k-tick"/></svg></div>
      <div class="tf"><p>${a.t}</p><s>${a.n} · ${a.r} · até ${a.p}</s></div></div>`).join(''))}

  ${B(8,'Recomendação', `<p>Priorizar o encerramento das ${c.length} pendências críticas antes de
    abrir frente nas de prazo futuro — é a pendência crítica que derruba o índice de conformidade e
    que aparece em auditoria de cliente. Na sequência, tratar as vigências de prazo mais curto.</p>
    <p>Os temas em acompanhamento continuam recebendo movimentação depois da publicação inicial:
    é a regulamentação e a nota técnica posterior que mudam o procedimento na prática, não o
    ato original. Por isso o encerramento de um tema depende de decisão de área, não de data.</p>`)}

  <div class="impacto-emp">
    <div class="h"><svg class="ic"><use href="#k-empresa"/></svg><strong>Conclusão técnica</strong></div>
    <p>${c.length ? `Situação de atenção: há ${c.length} alteraç${c.length>1?'ões':'ão'} crítica${c.length>1?'s':''}
      já exigível${c.length>1?'is':''}, alcançando ${k.setores} setores internos. O risco não é
      teórico — é de autuação.`
      : 'Ambiente regulatório sob controle: nenhuma alteração crítica em aberto no período.'}
      ${p.length ? ` ${p.length} análise${p.length>1?'s':''} ainda depende${p.length>1?'m':''} de validação humana antes de virar decisão.` : ''}
      Confirme cada dispositivo na fonte oficial antes de formalizar qualquer providência.</p>
  </div>

  <div class="bts">
    <button class="bt pr" onclick="window.print()">Imprimir ou salvar em PDF</button>
    <button class="bt sc" onclick="ir('painel')">Voltar ao painel</button>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   IA CORPORATIVA
   As perguntas de rotina da diretoria não são respondidas por texto
   guardado: são calculadas do estado do sistema no momento da pergunta.
   Se uma alteração for arquivada, a resposta muda junto.
   ═══════════════════════════════════════════════════════════════════════ */
const IA_CORP = {
  hoje(){
    const k=KPI(), n=k.semana;
    return {t:'O que mudou',
      x:`Na janela dos últimos 7 dias o acervo registrou ${n} publicaç${n===1?'ão':'ões'}, das quais
         ${rel().length} têm impacto identificado e ${ign().length} foram descartadas com motivo registrado.
         ${pend().length ? `${pend().length} ainda aguardam análise.` : 'Nenhuma aguarda análise.'}`,
      r: crit().length ? {n:'vm', t:`${crit().length} crítica${crit().length>1?'s':''} em aberto`,
           d:crit().map(m=>`${m.norma} — ${m.titulo}`).join('. ')+'.'}
         : {n:'am', t:'Nenhuma crítica em aberto', d:'As alterações do período estão em prazo aberto ou já resolvidas.'},
      ir:'painel', irT:'Abrir painel executivo'};
  },
  urgencia(){
    const k=KPI(), c=crit();
    return {t:'Existe urgência',
      x: c.length ? `Sim. ${c.length} alteraç${c.length>1?'ões':'ão'} crítica${c.length>1?'s':''} já
          exigível${c.length>1?'is':''}: ${c.map(m=>m.norma).join(', ')}. Não há período de tolerância —
          a fiscalização pode autuar hoje.`
        : `Não há urgência de nível crítico. ${k.prazoProx!==null?`O prazo mais próximo vence em ${k.prazoProx} dias.`:''}`,
      r: c.length ? {n:'vm', t:'Exigível agora', d:c.map(m=>`${m.norma}: ${enr(m).penalidade}`).join(' ')}
                  : {n:'am', t:'Sem urgência imediata', d:'Prazos em curso, com folga para adequação.'},
      ir:'alertas', irT:'Ver alertas'};
  },
  temas(){
    const ativos = TEMAS.filter(t=>t.status!=='encerrado');
    const movidos = ativos.filter(t=>movsDoDia(t).length);
    return {t:'Temas em acompanhamento',
      x:`${ativos.length} tema${ativos.length>1?'s':''} vivo${ativos.length>1?'s':''} no Radar.
         ${movidos.length ? `${movidos.length} recebeu movimentação hoje: ${movidos.map(t=>t.titulo).join('; ')}.`
           : podeAfirmarSemAlteracao()
             ? 'Nenhum recebeu movimentação hoje — e isso é uma afirmação, não silêncio: a varredura rodou.'
             : 'Não é possível dizer se algum recebeu movimentação hoje — a varredura não confirmou execução.'}`,
      r:{n: podeAfirmarSemAlteracao()?'am':'vm',
         t: podeAfirmarSemAlteracao()?'Um tema não termina na publicação':'Estado da varredura não confirmado',
         d: podeAfirmarSemAlteracao()
            ? 'A regulamentação e a nota técnica que vêm depois é que mudam o procedimento na prática. Por isso o tema segue aberto até uma pessoa da área encerrar.'
            : 'Enquanto a coleta não confirmar execução, ausência de movimentação nesta tela não prova ausência de publicação.'},
      ir:'temas', irT:'Abrir temas vivos'};
  },
  tributario(){
    const t = MUDANCAS.filter(m=>enr(m).classes.includes('Tributária')||enr(m).classes.includes('Fiscal'));
    return {t:'Alterações tributárias',
      x: t.length ? `${t.length} no acervo: ${t.map(m=>`${m.norma} (${m.titulo.toLowerCase()})`).join('; ')}.`
        : 'Nenhuma alteração tributária no acervo atual.',
      r:{n:'am', t:'Ponto de atenção', d:'A transição CBS/IBS segue até 2033 com obrigações crescentes. A fase atual é de teste, sem recolhimento efetivo, mas com exigência de destaque na nota.'},
      ir:'det:cbs', irT:'Abrir análise da transição'};
  },
  engenharia(){
    const e = MUDANCAS.filter(m=>enr(m).classes.includes('Engenharia')||m.areas.includes('Engenharia'));
    return {t:'Alterações de engenharia',
      x: e.length ? `${e.length} alteraç${e.length>1?'ões':'ão'} alcança${e.length>1?'m':''} a
         engenharia: ${e.map(m=>m.norma).join(', ')}. O efeito recai sobre procedimento de obra,
         análise de risco e PGR por frente — não apenas sobre o programa da sede.`
        : 'Nenhuma alteração com efeito direto sobre engenharia no acervo atual.',
      r:{n:'am', t:'Multiplicação por frente',
         d:'Uma metodologia única atende toda a empresa, mas o inventário de risco é por frente. É aí que o prazo aperta.'},
      ir:'det:nr35', irT:'Abrir NR-35'};
  },
  hojefazer(){
    const a = rel().filter(m=>m.seis).flatMap(m=>m.seis.fazer.map(f=>({...f,n:m.norma})))
      .sort((x,y)=>x.p.localeCompare(y.p)).slice(0,6);
    return {t:'O que precisa ser atualizado',
      x:`As ${a.length} ações de prazo mais próximo, na ordem em que vencem. O plano completo tem
         ${rel().filter(m=>m.seis).flatMap(m=>m.seis.fazer).length} ações.`,
      lista:a, r:{n:'am', t:'Documentos que mudam junto',
         d:'PGR, PCMSO, LTCAT, PPP, APR, inventário de riscos, procedimentos operacionais e treinamentos — a mesma alteração costuma alcançar vários deles.'},
      ir:'acoes', irT:'Abrir plano de ação'};
  },

/* ═══════════════════════════════════════════════════════════════════════
   ▓▓ REALTEC SENTINEL — CAMADA DE CONFIANÇA, AÇÃO E ADEQUAÇÃO ▓▓

   Tudo daqui para baixo é acréscimo sobre o Radar. Nenhuma classe CSS
   nova: os módulos reaproveitam .ct .sec .lista .li .bl .lin .tag .et
   .nm .at .tarefa, e por isso continuam respondendo ao tema claro/escuro
   e ao layout responsivo sem tocar no CSS original.

   A regra que atravessa o arquivo inteiro: ausência de informação nunca
   vira "não existe", e falha de consulta nunca vira "não há novidades".
   ═══════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────────────
   ARQUITETURA DE CONFIANÇA (item 4)
   Cinco estados, e nenhum deles é "provavelmente ok". O estado de um
   item nunca pode ser melhor que o estado da coleta que o trouxe: se a
   varredura não foi confirmada, tudo é ⚫ INDETERMINADO, por mais
   completa que a análise pareça na tela.
   ───────────────────────────────────────────────────────────────────── */
const VERIF = {
  verificado:    {i:'🟢', c:'vd', t:'Verificado',
                  d:'A fonte foi consultada e a informação foi encontrada e conferida.'},
  pendente:      {i:'🟡', c:'am', t:'Análise pendente',
                  d:'A publicação foi encontrada, mas ainda não foi analisada.'},
  validar:       {i:'🟠', c:'am', t:'Requer validação',
                  d:'Possível impacto identificado pela análise. Depende de conferência humana antes de virar decisão.'},
  critico:       {i:'🔴', c:'vm', t:'Crítico',
                  d:'Há impacto, prazo ou risco que exige ação.'},
  indeterminado: {i:'⚫', c:'nt', t:'Indeterminado',
                  d:'Não foi possível verificar a fonte ou o estado da coleta.'}
};

function verificacaoDe(t){
  if(!podeAfirmarSemAlteracao()) return 'indeterminado';
  if(t.verificacao && VERIF[t.verificacao]) return t.verificacao;
  if(t.nivel === 'crit') return 'critico';
  if(t.analisado === false) return 'pendente';
  if(t.requer_validacao) return 'validar';
  if(t.confianca && ['BAIXO','MODERADO'].includes(t.confianca.f)) return 'validar';
  return 'verificado';
}

/* Renomeada de `selo` para `seloVerif`: havia colisão com function
   selo(t) do painel da IA. Por hoisting, esta declaração vencia e o
   aviso "resposta de exemplo" sumia — além de causar recursão infinita
   em iaTurno. Nome único evita a classe inteira de problema. */
function seloVerif(v, curto){
  const x = VERIF[v] || VERIF.indeterminado;
  return `<span class="et ${x.c}" title="${esc(x.d)}">
    <span class="pt"></span>${x.i}${curto?'':' '+x.t}</span>`;
}

/* Frase padrão para toda ausência. Nunca "não há": sempre "não foi
   possível concluir a partir do que foi lido". */
const SEM_FONTE   = 'Não identificado na fonte analisada.';
const SEM_CONSULTA= 'Não foi possível verificar a fonte.';
const INCONCLUSIVO= 'Análise inconclusiva — requer validação.';

/* ─────────────────────────────────────────────────────────────────────
   ESTADOS DE INTERFACE (item 22)
   Nenhuma tela importante fica simplesmente vazia. Sete formas, uma
   função — para que o vazio, o erro e o "sem permissão" não sejam
   confundidos entre si pelo leitor.
   ───────────────────────────────────────────────────────────────────── */
function tela(tipo, titulo, texto, acao){
  const T = {
    carregando:  ['k-tempo',  't-3'],
    vazio:       ['k-ok',     't-3'],
    erro:        ['k-alerta', 'vm'],
    degradado:   ['k-alerta', 'am'],
    semSessao:   ['k-users',  't-3'],
    semPermissao:['k-escudo', 'am'],
    indeterminado:['k-alerta','am']
  }[tipo] || ['k-menos','t-3'];
  return `<div class="ct"><div class="vazio">
    <svg class="ic ic-g i" style="margin:0 auto;color:var(--${T[1]})"><use href="#${T[0]}"/></svg>
    <b>${esc(titulo)}</b><p>${esc(texto)}</p>
    ${acao?`<div class="bts" style="justify-content:center;margin-top:14px">
      <button class="bt sc" onclick="${acao[1]}">${esc(acao[0])}</button></div>`:''}
  </div></div>`;
}

/* ─────────────────────────────────────────────────────────────────────
   CENTRAL DE FONTES (item 12)
   O array antigo era [nome, intervalo] — não tinha onde guardar falha,
   motivo real, tempo de resposta ou histórico. Agora cada fonte é um
   registro. `ultima_real` só é preenchida por varredura de verdade;
   enquanto for null, a tela diz "nunca consultada", não "há 12 min".
   ───────────────────────────────────────────────────────────────────── */
const FONTE_ESTADO = {
  online:        {i:'🟢', c:'vd', t:'Online'},
  instavel:      {i:'🟡', c:'am', t:'Instável'},
  erro:          {i:'🔴', c:'vm', t:'Erro'},

 {id:'dou',     nome:'DOU — Imprensa Nacional', orgao:'Imprensa Nacional', tipo:'XML (INLABS)',

 {id:'esocial', nome:'eSocial', orgao:'Comitê Gestor do eSocial', tipo:'HTML',

  url:'https://www.gov.br/inss', intervalo:'diário'},
 {id:'tst',     nome:'TST — jurisprudência', orgao:'Tribunal Superior do Trabalho', tipo:'HTML',

].map(f=>Object.assign({
  estado:'indeterminada', ultima_real:null, ultimo_sucesso:null, ultima_falha:null,
  motivo_falha:null, falhas:null, ms:null, ms_medio:null, taxa:null,
  publicacoes:null, novas:null, historico:[]
}, f));

/* Compatibilidade: telas antigas ainda leem FONTES como [nome, intervalo]. */
const FONTES = FONTES_DET.map(f=>[f.nome, f.intervalo]);

/* O estado de cada fonte vem da varredura. Sem varredura confirmada,
   todas ficam ⚪ indeterminada — que é diferente de 🔴 erro (sabemos que
   falhou) e de ⚫ desativada (decidimos não consultar). */
function aplicarEstadoFontes(){
  const falha = COLETA.fontes_falha || [];
  FONTES_DET.forEach(f=>{
    if(!podeAfirmarSemAlteracao()){
      f.estado = ESTADO_COLETA === 'falhou' ? 'erro' : 'indeterminada';
      f.motivo_falha = ESTADO_COLETA === 'falhou' ? (COLETA_ERRO || null) : null;
      return;
    }
    if(falha.includes(f.nome)){
      f.estado = 'erro';
      f.ultima_falha = COLETA.terminada;
      f.motivo_falha = COLETA_ERRO || 'a fonte não respondeu na última varredura';
    }else{
      f.estado = 'online';
      f.ultima_real = COLETA.terminada;
      f.ultimo_sucesso = COLETA.terminada;
      f.motivo_falha = null;
    }
  });
}

/* Teste real, nunca simulado. O navegador não alcança gov.br por CORS,
   então o teste passa pela Edge Function. Sem ela publicada, o sistema
   diz que NÃO CONSEGUIU TESTAR — que é diferente de "a fonte falhou" e
   muito diferente de um ✔ verde encenado. */
let TESTE_FONTE = {};
async function testarFonte(id){
  const f = FONTES_DET.find(x=>x.id===id); if(!f) return;
  TESTE_FONTE[id] = {estado:'testando'}; render();
  const t0 = performance.now();
  try{
    if(!SB.tk()) throw Object.assign(new Error('sem sessão'), {autenticacao:true});
    const r = await SB.chamar('/functions/v1/testar-fonte', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({fonte:f.id, url:f.url})});
    const d = await r.json();
    TESTE_FONTE[id] = {estado: d.ok ? 'ok' : 'falha', ms: d.ms ?? Math.round(performance.now()-t0),
                       http: d.http ?? null, motivo: d.motivo || null,
                       em: new Date().toISOString()};
    f.estado = d.ok ? 'online' : 'erro';
    f.ms = TESTE_FONTE[id].ms;
    f.motivo_falha = d.ok ? null : nomeMotivo(d.motivo);
    if(d.ok) f.ultimo_sucesso = TESTE_FONTE[id].em; else f.ultima_falha = TESTE_FONTE[id].em;
    f.ultima_real = TESTE_FONTE[id].em;
  }catch(e){
    TESTE_FONTE[id] = {estado:'indisponivel', em:new Date().toISOString(),
      motivo: e && e.autenticacao ? 'entre com sua conta para testar'
            : e && e.status === 404 ? 'a função testar-fonte ainda não foi publicada no servidor'
            : e && e.rede ? 'servidor inacessível'
            : (e && e.message) || 'não foi possível testar'};
    /* O estado da fonte NÃO muda: não conseguimos testar, então não
       sabemos nada de novo sobre ela. */
  }
  registrar('teste_fonte', {fonte:id, resultado:TESTE_FONTE[id].estado});
  render();
}

let fonteAberta = null;
function verHistoricoFonte(id){ fonteAberta = (fonteAberta===id?null:id); render(); }

      <h3 style="margin-top:8px">${esc(f.nome)}</h3>
      <div style="margin-top:11px">
        ${campo('Endereço', f.url)}
        ${campo('Intervalo previsto', f.intervalo)}

        ${campo('Última execução com sucesso', dtBR(f.ultimo_sucesso))}

        ${campo('Taxa de sucesso', f.taxa==null?null:f.taxa+'%')}
        ${campo('Publicações encontradas', f.publicacoes)}
        ${campo('Novas publicações', f.novas)}
        ${campo('Última falha', dtBR(f.ultima_falha), !!f.ultima_falha)}

      </div>
      ${f.estado==='indeterminada'?`<div class="motivo" style="margin-top:11px">
        Esta fonte está <b>cadastrada</b>, não lida. Nenhuma varredura confirmada a consultou ainda —

        inventar leitura.</div>`:''}
      ${f.estado==='erro'?`<div class="motivo" style="margin-top:11px">
        Enquanto esta fonte estiver em erro, o Sentinel <b>não afirma</b> "sem alteração" para o que
        ela cobre. O que foi publicado nela nesta janela não foi lido.</div>`:''}

      ${(()=>{ const T = TESTE_FONTE[f.id]; if(!T) return '';
        return `<div class="motivo" style="margin-top:11px;${

             :T.estado==='falha'?`Fonte não respondeu · ${esc(nomeMotivo(T.motivo))}${T.http?` · HTTP ${T.http}`:''}`
             :'Não foi possível testar'}</b>
          ${T.estado==='indisponivel'?`<br>${esc(T.motivo)}. O estado desta fonte continua o que era —

        </div>`; })()}

      <div class="bts" style="margin-top:12px">
        <button class="bt sc" onclick="testarFonte('${escId(f.id)}')"
          ${TESTE_FONTE[f.id]&&TESTE_FONTE[f.id].estado==='testando'?'disabled':''}>Testar fonte agora</button>
        <button class="bt sc" onclick="verHistoricoFonte('${escId(f.id)}')">
          ${fonteAberta===f.id?'Ocultar histórico':'Ver histórico'}</button>
      </div>

      ${fonteAberta===f.id?`<div style="margin-top:12px">
        ${(f.historico||[]).length?`<div class="lista">${f.historico.map(h=>`<div class="li">
          <span class="num" style="font-size:11.5px;color:var(--${h.ok?'vd':'vm'});flex:none;width:70px">

            <s>${new Date(h.em).toLocaleString('pt-BR')}${h.ms?` · ${h.ms} ms`:''}</s></span>
        </div>`).join('')}</div>`
        : tela('vazio','Sem histórico registrado',
            'O histórico por fonte vive na tabela fonte_execucao do servidor e aparece aqui depois da primeira varredura confirmada.')}
      </div>`:''}
    </div></div>`;
  }).join('')}

  <p style="font-size:11.5px;color:var(--t-3);text-align:center;margin-top:22px;line-height:1.6">
    Histórico completo por fonte fica na tabela <span class="num">coleta</span> do servidor.
    Enquanto o coletor não publicar, esta tela reflete apenas a última varredura conhecida.</p>`;
}

/* ─────────────────────────────────────────────────────────────────────
   CENTRAL DE AÇÕES (item 9)
   O plano de ação era leitura: um checkbox que se apagava no F5. Agora
   cada ação é registro com ciclo de vida — status, observação, quem
   concluiu e quando. Toda ação guarda o tema que a originou, porque
   ação sem origem rastreável não serve para auditoria.
   ───────────────────────────────────────────────────────────────────── */
const PRIORIDADE = {alta:{c:'vm',t:'Alta'}, media:{c:'am',t:'Média'}, baixa:{c:'nt',t:'Baixa'}};
const STATUS_ACAO = {
  pendente:  {c:'am', t:'Pendente'},
  andamento: {c:'nt', t:'Em andamento'},
  concluida: {c:'vd', t:'Concluída'},
  cancelada: {c:'nt', t:'Cancelada'}
};

/* Semente derivada das análises já existentes — cada ação nasce ligada
   ao tema e à alteração de onde veio. */
function semearAcoes(){
  const its = [];
  TEMAS.forEach(t=>{
    const m = t.alteracao ? MUDANCAS.find(x=>x.id===t.alteracao) : null;
    if(!m || !m.seis || !m.seis.fazer) return;
    m.seis.fazer.forEach((f,i)=>{
      its.push({
        id: `${t.id}-${i}`, tema_id: t.id, alteracao: m.id,
        texto: f.t, area: f.r, responsavel: null,
        prazo: /^\d{2}\/\d{2}$/.test(f.p) ? f.p + '/2026' : f.p,
        prioridade: t.nivel === 'crit' ? 'alta' : t.nivel === 'alto' ? 'media' : 'baixa',
        status: 'pendente', obs: '', concluida_em: null, concluida_por: null
      });
    });
  });
  return its;
}
let ACOES = STORE.ler('acoes_v2', null) || semearAcoes();
const gravarAcoes = () => STORE.gravar('acoes_v2', ACOES);

const acaoPorId  = id => ACOES.find(a=>a.id===id) || null;
const acoesDoTema= id => ACOES.filter(a=>a.tema_id===id);
const abertas    = () => ACOES.filter(a=>a.status==='pendente'||a.status==='andamento');

function diasPrazo(a){
  if(!a.prazo || !/\d{2}\/\d{2}\/\d{4}/.test(a.prazo)) return null;
  return -diasDe(a.prazo);   // negativo = atrasada
}
const atrasadas = () => abertas().filter(a=>{const d=diasPrazo(a); return d!==null && d<0;});
const paraHoje  = () => abertas().filter(a=>diasPrazo(a)===0);
const proximas  = () => abertas().filter(a=>{const d=diasPrazo(a); return d===null || d>0;});

function mudarStatus(id, novo){
  const a = acaoPorId(id); if(!a) return;
  if(!podeEscrever()) return avisar('Seu perfil não permite alterar ações. Fale com o administrador do Sentinel.');
  a.status = novo;
  if(novo === 'concluida'){
    a.concluida_em = new Date().toISOString();
    a.concluida_por = USUARIO.autenticado ? USUARIO.nome : 'sessão anônima';
  }else{
    a.concluida_em = null; a.concluida_por = null;
  }
  gravarAcoes();
  registrar('acao_status', {id, status: novo, tema: a.tema_id});
  persistir('acao', {id_local:a.id, tema_id:a.tema_id, texto:a.texto,
    area_sugerida:a.area, prioridade:a.prioridade, prazo:a.prazo || null,
    observacao:a.obs || null, status:a.status,
    concluida_em:a.concluida_em, concluida_por_nome:a.concluida_por}, true);
  render();
}

function anotarAcao(id){
  const a = acaoPorId(id); if(!a) return;
  if(!podeEscrever()) return avisar('Seu perfil não permite anotar ações.');
  const txt = prompt('Observação sobre esta ação:', a.obs || '');
  if(txt === null) return;
  a.obs = txt.slice(0, 500);
  gravarAcoes();
  registrar('acao_observacao', {id, tema: a.tema_id});
  render();
}

function mudarPrazoAcao(id){
  const a = acaoPorId(id); if(!a) return;
  if(!podeEscrever()) return avisar('Seu perfil não permite alterar prazos.');
  const txt = prompt('Novo prazo (DD/MM/AAAA). O prazo legal não muda — este é o prazo interno:', a.prazo || '');
  if(txt === null) return;
  if(txt && !/^\d{2}\/\d{2}\/\d{4}$/.test(txt.trim()))
    return avisar('Formato inválido. Use DD/MM/AAAA.');
  registrar('acao_prazo', {id, de: a.prazo, para: txt.trim(), tema: a.tema_id});
  a.prazo = txt.trim(); gravarAcoes(); render();
}

function mudarResponsavel(id){
  const a = acaoPorId(id); if(!a) return;
  if(!podeEscrever()) return avisar('Seu perfil não permite alterar responsáveis.');
  const txt = prompt('Responsável por esta ação:', a.responsavel || '');
  if(txt === null) return;
  registrar('acao_responsavel', {id, de: a.responsavel, para: txt.trim(), tema: a.tema_id});
  a.responsavel = txt.trim() || null; gravarAcoes(); render();
}

/* Permissão de escrita. Sem sessão, o sistema é de leitura — e diz isso
   em vez de deixar o botão quebrar em silêncio. */
function podeEscrever(){
  return USUARIO.autenticado && ['admin','diretoria','responsavel']
    .includes((USUARIO.perfil || 'responsavel').toLowerCase());
}
function avisar(msg){
  const f = document.getElementById('iaFala'); if(!f) return;
  f.innerHTML = `<p>${esc(msg)}</p>
    <div class="aq"><button class="n" onclick="fecharFala()">Entendi</button></div>`;
  f.classList.add('on');
  setTimeout(()=>f.classList.remove('on'), 7000);
}

function cartaoAcao(a){
  const S = STATUS_ACAO[a.status] || STATUS_ACAO.pendente;
  const P = PRIORIDADE[a.prioridade] || PRIORIDADE.baixa;
  const d = diasPrazo(a);
  const t = temaPorId(a.tema_id);
  const podeM = podeEscrever();
  return `<div class="ct" style="margin-bottom:10px"><div class="ct-in">
    <div class="ct-meta">
      <span class="et ${S.c}"><span class="pt"></span>${S.t}</span>
      <span class="et ${P.c}" style="opacity:.9"><span class="pt"></span>Prioridade ${P.t}</span>
      <span>${esc(a.area || 'área não definida')}</span>
      ${a.responsavel?`<span class="sep"></span><span>${esc(a.responsavel)}</span>`:''}
    </div>
    <h3 style="margin-top:7px;font-size:14px">${esc(a.texto)}</h3>
    <div class="ct-meta" style="margin-top:7px">
      ${a.prazo?`<span class="pz ${d!==null&&d<7?'urg':''}">
        <svg class="ic ic-p"><use href="#k-relogio"/></svg>${esc(a.prazo)}
        ${d===null?'':d<0?` · ${Math.abs(d)} dia${Math.abs(d)===1?'':'s'} em atraso`
          :d===0?' · vence hoje':` · faltam ${d} dia${d===1?'':'s'}`}</span>`
        :`<span class="num" style="color:var(--t-3)">sem prazo apurado na fonte</span>`}
    </div>
    ${a.obs?`<div class="motivo" style="margin-top:10px"><b>Observação:</b> ${esc(a.obs)}</div>`:''}
    ${a.concluida_em?`<div class="motivo" style="margin-top:10px">
      <b>Concluída</b> por ${esc(a.concluida_por)} em
      ${new Date(a.concluida_em).toLocaleString('pt-BR')}.</div>`:''}
    ${t?`<div style="margin-top:10px">
      <button class="cli-b" onclick="ir('tema:${escId(t.id)}')">Origem: ${esc(t.titulo)}</button></div>`:''}
    <div class="bts" style="margin-top:12px">
      ${a.status!=='concluida'
        ? `<button class="bt pr" ${podeM?'':'disabled'} onclick="mudarStatus('${escId(a.id)}','concluida')">Concluir</button>
           ${a.status==='pendente'?`<button class="bt sc" ${podeM?'':'disabled'}
             onclick="mudarStatus('${escId(a.id)}','andamento')">Iniciar</button>`:''}`
        : `<button class="bt sc" ${podeM?'':'disabled'} onclick="mudarStatus('${escId(a.id)}','pendente')">Reabrir</button>`}
      <button class="bt sc" ${podeM?'':'disabled'} onclick="anotarAcao('${escId(a.id)}')">Observação</button>
      <button class="bt sc" ${podeM?'':'disabled'} onclick="mudarPrazoAcao('${escId(a.id)}')">Prazo</button>
      <button class="bt sc" ${podeM?'':'disabled'} onclick="mudarResponsavel('${escId(a.id)}')">Responsável</button>
    </div>
  </div></div>`;
}

let filtroAcao = 'abertas';
function setFiltroAcao(f){ filtroAcao=f; render(); }

function vAcoes(){
  if(!USUARIO.autenticado && !ACOES.length)
    return `<div class="cab"><h1>Ações</h1></div>` +
      tela('semSessao','Entre para ver suas ações',
        'Sem sessão, o Sentinel não sabe qual é a sua área nem quais ações são suas.',
        ['Entrar','abrirEntrar()']);

  const grupos = {
    atrasadas: atrasadas(), hoje: paraHoje(), proximas: proximas(),
    concluidas: ACOES.filter(a=>a.status==='concluida'),
    criticas:  ACOES.filter(a=>a.prioridade==='alta' && a.status!=='concluida'),
    andamento: ACOES.filter(a=>a.status==='andamento'),
    minhas: ACOES.filter(a=>USUARIO.area &&
      (a.area||'').toLowerCase().includes(USUARIO.area.slice(0,3).toLowerCase()))
  };
  const lista = filtroAcao==='abertas' ? abertas()
              : filtroAcao==='atrasadas' ? grupos.atrasadas
              : filtroAcao==='hoje' ? grupos.hoje
              : filtroAcao==='criticas' ? grupos.criticas
              : filtroAcao==='andamento' ? grupos.andamento
              : filtroAcao==='concluidas' ? grupos.concluidas
              : filtroAcao==='minhas' ? grupos.minhas
              : ACOES;

  return `${avisoOrigem()}${avisoEscopo()}
  <div class="cab"><h1>Minhas ações</h1>
    <p>${abertas().length} em aberto · ${grupos.atrasadas.length} em atraso ·
       ${grupos.concluidas.length} concluída${grupos.concluidas.length===1?'':'s'}.
       Toda ação mantém vínculo com a novidade que a originou.</p></div>

  <div class="nums">
    <button class="nm vm" onclick="setFiltroAcao('atrasadas')"><div class="v">${grupos.atrasadas.length}</div>
      <div class="r"><span class="pt"></span>🔴 Atrasadas</div></button>
    <button class="nm am" onclick="setFiltroAcao('hoje')"><div class="v">${grupos.hoje.length}</div>
      <div class="r"><span class="pt"></span>🟠 Vencem hoje</div></button>
    <button class="nm nt" onclick="setFiltroAcao('abertas')"><div class="v">${abertas().length}</div>
      <div class="r"><span class="pt"></span>🔵 Em aberto</div></button>
    <button class="nm vd" onclick="setFiltroAcao('concluidas')"><div class="v">${grupos.concluidas.length}</div>
      <div class="r"><span class="pt"></span>🟢 Concluídas</div></button>
  </div>

  <div class="atalhos">
    ${[['abertas','Em aberto',abertas().length],['atrasadas','Atrasadas',grupos.atrasadas.length],
       ['hoje','Hoje',grupos.hoje.length],['proximas','Próximas',grupos.proximas.length],
       ['criticas','Críticas',grupos.criticas.length],['andamento','Em andamento',grupos.andamento.length],
       ['concluidas','Concluídas',grupos.concluidas.length]]
      .concat(USUARIO.area?[['minhas','Minha área',grupos.minhas.length]]:[])
      .concat([['todas','Todas',ACOES.length]])
      .map(([k,t,n])=>`<button class="at ${filtroAcao===k?'on':''}"
        onclick="setFiltroAcao('${k}')">${t}<b>${n}</b></button>`).join('')}
  </div>

  ${!podeEscrever()?`<div class="aviso-origem">
    <svg class="ic i"><use href="#k-escudo"/></svg>
    <span class="t"><b>Somente leitura.</b> ${USUARIO.autenticado
      ? 'Seu perfil não permite concluir, reabrir ou alterar ações.'
      : 'Entre com sua conta da Realtec para concluir e anotar ações.'}</span>
    ${USUARIO.autenticado?'':'<button class="l" onclick="abrirEntrar()">Entrar</button>'}</div>`:''}

  <section class="sec">
    <div class="sec-h"><h2>${filtroAcao==='minhas'?'Ações da minha área':'Ações'}</h2>
      <span class="c">${lista.length}</span></div>
    ${lista.length ? lista.slice(0, PAGINA.acoes).map(cartaoAcao).join('')
      : tela('vazio','Nenhuma ação neste filtro','Troque o filtro acima para ver as demais.')}
    ${lista.length > PAGINA.acoes ? `<div class="bts">
      <button class="bt sc" onclick="maisPagina('acoes')">
        Mostrar mais ${Math.min(20, lista.length-PAGINA.acoes)} de ${lista.length}</button></div>`:''}
  </section>`;
}

/* Paginação simples — item 21. Listas longas não montam de uma vez. */
const PAGINA = {acoes:20, alertas:20, novidades:12};
function maisPagina(k){ PAGINA[k] += 20; render(); }

/* ─────────────────────────────────────────────────────────────────────
   CAMINHO DE ADEQUAÇÃO (item 8)
   "Atualize o procedimento" não é instrução: é o problema reformulado.
   Aqui a adequação é uma sequência de nove passos com estado próprio,
   para que dê para saber onde a empresa parou — e não apenas que ainda
   não terminou.
   ───────────────────────────────────────────────────────────────────── */
function blocoCaminho(t){
  const pr = progressoCaminho(t.id);
  const pct = Math.round(pr.feitos/pr.total*100);
  const pode = podeEscrever();
  return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
      <span style="flex:1;min-width:140px;height:7px;border-radius:99px;background:var(--sup-2);
        overflow:hidden;display:block">
        <span style="display:block;height:100%;width:${pct}%;border-radius:99px;
          background:var(--${pr.bloq?'vm':pct===100?'vd':'az'})"></span></span>
      <span class="num" style="font-size:12.5px;color:var(--t-2)">${pr.feitos} de ${pr.total}
        ${pr.bloq?` · ${pr.bloq} bloqueada${pr.bloq===1?'':'s'}`:''}</span>
    </div>
    ${ETAPAS.map(p=>{
      const e = etapaDe(t.id, p.n);
      const S = ETAPA_ST[e.status] || ETAPA_ST.nao_iniciada;
      const feito = e.status==='concluida';
      return `<div class="lin ${feito?'sim':'nao'}" style="align-items:flex-start;
        ${e.status==='andamento'?'background:var(--az-bg);border-radius:var(--r-p)':''}
        ${e.status==='bloqueada'?'background:var(--vm-bg);border-radius:var(--r-p)':''}">
        <span class="bl-n" style="flex:none;${feito?'background:var(--vd);color:#fff':''}">${String(p.n).padStart(2,'0')}</span>
        <span style="flex:1">
          <b style="display:block;font-size:13px;${feito?'color:var(--t-3);text-decoration:line-through':''}">
            <span style="color:var(--${S.c})">${S.s}</span> ${esc(p.t)}
            <span style="font-weight:400;color:var(--${S.c});font-size:11.5px"> · ${S.t}</span></b>
          <span style="display:block;font-size:12.3px;color:var(--t-2);line-height:1.5;margin-top:2px">${esc(p.d)}</span>
          <span style="display:block;font-size:11.5px;color:var(--t-3);margin-top:3px">
            Sugerido: ${esc(p.a)}${e.em?` · concluída por ${esc(e.quem)} em ${new Date(e.em).toLocaleDateString('pt-BR')}`:''}</span>
          ${e.obs?`<span style="display:block;font-size:11.8px;color:var(--vm);margin-top:4px">
            Bloqueio: ${esc(e.obs)}</span>`:''}
          ${p.n===7?`<span style="display:block;font-size:11.5px;color:var(--t-3);margin-top:4px">
            ${evidenciasDe(t.id).length} evidência${evidenciasDe(t.id).length===1?'':'s'} registrada${evidenciasDe(t.id).length===1?'':'s'}
            — esta etapa só fecha com pelo menos uma.</span>`:''}
          <span style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">
            ${!feito?`<button class="cli-b" ${pode?'':'disabled'}
              onclick="passoCaminho('${escId(t.id)}',${p.n},'concluida')">Concluir</button>`:''}
            ${!feito && e.status!=='andamento'?`<button class="cli-b" ${pode?'':'disabled'}
              onclick="passoCaminho('${escId(t.id)}',${p.n},'andamento')">Iniciar</button>`:''}
            ${!feito && e.status!=='bloqueada'?`<button class="cli-b" ${pode?'':'disabled'}
              onclick="passoCaminho('${escId(t.id)}',${p.n},'bloqueada')">Bloquear</button>`:''}
            ${feito?`<button class="cli-b" ${pode?'':'disabled'}
              onclick="passoCaminho('${escId(t.id)}',${p.n},'nao_iniciada')">Reabrir</button>`:''}
            ${p.n===7?`<button class="cli-b" ${pode?'':'disabled'}
              onclick="addEvidencia('${escId(t.id)}',7)">Registrar evidência</button>`:''}
          </span>
        </span></div>`;
    }).join('')}
    <p style="font-size:11.5px;color:var(--t-3);margin-top:12px;line-height:1.6">
      Esta sequência é o roteiro padrão de adequação da Realtec, não exigência da norma.
      Etapa que não se aplica deve ser marcada como bloqueada com o motivo, não concluída em branco.</p>`;
}

/* ─────────────────────────────────────────────────────────────────────
   CENTRAL DE ALERTAS (item 16)
   Só entra aqui o que tem relevância. Alerta que dispara por tudo vira
   ruído e some da atenção — que é exatamente o problema que o Sentinel
   existe para resolver.
   ───────────────────────────────────────────────────────────────────── */
let ALERTAS = STORE.ler('alertas_v1', []) || [];
const gravarAlertas = () => STORE.gravar('alertas_v1', ALERTAS);

function criarAlerta(nivel, tema, texto){
  if(ALERTAS.some(a=>a.tema===tema.id && a.texto===texto)) return false;
  ALERTAS = [{id:'al'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    nivel, tema: tema.id, titulo: tema.titulo, area: tema.area,
    texto, em: new Date().toISOString(), lido: false}, ...ALERTAS].slice(0,200);
  gravarAlertas();
  return true;
}
function lerAlerta(id){
  const a = ALERTAS.find(x=>x.id===id); if(!a) return;
  a.lido = true; gravarAlertas(); render();
}
function lerTodosAlertas(){
  ALERTAS.forEach(a=>a.lido=true); gravarAlertas();
  registrar('alertas_lidos', {n: ALERTAS.length}); render();
}
const naoLidos = () => ALERTAS.filter(a=>!a.lido).length;

let filtroAlerta = 'todos';
function setFiltroAlerta(f){ filtroAlerta=f; render(); }

function vCentralAlertas(){
  const areas = [...new Set(ALERTAS.map(a=>a.area).filter(Boolean))];
  const lista = filtroAlerta==='todos' ? ALERTAS
              : filtroAlerta==='naolidos' ? ALERTAS.filter(a=>!a.lido)
              : ALERTAS.filter(a=>a.area===filtroAlerta);
  const N = {crit:['vm','🔴 Crítico'], alto:['am','🟠 Alto'],
             moderado:['nt','🟡 Médio'], info:['nt','🔵 Informativo']};

  return `${avisoOrigem()}
  <div class="cab"><h1>Central de alertas</h1>
    <p>${ALERTAS.length} alerta${ALERTAS.length===1?'':'s'} · ${naoLidos()} não lido${naoLidos()===1?'':'s'}.
       Só entra aqui o que tem relevância: alerta por tudo é o mesmo que alerta por nada.</p></div>

  <div class="atalhos">
    <button class="at ${filtroAlerta==='todos'?'on':''}" onclick="setFiltroAlerta('todos')">
      Todos<b>${ALERTAS.length}</b></button>
    <button class="at ${filtroAlerta==='naolidos'?'on':''}" onclick="setFiltroAlerta('naolidos')">
      Não lidos<b>${naoLidos()}</b></button>
    ${areas.map(a=>`<button class="at ${filtroAlerta===a?'on':''}" onclick="setFiltroAlerta('${escId(a)}')">
      ${esc(a)}<b>${ALERTAS.filter(x=>x.area===a).length}</b></button>`).join('')}
  </div>

  ${naoLidos()?`<div class="bts" style="margin-bottom:14px">
    <button class="bt sc" onclick="lerTodosAlertas()">Marcar todos como lidos</button></div>`:''}

  ${lista.length ? `<div class="lista">${lista.slice(0,PAGINA.alertas).map(a=>{
    const n = N[a.nivel] || N.info;
    return `<div class="li" style="align-items:flex-start;${a.lido?'opacity:.62':''}">
      <span class="et ${n[0]}" style="flex:none;margin-top:1px;font-size:11px">
        <span class="pt"></span>${n[1]}</span>
      <span class="li-t"><b>${esc(a.titulo)}</b>
        <s>${esc(a.texto)}<br>${new Date(a.em).toLocaleString('pt-BR')} · ${esc(a.area||'—')}</s></span>
      <span style="display:flex;gap:6px;flex:none;flex-wrap:wrap">
        <button class="cli-b" onclick="ir('tema:${escId(a.tema)}')">Abrir</button>
        <button class="cli-b" onclick="ir('acoes')">Ações</button>
        ${a.lido?'':`<button class="cli-b" onclick="lerAlerta('${escId(a.id)}')">Marcar lido</button>`}
      </span></div>`;
  }).join('')}</div>
  ${lista.length>PAGINA.alertas?`<div class="bts"><button class="bt sc" onclick="maisPagina('alertas')">
    Mostrar mais</button></div>`:''}`
  : tela('vazio','Nenhum alerta neste filtro',
      podeAfirmarSemAlteracao()
        ? 'A varredura rodou e não gerou alerta com este recorte.'
        : 'A varredura não foi confirmada — a ausência de alertas aqui não prova ausência de publicação.')}`;
}

/* ─────────────────────────────────────────────────────────────────────
   RESUMO EXECUTIVO (item 5)
   Gerado dos dados reais, em frases. Se a varredura não confirmou, o
   resumo começa dizendo isso — antes de qualquer número.
   ───────────────────────────────────────────────────────────────────── */
function resumoExecutivo(){
  const ac = exigemAcao(), mv = movidosHoje();
  const at = atrasadas(), pr = abertas().filter(a=>{const d=diasPrazo(a); return d!==null && d>=0 && d<=2;});
  const areas = [...new Set(ativos().map(t=>t.area))];
  const f = [];
  const val = aguardandoValidacao().length;

  if(!podeAfirmarSemAlteracao())
    f.push(`A varredura de hoje não foi confirmada${COLETA_ERRO?` (${COLETA_ERRO})`:''}. Os números abaixo refletem o último estado conhecido, não o de hoje.`);

  f.push(mv.length
    ? `${mv.length} tema${mv.length===1?'':'s'} ${mv.length===1?'recebeu':'receberam'} movimentação nesta varredura.`
    : podeAfirmarSemAlteracao()
      ? 'Nenhum tema recebeu movimentação nesta varredura.'
      : 'Não é possível afirmar se houve movimentação hoje.');

  if(ac.length){
    const porArea = {};
    ac.forEach(t=>{ porArea[t.area] = (porArea[t.area]||0)+1; });
    f.push(Object.entries(porArea)
      .map(([a,n])=>`${n} exige${n===1?'':'m'} ação d${a==='SST'?'a':'o'} ${a}`)
      .join(', ') + '.');
  }else{
    f.push('Nenhum tema exige providência imediata.');
  }

  f.push(at.length
    ? `${at.length} aç${at.length===1?'ão':'ões'} está${at.length===1?'':'ão'} em atraso.`
    : 'Nenhuma ação em atraso.');

  f.push(pr.length
    ? `${pr.length} prazo${pr.length===1?'':'s'} vence${pr.length===1?'':'m'} nas próximas 48 horas.`
    : 'Nenhum prazo vence nas próximas 48 horas.');

  f.push(val
    ? `${val} análise${val===1?'':'s'} aguarda${val===1?'':'m'} validação humana antes de fundamentar decisão.`
    : 'Nenhuma análise aguarda validação.');

  return {frases: f, areas: areas.length};
}

}
function acoesDaArea(area){
  if(!area) return [];
  const k = area.slice(0,3).toLowerCase();
  return ACOES.filter(a=>(a.area||'').toLowerCase().includes(k));
}
