/* ─────────────────────────────────────────────────────────────────────
   VISÃO DA DIRETORIA (item 11)
   A Diretoria não lê norma. Precisa saber onde está exposta, o que
   está parado e o que vence. Nada aqui é digitado: todo número sai do
   cruzamento de temas, ações e estado da coleta.
   ───────────────────────────────────────────────────────────────────── */
function exposicao(){
  const crits = ativos().filter(t=>t.nivel==='crit').length;
  const atr = atrasadas().length;
  const fontesRuins = FONTES_DET.filter(f=>f.estado==='erro').length;
  if(!podeAfirmarSemAlteracao())
    return {c:'nt', t:'Não determinada', d:'A varredura não foi confirmada. Sem isso, qualquer nota de exposição seria chute.'};
  if(crits && atr)  return {c:'vm', t:'Alta', d:`${crits} tema${crits===1?'':'s'} crítico${crits===1?'':'s'} com ${atr} aç${atr===1?'ão':'ões'} em atraso.`};
  if(crits)         return {c:'am', t:'Moderada', d:`${crits} tema${crits===1?'':'s'} crítico${crits===1?'':'s'} em aberto, sem ação em atraso.`};
  if(atr||fontesRuins) return {c:'am', t:'Atenção', d:`${atr} ação em atraso · ${fontesRuins} fonte com erro.`};
  return {c:'vd', t:'Sob controle', d:'Nenhum tema crítico e nenhuma ação em atraso.'};
}

/* ═══════════════════════════════════════════════════════════════════════
   ▓▓ ADEQUAÇÃO: DA NORMA À EVIDÊNCIA ▓▓
   Norma → impacto → ação → responsável → prazo → evidência → validação →
   conclusão. Cada seta desta cadeia é um registro, não uma promessa de
   tela: sem isso, "adequado" é só alguém que clicou em Concluir.
   ═══════════════════════════════════════════════════════════════════════ */

/* ─── ETAPAS DO CAMINHO (item 4) ─────────────────────────────────────
   Oito etapas, quatro estados. "Bloqueada" existe porque adequação que
   parou por dependência externa não é a mesma coisa que adequação que
   ninguém começou — e a diretoria precisa distinguir as duas.        */
const ETAPA_ST = {
  nao_iniciada: {s:'○', c:'t-3', t:'Não iniciada'},
  andamento:    {s:'◐', c:'az',  t:'Em andamento'},
  concluida:    {s:'✓', c:'vd',  t:'Concluída'},
  bloqueada:    {s:'⚠', c:'vm',  t:'Bloqueada'}
};

const ETAPAS = [
 {n:1, t:'Analisar',              a:'Área responsável',
  d:'Entender o que mudou e onde a regra encosta na operação da Realtec.'},
 {n:2, t:'Validar',               a:'Jurídico',
  d:'Confirmar interpretação e alcance antes de mover procedimento.'},
 {n:3, t:'Definir responsáveis',  a:'Gestor da área',
  d:'Nome, não departamento. Adequação sem dono não avança.'},
 {n:4, t:'Atualizar documentos',  a:'Área responsável',
  d:'PGR, PCMSO, procedimento, formulário, contrato — o que a mudança alcançar.'},
 {n:5, t:'Implementar',           a:'Área responsável',
  d:'Colocar em uso nas frentes de obra e na rotina, não apenas na sede.'},
 {n:6, t:'Treinar',               a:'RH · área responsável',
  d:'Quem executa precisa saber o que mudou antes de a regra valer na prática.'},
 {n:7, t:'Registrar evidência',   a:'Área responsável',
  d:'Ata, lista de presença, versão do documento, print do sistema. É o que se mostra em fiscalização.'},
 {n:8, t:'Validar conclusão',     a:'Jurídico · SST · gestor',
  d:'Conferir na operação se a mudança pegou. Documento novo com prática antiga é o pior cenário.'}
];

let CAMINHOS = STORE.ler('caminhos_v2', {}) || {};

function caminhoDe(temaId){
  if(!CAMINHOS[temaId])
    CAMINHOS[temaId] = ETAPAS.map(p=>({n:p.n, status:'nao_iniciada', quem:null, em:null, obs:''}));
  return CAMINHOS[temaId];
}
function etapaDe(temaId, n){ return caminhoDe(temaId).find(x=>x.n===n) || {status:'nao_iniciada'}; }

function passoCaminho(temaId, n, novo){
  if(!podeEscrever()) return avisar('Seu perfil não permite alterar o caminho de adequação.');
  const p = caminhoDe(temaId).find(x=>x.n===n); if(!p) return;
  /* Etapa 7 é evidência: concluir sem registrar nada é o buraco que este
     bloco existe para fechar. */
  if(n === 7 && novo === 'concluida' && !(EVIDENCIAS[temaId]||[]).length)
    return avisar('Registre ao menos uma evidência antes de concluir esta etapa.');
  p.status = novo;
  p.quem = novo==='concluida' ? (USUARIO.autenticado?USUARIO.nome:'sessão anônima') : null;
  p.em   = novo==='concluida' ? new Date().toISOString() : null;
  if(novo === 'bloqueada'){
    const m = prompt('O que está bloqueando esta etapa?', p.obs || '');
    if(m === null) return;
    p.obs = m.slice(0,300);
  }
  STORE.gravar('caminhos_v2', CAMINHOS);
  registrar('adequacao_etapa', {tema:temaId, etapa:n, status:novo});
  persistir('adequacao', {tema_id:temaId, passo:n, status:p.status,
    em:p.em, observacao:p.obs || null, quem_nome:p.quem}, true);
  render();
}
function progressoCaminho(temaId){
  const c = caminhoDe(temaId);
  return {feitos:c.filter(p=>p.status==='concluida').length,
          bloq:  c.filter(p=>p.status==='bloqueada').length,
          total: c.length};
}

/* ─── EVIDÊNCIAS (item 15) ───────────────────────────────────────── */
let EVIDENCIAS = STORE.ler('evidencias', {}) || {};

function addEvidencia(temaId, etapa){
  if(!podeEscrever()) return avisar('Seu perfil não permite registrar evidências.');
  const tipo = prompt('Tipo de evidência: documento, observação, link ou registro interno', 'documento');
  if(tipo === null) return;
  const texto = prompt('Descreva a evidência (o que é, onde está, quem guarda):', '');
  if(texto === null || !texto.trim()) return;
  const link = prompt('Link ou referência interna (opcional):', '');
  if(link === null) return;
  (EVIDENCIAS[temaId] = EVIDENCIAS[temaId] || []).unshift({
    id:'ev'+Date.now().toString(36), tipo:(tipo||'registro').slice(0,40),
    texto:texto.trim().slice(0,400), link:(link||'').trim().slice(0,300),
    etapa: etapa || null,
    quem: USUARIO.autenticado ? USUARIO.nome : 'sessão anônima',
    em: new Date().toISOString()
  });
  STORE.gravar('evidencias', EVIDENCIAS);
  registrar('evidencia', {tema:temaId, etapa: etapa||null, tipo});
  const ev = EVIDENCIAS[temaId][0];
  persistir('evidencia', {tema_id:temaId, etapa:ev.etapa, tipo:ev.tipo,
    texto:ev.texto, link:ev.link || null, quem_nome:ev.quem, em:ev.em});
  render();
}
const evidenciasDe = id => EVIDENCIAS[id] || [];

function blocoEvidencias(t){
  const evs = evidenciasDe(t.id);
  return `
    ${evs.length ? `<div class="lista">${evs.map(e=>`<div class="li" style="align-items:flex-start">
      <svg class="ic ic-p" style="color:var(--vd);flex:none;margin-top:2px"><use href="#k-doc"/></svg>
      <span class="li-t"><b>${esc(e.texto)}</b>
        <s>${esc(e.tipo)}${e.etapa?` · etapa ${e.etapa}`:''} · ${esc(e.quem)} ·
           ${new Date(e.em).toLocaleString('pt-BR')}${e.link?` · ${esc(e.link)}`:''}</s></span>
    </div>`).join('')}</div>`
    : `<p>Nenhuma evidência registrada. Uma adequação sem evidência não é conferível em
       fiscalização nem em auditoria de cliente — o clique em "Concluir" não é prova.</p>`}
    <div class="bts"><button class="bt sc" ${podeEscrever()?'':'disabled'}
      onclick="addEvidencia('${escId(t.id)}')">Registrar evidência</button></div>`;
}

/* ─── VALIDAÇÃO HUMANA (item 16) ─────────────────────────────────────
   A IA não é autoridade jurídica. Análise relevante circula pela área
   competente antes de virar decisão, e o parecer fica registrado com
   nome e data. */
let VALIDACOES = STORE.ler('validacoes', {}) || {};
const VAL_ST = {
  nao_enviada: {c:'t-3', t:'Não enviada para validação'},
  aguardando:  {c:'am',  t:'Aguardando validação'},
  aprovada:    {c:'vd',  t:'Aprovada'},
  rejeitada:   {c:'vm',  t:'Rejeitada'},
  revisao:     {c:'am',  t:'Revisão solicitada'}
};
const validacaoDe = id => VALIDACOES[id] || {status:'nao_enviada'};
const aguardandoValidacao = () => ativos().filter(t=>validacaoDe(t.id).status==='aguardando');

function enviarValidacao(temaId){
  if(!podeEscrever()) return avisar('Seu perfil não permite enviar análises para validação.');
  const area = prompt('Enviar para qual área validar?', 'Jurídico');
  if(area === null) return;
  VALIDACOES[temaId] = {status:'aguardando', para:area.trim()||'Jurídico',
    enviado_por: USUARIO.autenticado?USUARIO.nome:'sessão anônima',
    enviado_em: new Date().toISOString()};
  STORE.gravar('validacoes', VALIDACOES);
  registrar('validacao_enviada', {tema:temaId, para:area});
  persistir('validacao', Object.assign({tema_id:temaId}, VALIDACOES[temaId]), true);
  criarAlerta('alto', temaPorId(temaId) || {id:temaId,titulo:temaId,area:area},
    `Análise enviada para validação de ${area}.`);
  render();
}
function decidirValidacao(temaId, decisao){
  if(!podeEscrever()) return avisar('Seu perfil não permite validar análises.');
  const obs = prompt(decisao==='aprovada' ? 'Observação da aprovação (opcional):'
                   : 'Motivo — obrigatório para rejeição ou pedido de revisão:', '');
  if(obs === null) return;
  if(decisao !== 'aprovada' && !obs.trim())
    return avisar('Rejeitar ou pedir revisão sem motivo registrado não serve como parecer.');
  VALIDACOES[temaId] = Object.assign(validacaoDe(temaId), {
    status: decisao, obs: obs.trim().slice(0,500),
    por: USUARIO.autenticado?USUARIO.nome:'sessão anônima',
    em: new Date().toISOString()});
  STORE.gravar('validacoes', VALIDACOES);
  registrar('validacao_decidida', {tema:temaId, decisao});
  persistir('validacao', Object.assign({tema_id:temaId}, VALIDACOES[temaId]), true);
  render();
}

function blocoValidacao(t){

/* ─── CRIAR PLANO DE ADEQUAÇÃO (item 3) ──────────────────────────────
   Transforma a novidade em plano: uma ação por área efetivamente
   afetada, com prioridade herdada do risco e prazo herdado da fonte.
   O responsável nominal continua sendo escolha humana — o sistema
   sugere a área, não a pessoa. */
function criarPlano(temaId){
  if(!podeEscrever()) return avisar('Seu perfil não permite criar planos de adequação.');
  const t = temaPorId(temaId); if(!t) return;
  const m = t.alteracao ? MUDANCAS.find(x=>x.id===t.alteracao) : null;
  const afetadas = (m && m.seis ? m.seis.afetados.filter(a=>a.sim) : [])
                   .map(a=>({area:a.a, motivo:a.s}));
  if(!afetadas.length && t.area) afetadas.push({area:t.area, motivo:t.o_que_fazer_agora||''});
  if(!afetadas.length)
    return avisar('Nenhuma área afetada foi identificada na análise. ' + INCONCLUSIVO);

  const prio = t.nivel==='crit' ? 'alta' : t.nivel==='alto' ? 'media' : 'baixa';
  const prazo = /\d{2}\/\d{2}\/\d{4}/.test(t.prazo||'') ? t.prazo : null;
  let novas = 0;
  afetadas.forEach((a,i)=>{
    const id = `${temaId}-plano-${escId(a.area)}-${i}`;
    if(ACOES.some(x=>x.id===id)) return;
    ACOES.push({id, tema_id:temaId, alteracao:t.alteracao,
      texto: a.motivo || `Revisar procedimento de ${a.area} diante da alteração.`,
      area: a.area, responsavel:null, prazo, prioridade:prio,
      status:'pendente', obs:'', concluida_em:null, concluida_por:null, origem:'plano'});
    novas++;
  });
  caminhoDe(temaId);
  const e1 = caminhoDe(temaId).find(x=>x.n===1);
  if(e1.status==='nao_iniciada'){ e1.status='andamento'; STORE.gravar('caminhos_v2', CAMINHOS); }
  gravarAcoes();
  registrar('plano_criado', {tema:temaId, acoes:novas, areas:afetadas.map(a=>a.area)});
  avisar(novas ? `Plano criado: ${novas} aç${novas===1?'ão':'ões'} em ${afetadas.length} área${afetadas.length===1?'':'s'}.`
               : 'O plano deste tema já havia sido criado.');
  ir('tema:'+temaId);
}
const temPlano = id => ACOES.some(a=>a.tema_id===id && a.origem==='plano');

/* ─── "O QUE PRECISO FAZER HOJE?" (item 2) ───────────────────────────
   Uma tela que junta o que exige providência de fontes diferentes:
   ação atrasada, ação de hoje, prazo próximo, análise aguardando
   validação e tema crítico. É a resposta única à pergunta que a pessoa
   faz ao abrir o sistema. */
function itensDeHoje(){
  const its = [];
  const push = (urg, tipo, o) => its.push(Object.assign({urg, tipo}, o));

  atrasadas().forEach(a=>push(0,'acao',{
    rot:'Ação em atraso', acao:a, area:a.area,
    risco:`Vencida há ${Math.abs(diasPrazo(a))} dia${Math.abs(diasPrazo(a))===1?'':'s'}`}));
  paraHoje().forEach(a=>push(1,'acao',{rot:'Vence hoje', acao:a, area:a.area, risco:'Prazo vence hoje'}));
  abertas().filter(a=>{const d=diasPrazo(a); return d!==null && d>0 && d<=7;})
    .forEach(a=>push(2,'acao',{rot:'Vence esta semana', acao:a, area:a.area,
      risco:`Faltam ${diasPrazo(a)} dias`}));
  aguardandoValidacao().forEach(t=>push(3,'validacao',{
    rot:'Aguardando validação', tema:t, area:validacaoDe(t.id).para || t.area,
    risco:'Análise não pode fundamentar decisão antes da validação'}));
  ativos().filter(t=>t.nivel==='crit' && !temPlano(t.id)).forEach(t=>push(4,'tema',{
    rot:'Crítico sem plano de adequação', tema:t, area:t.area,
    risco:nivelDe('crit').d}));

  return its.sort((a,b)=>a.urg-b.urg);
}

/* ─── IA CONTEXTUAL (item 9) ─────────────────────────────────────────
   A IA passa a saber o que está aberto na tela. Sem isso, "qual o
   prazo?" é uma pergunta sem sujeito, e a resposta vira genérica. */
let CTX_IA = {tipo:'geral', id:null, titulo:null};

function contextoAtual(){
  if(rota === 'tema' && temaPorId(alvo)){
    const t = temaPorId(alvo);
    return {tipo:'tema', id:t.id, titulo:t.titulo};
  }
  if(rota === 'det'){
    const m = MUDANCAS.find(x=>x.id===alvo);
    if(m){ const t = temaDaAlteracao(m.id);
           return {tipo:'novidade', id:m.id, titulo:m.titulo, tema:t?t.id:null}; }
  }
  if(rota === 'area') return {tipo:'area', id:areaVista||USUARIO.area, titulo:areaVista||USUARIO.area};
  return {tipo:'geral', id:null, titulo:null};
}

const SUG_CTX = [
  ['Isso afeta o RH?','afeta:RH'], ['Isso afeta o DP?','afeta:Departamento Pessoal'],
  ['Qual o risco?','ctx:risco'], ['Qual o prazo?','ctx:prazo'],
  ['O que precisamos fazer?','ctx:fazer'], ['Quem deve agir?','ctx:quem'],
  ['Monte o caminho de adequação.','ctx:caminho'],
  ['Quais documentos podem precisar de revisão?','ctx:docs'],
  ['Essa mudança já foi tratada?','ctx:tratada']
];

/* Respostas calculadas do estado real. Quando o dado não existe, a
   resposta é que ele não existe — não uma dedução plausível. */
function respostaCtx(chave){
  const c = CTX_IA;
  const t = c.tipo==='tema' ? temaPorId(c.id)
          : c.tipo==='novidade' ? temaDaAlteracao(c.id) : null;
  const m = c.tipo==='novidade' ? MUDANCAS.find(x=>x.id===c.id)
          : (t && t.alteracao) ? MUDANCAS.find(x=>x.id===t.alteracao) : null;

  if(chave.startsWith('afeta:')){
    const area = chave.slice(6);
    if(!m || !m.seis) return {t:`Impacto em ${area}`,
      x:`Não tenho dados suficientes para concluir isso. Nenhuma análise por área está vinculada ao que está aberto.`};
    const a = m.seis.afetados.find(x=>x.a.toLowerCase().includes(area.slice(0,3).toLowerCase()));
    if(!a) return {t:`Impacto em ${area}`,
      x:`${area} não consta na lista de áreas avaliadas desta análise. ${SEM_FONTE}`};
    return {t:`Impacto em ${area}`,
      x: a.sim ? `Sim. ${a.s}` : `Não. A análise registra: ${a.s}`,
      r: a.sim ? {n:'am', t:'Providência', d: t && t.o_que_fazer_agora ? t.o_que_fazer_agora : SEM_FONTE} : null,
      ir: t?`tema:${t.id}`:null, irT:'Abrir o tema'};
  }

  const R = {
    risco: () => !m || !m.seis ? {t:'Risco', x:`Não tenho dados suficientes para concluir isso.`}
      : {t:'Risco', x: m.seis.risco.d,
         r:{n:m.seis.risco.n, t:m.seis.risco.t, d:`Nível ${nivelDe(m.nivel).t} — ${nivelDe(m.nivel).d}`},
         ir:t?`tema:${t.id}`:null, irT:'Abrir o tema'},
    prazo: () => {
      const p = (t && t.prazo) || (m && m.prazo);
      if(!p || p==='—') return {t:'Prazo', x:`${SEM_FONTE} Nenhuma data de vigência foi apurada na fonte para o que está aberto.`};
      const d = diasAte(p);
      return {t:'Prazo', x:`${p}${d===null?'':d<0?` — venceu há ${Math.abs(d)} dias`:d===0?' — vence hoje':` — faltam ${d} dias`}.`,
        r:{n:d!==null&&d<30?'vm':'am', t:'Origem do prazo', d:'Apurado na fonte oficial, não estimado.'}};
    },
    fazer: () => {
      const acs = t ? acoesDoTema(t.id) : [];
      if(!acs.length) return {t:'O que fazer', x: t && t.o_que_fazer_agora ? t.o_que_fazer_agora
        : 'Não tenho dados suficientes para concluir isso. Nenhuma ação foi gerada para o que está aberto.',
        ir: t?`tema:${t.id}`:null, irT:'Abrir o tema'};
      return {t:'O que fazer', x:`${acs.length} aç${acs.length===1?'ão':'ões'} vinculada${acs.length===1?'':'s'}, ${acs.filter(a=>a.status==='concluida').length} concluída${acs.filter(a=>a.status==='concluida').length===1?'':'s'}.`,
        lista: acs.map(a=>({t:a.texto, r:a.area||'—', p:a.prazo||'—'})),
        ir:'acoes', irT:'Abrir central de ações'};
    },
    quem: () => {
      if(!m || !m.seis) return {t:'Quem deve agir', x:'Não tenho dados suficientes para concluir isso.'};
      const s = m.seis.afetados.filter(a=>a.sim);
      return {t:'Quem deve agir', x:`${s.length} área${s.length===1?'':'s'}: ${s.map(a=>a.a).join(', ')}. ` +
        `A área é sugestão da análise; o responsável nominal é definido pelo gestor na etapa 3 do caminho de adequação.`,
        r:{n:'am', t:'Atribuição', d:'O sistema sugere área, nunca pessoa.'}};
    },
    caminho: () => {
      if(!t) return {t:'Caminho de adequação', x:'Não tenho dados suficientes: o que está aberto não está vinculado a um tema.'};
      const p = progressoCaminho(t.id);
      return {t:'Caminho de adequação', x:`${p.feitos} de ${p.total} etapas concluídas${p.bloq?`, ${p.bloq} bloqueada${p.bloq===1?'':'s'}`:''}. ` +
        ETAPAS.map(e=>`${e.n} ${e.t}: ${ETAPA_ST[etapaDe(t.id,e.n).status].t}`).join(' · ') + '.',
        ir:`tema:${t.id}`, irT:'Abrir o caminho'};
    },
    docs: () => {
      if(!m || !m.seis) return {t:'Documentos', x:'Não tenho dados suficientes para concluir isso.'};
      return {t:'Documentos que podem precisar de revisão',
        x: m.seis.fazer.map(f=>f.t).join('; ') + '.',
        r:{n:'am', t:'Verificação obrigatória',
           d:'Esta lista sai da análise da publicação. Confirme na fonte oficial e com a área antes de alterar documento.'}};
    },
    tratada: () => {
      if(!t) return {t:'Já foi tratada?', x:'Não tenho dados suficientes: o que está aberto não está vinculado a um tema.'};
      const acs = acoesDoTema(t.id), p = progressoCaminho(t.id), v = validacaoDe(t.id);
      const feitas = acs.filter(a=>a.status==='concluida').length;
      return {t:'Já foi tratada?',
        x:`Adequação: ${p.feitos} de ${p.total} etapas. Ações: ${feitas} de ${acs.length} concluídas. ` +
          `Validação: ${VAL_ST[v.status].t.toLowerCase()}. ` +
          `Evidências registradas: ${evidenciasDe(t.id).length}.`,
        r:{n: p.feitos===p.total && evidenciasDe(t.id).length ? 'vd' : 'am',
           t: p.feitos===p.total ? 'Caminho concluído' : 'Adequação em curso',
           d: evidenciasDe(t.id).length ? 'Há evidência registrada.'
             : 'Sem evidência registrada — a conclusão não é conferível em auditoria.'},
        ir:`tema:${t.id}`, irT:'Abrir o tema'};
    }
  };
  const f = R[chave.replace('ctx:','')];
  return f ? f() : {t:'Consulta', x:'Não tenho dados suficientes para concluir isso.'};
}

/* ═══════════════════════════════════════════════════════════════════════
   ▓▓ PERSISTÊNCIA COMPARTILHADA ▓▓

   🔴 Defeito que este módulo corrige (encontrado na auditoria final):
   ações concluídas, etapas de adequação, evidências, validações e
   arquivamentos viviam só no localStorage. Ana concluía a ação e Bruno,
   na máquina ao lado, via a ação em aberto. Pior: a tela de Logs dizia
   "Cadeia íntegra · gravada no servidor" — afirmação falsa.

   Num sistema de conformidade isso é fatal: evidência e parecer jurídico
   só valem como rastreabilidade se forem compartilhados e auditáveis.

   Solução: uma camada com DOIS escopos possíveis e a obrigação de
   declarar qual está em vigor.

     ESCOPO.modo = 'servidor'  → gravado em Postgres, todos veem
     ESCOPO.modo = 'local'     → só neste navegador, e a tela DIZ isso

   O modo não é escolhido por configuração: é DESCOBERTO tentando gravar.
   Enquanto o banco não responder, nada finge estar compartilhado.
   ═══════════════════════════════════════════════════════════════════════ */

let ESCOPO = {modo:'local', motivo:'ainda não verificado', verificado:false};

/* Tabelas que precisam ser compartilhadas para o sistema ter valor. */
const TABELAS = {
  acao:      '/rest/v1/acao',
  adequacao: '/rest/v1/adequacao',
  evidencia: '/rest/v1/evidencia',
  validacao: '/rest/v1/validacao',
  descarte:  '/rest/v1/descarte',
  log:       '/rest/v1/log'
};

/* Descobre o escopo de verdade: tenta LER uma tabela compartilhada.
   Leitura, não escrita — verificar não pode sujar o banco. */
async function verificarEscopo(){
  if(!SB.tk()){
    ESCOPO = {modo:'local', motivo:'sem sessão — entre para gravar no servidor', verificado:true};
    return ESCOPO;
  }
  try{
    const r = await SB.chamar(TABELAS.acao + '?select=id&limit=1');
    await r.json();
    ESCOPO = {modo:'servidor', motivo:null, verificado:true};
  }catch(e){
    ESCOPO = {modo:'local', verificado:true, motivo:
      e && e.status === 404 ? 'as tabelas do Sentinel ainda não existem no banco (rode 01_schema.sql)'
      : e && e.permissao   ? 'seu perfil não tem permissão de escrita no banco'
      : e && e.autenticacao? 'a sessão não foi aceita pelo banco'
      : e && e.rede        ? 'servidor inacessível'
      : e && e.status      ? `o banco respondeu ${e.status}`
      : 'não foi possível confirmar a gravação no servidor'};
  }
  return ESCOPO;
}

/* Grava no servidor quando possível. Devolve true só se GRAVOU MESMO —
   nunca otimista. O chamador já atualizou o estado local; esta função
   decide apenas se o dado é compartilhado ou não. */
async function persistir(tabela, registro, chave){
  if(ESCOPO.modo !== 'servidor') return false;
  try{
    await SB.chamar(TABELAS[tabela], {
      method:'POST',
      headers:{'Content-Type':'application/json',
               'Prefer': chave ? 'resolution=merge-duplicates,return=minimal' : 'return=minimal'},
      body: JSON.stringify(registro)});
    return true;
  }catch(e){
    /* Falhou depois de ter funcionado: o escopo cai para local e a tela
       passa a avisar. Silenciar aqui recriaria o defeito original. */
    ESCOPO = {modo:'local', verificado:true,
      motivo:'a gravação no servidor falhou' + (e && e.status ? ` (${e.status})` : '') +
             ' — as alterações desta sessão estão apenas neste navegador'};
    console.warn('[SENTINEL] gravação no servidor falhou; escopo rebaixado para local:', e && e.message);
    render();
    return false;
  }
}

/* Faixa de aviso. Aparece em toda tela onde a pessoa registra decisão —
   ação, evidência, validação, adequação. Não é decorativa: é o que
   impede alguém de tratar registro local como prova compartilhada. */
function avisoEscopo(){
  if(ESCOPO.modo === 'servidor') return '';
  return `<div class="aviso-origem">
    <svg class="ic i"><use href="#k-alerta"/></svg>
    <span class="t"><b>Registro local, não compartilhado.</b>
      ${esc(ESCOPO.motivo || 'o servidor não confirmou a gravação')} —
      conclusões, evidências e validações feitas aqui <b>não aparecem para as outras áreas</b>
      e se perdem ao trocar de navegador. Não valem como trilha de auditoria.</span>
    ${SB.tk()?'':'<button class="l" onclick="abrirEntrar()">Entrar</button>'}</div>`;
}

/* Selo curto para cabeçalhos. */
function seloEscopo(){
  return ESCOPO.modo === 'servidor'
    ? '<span class="et vd"><span class="pt"></span>Compartilhado</span>'
    : '<span class="et am"><span class="pt"></span>Só neste navegador</span>';
}

/* ═══════════════════════════════════════════════════════════════════════
   CARGA DOS TEMAS A PARTIR DO BANCO
   Enquanto radar_temas() não existir ou não responder, TEMAS continua
   sendo a semente — e TEMAS_ORIGEM='semente' faz cada cartão carregar a
   etiqueta correspondente. Substituir semente por dado do banco em
   silêncio é o que faria o sistema parecer atualizado sem estar.
   ═══════════════════════════════════════════════════════════════════════ */
async function carregarTemas(){
  if(!SB.tk()) return;
  try{
    const r = await SB.rpc('radar_temas');
    const lista = Array.isArray(r) ? r : (r && r.temas) || null;
    if(!Array.isArray(lista)) throw new Error('radar_temas() não devolveu lista');
    if(!lista.length){
      console.info('[RADAR] radar_temas() devolveu lista vazia — semente preservada.');
      return;
    }
    TEMAS = lista.map(t=>Object.assign({
      status:'ativo', movimentacoes:[], nivel:'baixo', eixo:'Administrativo',
      area:'Administrativo', prazo:'—', prazo_urg:false
    }, t));
    TEMAS_ORIGEM = 'banco';
    TEMAS_SUGERIDOS = lista.filter(t=>t.sugerido) || TEMAS_SUGERIDOS;
    varrerCriticos();
    render();
  }catch(e){
    console.warn('[RADAR] temas não carregados do banco — semente preservada:',
                 (e && e.message) || e);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   PARTIDA DA EXPANSÃO
   ═══════════════════════════════════════════════════════════════════════ */
/* C19 · Partida.
   A ordem importa: o estado da coleta precisa ser conhecido antes de a
   IA falar sozinha, senão ela comenta um acervo que talvez não exista.
   Nenhuma etapa pode derrubar a seguinte — daí os catch individuais. */
try{ ROTINA.agendar(); }catch(e){ console.error('[CIL] agendador não iniciou', e); }

render();

carregarSessao()
  .catch(e => console.error('[RADAR] falha ao carregar sessão', e))
  .then(() => verificarColeta())
  .catch(e => console.error('[RADAR] falha ao verificar coleta', e))
  .then(() => carregarTemas())
  .catch(e => console.error('[RADAR] falha ao carregar temas', e))
  .then(() => verificarEscopo())
  .catch(e => console.error('[RADAR] falha ao verificar escopo de gravação', e))
  .finally(() => { varrerCriticos(); setTimeout(iaProativa, 2600); });

/* Sessão renovada também quando a aba volta ao primeiro plano: quem deixa
   o sistema aberto o dia inteiro voltava a uma tela com token vencido. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !SB.tk()) return;
  SB.renovar().then(est => { if(est === 'ok')
    verificarColeta().then(carregarTemas).then(verificarEscopo); });
});
</script>
