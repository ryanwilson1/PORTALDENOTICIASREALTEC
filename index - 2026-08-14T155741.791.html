/* ─────────────────── RELATÓRIO EXECUTIVO ─────────────────── */
function vRelatorio(){
  const k = KPI(), r = rel(), c = crit(), p = pend();
  const hoje = new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const futuras = r.filter(m=>{ const d=diasAte(m.prazo); return d!==null && d>0; })
                   .sort((a,b)=>diasAte(a.prazo)-diasAte(b.prazo));
  const vigentes = r.filter(m=>m.prazo==='Em vigor');
  const acoes = r.filter(m=>m.seis).flatMap(m=>m.seis.fazer.map(f=>({...f, n:m.norma})));
  const porResp = acoes.reduce((o,a)=>{(o[a.r]=o[a.r]||[]).push(a); return o;},{});
  const clientesAtingidos = [...new Set(r.flatMap(m=>clientesDe(m).map(x=>x.id)))]
    .map(id=>CLIENTES.find(x=>x.id===id));

  const B=(n,t,html)=>`<div class="bl"><div class="bl-h"><span class="bl-n">${n}</span>
    <strong>${t}</strong></div>${html}</div>`;

  return `${avisoOrigem()}
  <div class="cab"><h1>Relatório executivo</h1>
    <p>${hoje} · gerado a partir do estado atual do acervo. Feito para ser lido pela diretoria em
       dois minutos e anexado a ata.</p></div>

  ${B(1,'Resumo do dia', `<p>O acervo registra ${r.length} alterações com impacto identificado para a
    Realtec, das quais ${c.length} são críticas e ${p.length} ainda aguardam análise. O alcance chega
    a ${k.clientes} de ${CLIENTES.length} clientes estratégicos e ${k.setores} setores internos.
    ${k.prazoProx!==null ? `O prazo mais próximo vence em ${k.prazoProx} dias.` :
      'Nenhum prazo futuro em curso — o que está aberto já é exigível.'}</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-top:14px">
      ${[[k.criticas,'Críticas','vm'],[k.pendencias,'Pendentes','am'],[k.clientes,'Clientes',''],
         [k.acoes,'Ações',''],[CONFORM.pct+'%','Conformidade','']]
        .map(([v,t,cc])=>`<div style="padding:11px 13px;border-radius:var(--r-m);background:var(--sup-2)">
          <div class="num" style="font-size:18px;font-weight:700;${cc?`color:var(--${cc})`:''}">${v}</div>
          <div style="font-size:11.5px;color:var(--t-2);margin-top:3px">${t}</div></div>`).join('')}
    </div>`)}

  ${B(2,'Mudanças críticas', c.length ? c.map(m=>{
    const e=enr(m);
    return `<div class="lin sim"><svg class="ic ic-p mk"><use href="#k-alerta"/></svg>
      <b>${m.norma}</b><span>${m.titulo}<br>
      <span style="color:var(--t-3);font-size:12px">${e.responsavel} · ${m.prazo} · sanção: ${e.multa}</span></span></div>`;
  }).join('') : '<p>Nenhuma alteração crítica em aberto no período.</p>')}

  ${B(3,'Mudanças importantes', r.filter(m=>m.nivel==='alto').length ?
    r.filter(m=>m.nivel==='alto').map(m=>`<div class="lin sim">
      <svg class="ic ic-p mk"><use href="#k-ok"/></svg><b>${m.norma}</b>
      <span>${m.titulo} — prazo ${m.prazo}.</span></div>`).join('')
    : '<p>Nenhuma alteração de nível importante no período.</p>')}

  ${B(4,'Vigências futuras', futuras.length ? futuras.map(m=>`<div class="lin sim">
      <svg class="ic ic-p mk"><use href="#k-relogio"/></svg><b>${m.norma}</b>
      <span>Entra em vigor em ${m.prazo} — faltam ${diasAte(m.prazo)} dias.</span></div>`).join('')
    : '<p>Nenhuma vigência futura mapeada. Todas as alterações do acervo já são exigíveis.</p>')
    + (vigentes.length?`<div class="motivo" style="margin-top:12px">
      <b>Já exigível hoje:</b> ${vigentes.map(m=>m.norma).join(', ')}. Sem período de tolerância.</div>`:'')}

  ${B(5,'Clientes atingidos', clientesAtingidos.length ? clientesAtingidos.map(cl=>{
      const ms=mudancasDe(cl);
      return `<div class="cli"><span class="cli-a">${cl.sigla}</span>
        <span class="cli-t"><b>${cl.nome}</b>
        <s>${ms.length} alteração${ms.length>1?'ões':''} · ${cl.contratos} contrato${cl.contratos>1?'s':''} · até ${cl.vigencia}</s></span>
        <button class="cli-b" onclick="ir('cliente','${cl.id}')">Abrir</button></div>`;
    }).join('') : '<p>Nenhum cliente atingido pelas alterações do período.</p>')}

  ${B(6,'Pendências e responsáveis', Object.entries(porResp).map(([resp,its])=>`
      <div class="lin sim"><svg class="ic ic-p mk"><use href="#k-users"/></svg>
      <b>${resp}</b><span>${its.length} ação${its.length>1?'ões':''} atribuída${its.length>1?'s':''} —
      prazo mais próximo em ${its.map(i=>i.p).sort()[0]}.</span></div>`).join(''))}

  ${B(7,'Checklist de adequação', acoes.map(a=>`<div class="tarefa">
      <div class="cx" onclick="tick(this)"><svg class="ic ic-p"><use href="#k-tick"/></svg></div>
      <div class="tf"><p>${a.t}</p><s>${a.n} · ${a.r} · até ${a.p}</s></div></div>`).join(''))}

  ${B(8,'Recomendação', `<p>Priorizar o encerramento das ${c.length} pendências críticas antes de
    abrir frente nas de prazo futuro — é a pendência crítica que derruba o índice de conformidade e
    que aparece em auditoria de cliente. Na sequência, tratar as vigências de prazo mais curto.</p>
    <p>Do lado comercial, ${OPORTUNIDADES.filter(o=>o.prazoDias<=30).length} oportunidades no radar
    vencem em até 30 dias e dependem de regularidade documental para habilitação — o mesmo acervo
    que está pendente aqui é o que habilita lá.</p>`)}

  <div class="impacto-emp">
    <div class="h"><svg class="ic"><use href="#k-empresa"/></svg><strong>Conclusão técnica</strong></div>
    <p>${c.length ? `Situação de atenção: há ${c.length} alteração${c.length>1?'ões':''} crítica${c.length>1?'s':''}
      já exigível${c.length>1?'is':''}, com ${k.clientes} clientes no alcance. O risco não é
      teórico — é de autuação e de habilitação em contrato.`
      : 'Ambiente regulatório sob controle: nenhuma alteração crítica em aberto no período.'}
      ${p.length ? ` ${p.length} análise${p.length>1?'s':''} ainda depende${p.length>1?'m':''} de validação humana antes de virar decisão.` : ''}
      Confirme cada dispositivo na fonte oficial antes de formalizar qualquer providência.</p>
  </div>

  <div class="bts">
    <button class="bt pr" onclick="window.print()">Imprimir ou salvar em PDF</button>
    <button class="bt sc" onclick="ir('painel')">Voltar ao painel</button>
  </div>`;
}

      r: c.length ? {n:'vm', t:'Exigível agora', d:c.map(m=>`${m.norma}: ${enr(m).penalidade}`).join(' ')}

      ir:'det:cbs', irT:'Abrir análise da transição'};
  },

    return {t:'O que precisa ser atualizado',
      x:`As ${a.length} ações de prazo mais próximo, na ordem em que vencem. O plano completo tem
         ${rel().filter(m=>m.seis).flatMap(m=>m.seis.fazer).length} ações.`,
      lista:a, r:{n:'am', t:'Documentos que mudam junto',
         d:'PGR, PCMSO, LTCAT, PPP, APR, inventário de riscos, procedimentos operacionais e treinamentos — a mesma alteração costuma alcançar vários deles.'},
      ir:'acoes', irT:'Abrir plano de ação'};
  },
  mercado(){
    const alta = INDICADORES.filter(i=>i.s==='vm'||i.s==='am');
    return {t:'Cenário de mercado',
      x:`${alta.length} indicadores em pressão: ${alta.map(i=>`${i.n} (${i.v})`).join(', ')}.
         Custo de insumo metálico sobe acima do índice de reajuste contratual, o que comprime margem
         em contrato fechado antes de aparecer em qualquer índice oficial.`,
      r:{n:'am', t:'Onde isso dói',
         d:'Contrato longo reajustado por IPCA com escopo elétrico intensivo em cobre. A cláusula de reajuste é o ponto de decisão na renovação.'},
      ir:'mercado', irT:'Abrir inteligência de mercado'};
  },
  radar(){
    const urg = OPORTUNIDADES.filter(o=>o.prazoDias<=30).map(o=>({...o,ad:aderencia(o)}));
    return {t:'Oportunidades',
      x:`${OPORTUNIDADES.length} no radar, ${urg.length} com prazo em até 30 dias.
         ${urg.length?`A de maior aderência é ${urg.sort((a,b)=>b.ad.pct-a.ad.pct)[0].titulo.toLowerCase()}.`:''}`,
      r:{n:'am', t:'Habilitação depende de conformidade',
         d:'Editais de saneamento vêm consolidando exigência documental de SST. A pendência do painel de alertas é a mesma que barra a habilitação.'},
      ir:'radar', irT:'Abrir radar de oportunidades'};
  }
};

function iaTurnoCorp(k){
  const r = IA_CORP[k]();
  return `<div class="msg-a">
    <div class="qm"><svg class="ic ic-p"><use href="#k-ia"/></svg>${r.t}
      <span style="margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0">calculado do acervo</span></div>
    <div class="tx">${r.x}</div>
    ${r.lista?`<div style="margin-top:12px">${r.lista.map(a=>`<div class="tarefa">
      <div class="cx" onclick="tick(this)"><svg class="ic ic-p"><use href="#k-tick"/></svg></div>
      <div class="tf"><p>${a.t}</p><s>${a.n} · ${a.r} · até ${a.p}</s></div></div>`).join('')}</div>`:''}
    ${r.r?`<div class="av-risco ${r.r.n}" style="margin-top:12px">
      <svg class="ic ic-g i"><use href="#k-alerta"/></svg>
      <div><b>${r.r.t}</b><p>${r.r.d}</p></div></div>`:''}
    <button class="atalho-ia" style="margin-top:12px" onclick="fecharIa();ir('${r.ir}')">
      ${r.irT} →</button>
    <div class="conf-x"><div class="fx"><b class="f-alto">Alto</b><s>0,90</s></div>
      <p>Resposta derivada do próprio acervo — os números conferem com o painel no momento da
      pergunta. A confiança não cobre o conteúdo das fontes originais, que segue exigindo
      conferência oficial.</p></div>
  </div>`;
}


/* ═══════════════════════════════════════════════════════════════════════
   ANÁLISE TÉCNICA — blocos 6 a 10 do detalhe
   Continuam a mesma sequência numerada e o mesmo componente .bl das cinco
   perguntas originais. Nada foi retirado; o que havia continua no lugar.
   ═══════════════════════════════════════════════════════════════════════ */
function blocosExtras(m, B){
  const e  = enr(m);
  const cs = clientesDe(m);
  const vd = CNAES.map(cn => ({cn, v:veredito(m, cn)}));
  const sim = vd.filter(x=>x.v.v==='SIM').length;
  const par = vd.filter(x=>x.v.v==='PARCIALMENTE').length;
  const etV = v => v==='SIM'?'vd' : v==='PARCIALMENTE'?'am' : 'nt';
  const prazoD = diasAte(m.prazo);

  const linhaMeta = (r,v)=>`<div class="lin sim" style="align-items:center">
    <svg class="ic ic-p mk" style="opacity:0"><use href="#k-ok"/></svg>
    <b>${r}</b><span>${v}</span></div>`;

  return `
  ${B(6,'Como isto se classifica?', `
    <div class="tags" style="margin-top:0">
      ${e.classes.map(c=>`<span class="tag">${c}</span>`).join('')}</div>
    <div style="margin-top:14px">
      ${linhaMeta('Eixo', rotEixo(m.eixo))}
      ${linhaMeta('Instrumento', `${e.tipo || '—'} · esfera ${e.esfera || '—'}`)}
      ${linhaMeta('Órgão', m.orgao)}
      ${linhaMeta('Publicação', m.data)}
      ${linhaMeta('Prazo', prazoD===null ? `${m.prazo} — sem período de tolerância`
        : `${m.prazo} · faltam ${prazoD} dias`)}
      ${linhaMeta('Responsável', e.responsavel || '—')}
      ${linhaMeta('Nível de risco', m.nivel==='crit'?'🔴 Crítico':m.nivel==='alto'?'🟠 Alto':
        m.nivel==='medio'?'🟡 Médio':'🟢 Informativo')}
    </div>`)}

  ${B(7,'Quais clientes são atingidos?', cs.length ? `
    <p>${cs.length} de ${CLIENTES.length} clientes estratégicos estão no alcance desta alteração.
       O critério é o escopo contratado com cada um, não o porte ou o setor.</p>
    <div style="margin-top:12px">${cs.map(c=>{
      const casa = univ(e) ? 'obrigação geral do empregador'
        : inter(e.atinge, c.tags).map(t=>ETIQUETAS[t].toLowerCase()).join(', ');
      return `<div class="cli"><span class="cli-a">${c.sigla}</span>
        <span class="cli-t"><b>${c.nome}</b><s>${casa}</s></span>
        <button class="cli-b" onclick="ir('cliente','${c.id}')">Abrir</button></div>`;
    }).join('')}</div>`
    : '<p>Nenhum cliente estratégico da carteira é atingido por esta alteração.</p>')}

  ${B(8,'Afeta os CNAEs da empresa?', `
    <p>${sim} de ${CNAES.length} CNAEs cadastrados respondem SIM${par?`, ${par} parcialmente`:''}.
       O veredito é recalculado sempre que o cadastro muda.</p>
    <div style="margin-top:12px">${vd.map(({cn,v})=>`
      <div class="lin ${v.v==='NÃO'?'nao':'sim'}" style="align-items:flex-start">
        <span class="et ${etV(v.v)}" style="flex:none;margin-top:1px;width:auto;font-size:11px;line-height:1.4">
          <span class="pt"></span>${v.v}</span>
        <span style="flex:1"><b style="display:block;font-size:12.5px;font-weight:600;width:auto"
          class="num">${cn.c}</b>${v.just}</span></div>`).join('')}</div>
    <div class="bts"><button class="bt sc" onclick="ir('cnae')">
      Abrir cadastro de CNAEs <svg class="ic ic-p"><use href="#k-dir"/></svg></button></div>`)}

  ${e.vAnterior && e.vAnterior !== '—' ? B(9,'O que muda no texto?', `
    <div class="lei" style="border-left-color:var(--vm)"><p>${e.vAnterior}</p>
      <div class="fn">Redação anterior</div></div>
    <div class="lei" style="border-left-color:var(--vd)"><p>${e.vNova}</p>
      <div class="fn">Redação vigente</div></div>
    <div class="cadeia"><span class="elo">Fonte: ${e.fonte}</span></div>
    <div class="bts"><button class="bt sc" onclick="ir('comparador')">
      Abrir comparador <svg class="ic ic-p"><use href="#k-diff"/></svg></button></div>`) : ''}

  ${e.multa && e.multa !== '—' ? B(10,'Qual a sanção?', `
    <div class="mini" style="margin-top:0"><b>Multa</b><p>${e.multa}</p></div>
    <div class="mini"><b>Penalidade e efeito colateral</b><p>${e.penalidade}</p></div>
    <p style="font-size:12px;color:var(--t-3);margin-top:11px;line-height:1.6">
      Valores e enquadramentos de multa mudam por portaria e por grau de infração.
      Confirme na fonte oficial antes de usar este número em decisão ou em defesa.</p>`) : ''}`;
}

/* ═══════════════════════════════════════════════════════════════════════
   PARTIDA DA EXPANSÃO
   ═══════════════════════════════════════════════════════════════════════ */
/* C19 · Partida.
   A ordem importa: o estado da coleta precisa ser conhecido antes de a
   IA falar sozinha, senão ela comenta um acervo que talvez não exista.
   Nenhuma etapa pode derrubar a seguinte — daí os catch individuais. */
try{ ROTINA.agendar(); }catch(e){ console.error('[CIL] agendador não iniciou', e); }

render();

carregarSessao()
  .catch(e => console.error('[CIL] falha ao carregar sessão', e))
  .then(() => verificarColeta())
  .catch(e => console.error('[CIL] falha ao verificar coleta', e))
  .finally(() => setTimeout(iaProativa, 2600));

/* Sessão renovada também quando a aba volta ao primeiro plano: quem deixa
   o sistema aberto o dia inteiro voltava a uma tela com token vencido. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !SB.tk()) return;
  SB.renovar().then(est => { if(est === 'ok') verificarColeta(); });
});
</script>
</body>
